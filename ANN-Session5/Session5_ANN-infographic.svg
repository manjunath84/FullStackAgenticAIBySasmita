<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-labelledby="ig5aTitle ig5aDesc">
  <title id="ig5aTitle">ANN-Session 5 — Building your first neural network in Keras</title>
  <desc id="ig5aDesc">Visual summary: the 7-step Keras pipeline, cross-entropy vs MSE worked example, overfitting K-pattern, and key corrections.</desc>

  <defs>
    <style>
      .display { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; font-weight: 700; }
      .display-r { font-family: 'Fraunces', serif; font-weight: 700; }
      .body { font-family: 'Spectral', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Menlo', monospace; }
    </style>
    <marker id="ig5aArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8472e"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" fill="#f5efe6"/>

  <text x="60" y="80" class="mono" fill="#b8472e" font-size="13" letter-spacing="6" font-weight="700">ANN · SESSION 05 · VISUAL SUMMARY · KERAS HANDS-ON</text>
  <text x="60" y="160" class="display" fill="#1f1a14" font-size="58">Building your first network</text>
  <text x="60" y="218" class="display" fill="#b8472e" font-size="58">in Keras.</text>
  <line x1="60" y1="252" x2="1140" y2="252" stroke="#1f1a14" stroke-width="2"/>
  <text x="60" y="285" class="body" fill="#4a4239" font-size="18" font-style="italic">Seven steps. Same gradient-descent loop. Cross-entropy + softmax = classification.</text>

  <g transform="translate(60, 340)">
    <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§05 · THE 7-STEP KERAS RECIPE</text>

    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="150" height="80" fill="#2a5d62"/>
      <text x="75" y="20" class="mono" fill="#f5efe6" font-size="11" font-weight="700" text-anchor="middle">STEP 1</text>
      <text x="75" y="40" class="display-r" fill="#f5efe6" font-size="14" text-anchor="middle">Load</text>
      <text x="75" y="62" class="mono" fill="#f5efe6" font-size="9" text-anchor="middle">mnist.load_data()</text>

      <rect x="155" y="0" width="150" height="80" fill="#5ba0a8"/>
      <text x="230" y="20" class="mono" fill="#1f1a14" font-size="11" font-weight="700" text-anchor="middle">STEP 2</text>
      <text x="230" y="40" class="display-r" fill="#1f1a14" font-size="14" text-anchor="middle">Normalize</text>
      <text x="230" y="62" class="mono" fill="#1f1a14" font-size="9" text-anchor="middle">utils.normalize()</text>

      <rect x="310" y="0" width="150" height="80" fill="#c89b3c"/>
      <text x="385" y="20" class="mono" fill="#1f1a14" font-size="11" font-weight="700" text-anchor="middle">STEP 3</text>
      <text x="385" y="40" class="display-r" fill="#1f1a14" font-size="14" text-anchor="middle">Build</text>
      <text x="385" y="62" class="mono" fill="#1f1a14" font-size="9" text-anchor="middle">Sequential([...])</text>

      <rect x="465" y="0" width="150" height="80" fill="#d96d4a"/>
      <text x="540" y="20" class="mono" fill="#f5efe6" font-size="11" font-weight="700" text-anchor="middle">STEP 4</text>
      <text x="540" y="40" class="display-r" fill="#f5efe6" font-size="14" text-anchor="middle">Compile</text>
      <text x="540" y="62" class="mono" fill="#f5efe6" font-size="9" text-anchor="middle">optimizer + loss</text>

      <rect x="620" y="0" width="150" height="80" fill="#b8472e"/>
      <text x="695" y="20" class="mono" fill="#f5efe6" font-size="11" font-weight="700" text-anchor="middle">STEP 5</text>
      <text x="695" y="40" class="display-r" fill="#f5efe6" font-size="14" text-anchor="middle">Fit</text>
      <text x="695" y="62" class="mono" fill="#f5efe6" font-size="9" text-anchor="middle">model.fit(...)</text>

      <rect x="775" y="0" width="150" height="80" fill="#1f1a14"/>
      <text x="850" y="20" class="mono" fill="#c89b3c" font-size="11" font-weight="700" text-anchor="middle">STEP 6</text>
      <text x="850" y="40" class="display-r" fill="#f5efe6" font-size="14" text-anchor="middle">Evaluate</text>
      <text x="850" y="62" class="mono" fill="#f5efe6" font-size="9" text-anchor="middle">model.evaluate()</text>

      <rect x="930" y="0" width="150" height="80" fill="#6db33f"/>
      <text x="1005" y="20" class="mono" fill="#1f1a14" font-size="11" font-weight="700" text-anchor="middle">STEP 7</text>
      <text x="1005" y="40" class="display-r" fill="#1f1a14" font-size="14" text-anchor="middle">Predict</text>
      <text x="1005" y="62" class="mono" fill="#1f1a14" font-size="9" text-anchor="middle">.predict().argmax()</text>
    </g>

    <text x="540" y="130" class="body" fill="#4a4239" font-size="14" font-style="italic" text-anchor="middle">The same recipe scales from MNIST to fine-tuning Llama.</text>
  </g>

  <g transform="translate(60, 540)">
    <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§01 · WHY MSE FAILS — WORKED EXAMPLE</text>

    <rect x="0" y="20" width="1080" height="200" fill="#ede5d6" stroke="#d4c9b5"/>
    <line x1="280" y1="20" x2="280" y2="220" stroke="#d4c9b5"/>
    <line x1="680" y1="20" x2="680" y2="220" stroke="#d4c9b5"/>
    <line x1="0" y1="80" x2="1080" y2="80" stroke="#d4c9b5"/>

    <text x="20" y="50" class="display-r" fill="#1f1a14" font-size="16">CASE</text>
    <text x="20" y="68" class="mono" fill="#8b7d65" font-size="11">actual = [1, 0, 0]</text>

    <text x="300" y="50" class="mono" fill="#2a5d62" font-size="12" font-weight="700">GOOD PREDICTION</text>
    <text x="300" y="68" class="mono" fill="#1f1a14" font-size="12">prediction = [0.7, 0.2, 0.1]</text>

    <text x="700" y="50" class="mono" fill="#b8472e" font-size="12" font-weight="700">BAD PREDICTION</text>
    <text x="700" y="68" class="mono" fill="#1f1a14" font-size="12">prediction = [0.1, 0.3, 0.6]</text>

    <text x="20" y="120" class="display-r" fill="#1f1a14" font-size="14">MSE</text>
    <text x="20" y="142" class="mono" fill="#8b7d65" font-size="10">Σ(ŷ−y)² / N</text>

    <text x="300" y="120" class="mono" fill="#1f1a14" font-size="24" font-weight="700">0.04</text>
    <text x="300" y="148" class="mono" fill="#8b7d65" font-size="10">small loss → small gradient → slow learning</text>

    <text x="700" y="120" class="mono" fill="#b8472e" font-size="24" font-weight="700">0.42</text>
    <text x="700" y="148" class="mono" fill="#8b7d65" font-size="10">still small for a confidently-wrong prediction!</text>

    <text x="20" y="180" class="display-r" fill="#1f1a14" font-size="14">CROSS-ENTROPY</text>
    <text x="20" y="200" class="mono" fill="#8b7d65" font-size="10">-log(y_pred[correct])</text>

    <text x="300" y="180" class="mono" fill="#1f1a14" font-size="24" font-weight="700">0.35</text>
    <text x="300" y="208" class="mono" fill="#8b7d65" font-size="10">-log(0.7)</text>

    <text x="700" y="180" class="mono" fill="#b8472e" font-size="24" font-weight="700">2.30</text>
    <text x="700" y="208" class="mono" fill="#8b7d65" font-size="10">-log(0.1) — 6× the MSE penalty, fast correction</text>
  </g>

  <g transform="translate(60, 800)">
    <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§11 · OVERFITTING DEMO — THE K-PATTERN</text>

    <rect x="0" y="20" width="520" height="240" fill="#ede5d6" stroke="#d4c9b5"/>
    <text x="20" y="44" class="mono" fill="#2a5d62" font-size="12" font-weight="700">GOOD — PARALLEL CURVES</text>
    <line x1="50" y1="220" x2="490" y2="220" stroke="#8b7d65" stroke-width="1"/>
    <line x1="50" y1="80"  x2="50"  y2="220" stroke="#8b7d65" stroke-width="1"/>
    <text x="20" y="90" class="mono" fill="#8b7d65" font-size="9">loss</text>
    <text x="490" y="238" class="mono" fill="#8b7d65" font-size="9" text-anchor="end">epoch</text>
    <path d="M 60 100 Q 200 150, 480 200" fill="none" stroke="#1f1a14" stroke-width="2"/>
    <path d="M 60 115 Q 200 165, 480 213" fill="none" stroke="#5ba0a8" stroke-width="2"/>
    <text x="430" y="190" class="mono" fill="#1f1a14" font-size="10">training</text>
    <text x="430" y="232" class="mono" fill="#5ba0a8" font-size="10">validation</text>

    <rect x="560" y="20" width="520" height="240" fill="#ede5d6" stroke="#d4c9b5"/>
    <text x="580" y="44" class="mono" fill="#b8472e" font-size="12" font-weight="700">BAD — K-PATTERN, OVERFIT</text>
    <line x1="610" y1="220" x2="1050" y2="220" stroke="#8b7d65" stroke-width="1"/>
    <line x1="610" y1="80"  x2="610"  y2="220" stroke="#8b7d65" stroke-width="1"/>
    <text x="580" y="90" class="mono" fill="#8b7d65" font-size="9">loss</text>
    <text x="1050" y="238" class="mono" fill="#8b7d65" font-size="9" text-anchor="end">epoch</text>
    <path d="M 620 110 Q 760 170, 1040 215" fill="none" stroke="#1f1a14" stroke-width="2"/>
    <path d="M 620 130 Q 760 175, 850 155 Q 950 115, 1040 90" fill="none" stroke="#b8472e" stroke-width="2"/>
    <text x="990" y="208" class="mono" fill="#1f1a14" font-size="10">training ↓</text>
    <text x="970" y="100" class="mono" fill="#b8472e" font-size="10">validation ↑</text>

    <text x="540" y="290" class="body" fill="#4a4239" font-size="14" font-style="italic" text-anchor="middle">FIX: add Dropout(0.2-0.5) after each hidden layer, or reduce model capacity.</text>
  </g>

  <g transform="translate(60, 1180)">
    <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">FIVE CORRECTIONS YOU SHOULD CARRY</text>
    <rect x="0" y="14" width="1080" height="230" fill="#f8e6cf" stroke="#b8472e" stroke-dasharray="4 3"/>

    <g transform="translate(20, 38)">
      <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" font-weight="700">1.</text>
      <text x="22" y="0" class="mono" fill="#1f1a14" font-size="12">MSE fails for classification because of gradient magnitude, not "penalty size." softmax+CE gives clean gradients.</text>

      <text x="0" y="32" class="mono" fill="#b8472e" font-size="11" font-weight="700">2.</text>
      <text x="22" y="32" class="mono" fill="#1f1a14" font-size="12">Cross-entropy = -Σ y_actual · log(y_pred). Lecturer's "-Σ yᵢ log(yᵢ)" is entropy, not cross-entropy.</text>

      <text x="0" y="64" class="mono" fill="#b8472e" font-size="11" font-weight="700">3.</text>
      <text x="22" y="64" class="mono" fill="#1f1a14" font-size="12">Categorical and Sparse Categorical CE compute the same loss. Difference is label format (one-hot vs integer).</text>

      <text x="0" y="96" class="mono" fill="#b8472e" font-size="11" font-weight="700">4.</text>
      <text x="22" y="96" class="mono" fill="#1f1a14" font-size="12">Use 80/10/10 train/val/test for deep learning — not 60/40. And NEVER touch test until the very end.</text>

      <text x="0" y="128" class="mono" fill="#b8472e" font-size="11" font-weight="700">5.</text>
      <text x="22" y="128" class="mono" fill="#1f1a14" font-size="12">28 × 28 = 784, not 712. Use Dropout(0.2-0.3) in early layers, 0.5 only when needed.</text>

      <text x="0" y="172" class="mono" fill="#8b7d65" font-size="10" font-style="italic">+ Sequential is for linear TOPOLOGY (no branching), not "linear problems."</text>
      <text x="0" y="190" class="mono" fill="#8b7d65" font-size="10" font-style="italic">+ Softmax probabilities are NOT calibrated confidences (Guo et al. 2017).</text>
      <text x="0" y="208" class="mono" fill="#8b7d65" font-size="10" font-style="italic">+ Random search ≥ grid search empirically (Bergstra &amp; Bengio 2012). Use Hyperband for slow trials.</text>
    </g>
  </g>

  <text x="60" y="1480" class="mono" fill="#8b7d65" font-size="10" letter-spacing="2">ANN-SESSION 05 · 2026-05-20 · SASMITA COURSE</text>
  <text x="1140" y="1480" class="mono" fill="#8b7d65" font-size="10" letter-spacing="2" text-anchor="end">SAME LOOP → FINE-TUNING LLMs</text>
</svg>
