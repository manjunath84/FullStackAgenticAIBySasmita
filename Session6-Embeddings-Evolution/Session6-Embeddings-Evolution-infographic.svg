<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-labelledby="ig6Title ig6Desc">
  <title id="ig6Title">Session 6 — Text becomes a vector: three generations of embedding</title>
  <desc id="ig6Desc">Visual summary of three generations of text embedding: CountVectorizer, Word2Vec, Transformer. Plus the three problems with static embeddings, plus the encoder/decoder taxonomy.</desc>

  <defs>
    <style>
      .display { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; font-weight: 700; }
      .display-r { font-family: 'Fraunces', serif; font-weight: 700; }
      .body { font-family: 'Spectral', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Menlo', monospace; }
    </style>
    <marker id="ig6Arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8472e"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" fill="#f5efe6"/>

  <text x="60" y="80" class="mono" fill="#b8472e" font-size="13" letter-spacing="6" font-weight="700">SESSION 06 · VISUAL SUMMARY · EMBEDDING + TRANSFORMER INTRO</text>
  <text x="60" y="160" class="display" fill="#1f1a14" font-size="58">Text becomes a</text>
  <text x="60" y="218" class="display" fill="#b8472e" font-size="58">vector.</text>
  <line x1="60" y1="252" x2="1140" y2="252" stroke="#1f1a14" stroke-width="2"/>
  <text x="60" y="285" class="body" fill="#4a4239" font-size="18" font-style="italic">Three generations, each fixing the previous one's blind spot.</text>

  <g transform="translate(60, 340)">
    <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§02-06 · THE THREE GENERATIONS</text>

    <rect x="0" y="20" width="340" height="280" fill="#ede5d6" stroke="#d4c9b5"/>
    <rect x="0" y="20" width="340" height="40" fill="#1f1a14"/>
    <text x="170" y="46" class="mono" fill="#c89b3c" font-size="11" font-weight="700" text-anchor="middle">GEN 1 · 2010s</text>
    <text x="20" y="86" class="display-r" fill="#1f1a14" font-size="20">CountVectorizer</text>
    <text x="20" y="108" class="body" fill="#4a4239" font-size="13" font-style="italic">Matrix of word counts</text>

    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="50" height="20" fill="#f5efe6" stroke="#d4c9b5"/>
      <rect x="50" y="0" width="35" height="20" fill="#f5efe6" stroke="#d4c9b5"/>
      <rect x="85" y="0" width="35" height="20" fill="#f5efe6" stroke="#d4c9b5"/>
      <rect x="120" y="0" width="35" height="20" fill="#f5efe6" stroke="#d4c9b5"/>
      <rect x="155" y="0" width="35" height="20" fill="#f5efe6" stroke="#d4c9b5"/>
      <rect x="190" y="0" width="35" height="20" fill="#f5efe6" stroke="#d4c9b5"/>

      <rect x="0" y="20" width="50" height="20" fill="#f5efe6" stroke="#d4c9b5"/>
      <rect x="50" y="20" width="35" height="20" fill="#f8e6cf" stroke="#d4c9b5"/>
      <rect x="85" y="20" width="35" height="20" fill="#f8e6cf" stroke="#d4c9b5"/>
      <rect x="120" y="20" width="35" height="20" fill="#f8e6cf" stroke="#d4c9b5"/>
      <rect x="155" y="20" width="35" height="20" fill="#f8e6cf" stroke="#d4c9b5"/>
      <rect x="190" y="20" width="35" height="20" fill="#f5efe6" stroke="#d4c9b5"/>

      <rect x="0" y="40" width="50" height="20" fill="#f5efe6" stroke="#d4c9b5"/>
      <rect x="50" y="40" width="35" height="20" fill="#f5efe6" stroke="#d4c9b5"/>
      <rect x="85" y="40" width="35" height="20" fill="#f5efe6" stroke="#d4c9b5"/>
      <rect x="120" y="40" width="35" height="20" fill="#f5efe6" stroke="#d4c9b5"/>
      <rect x="155" y="40" width="35" height="20" fill="#f8e6cf" stroke="#d4c9b5"/>
      <rect x="190" y="40" width="35" height="20" fill="#f8e6cf" stroke="#d4c9b5"/>

      <text x="10" y="14" class="mono" fill="#8b7d65" font-size="9" font-weight="700">doc</text>
      <text x="59" y="14" class="mono" fill="#8b7d65" font-size="9">quick</text>
      <text x="94" y="14" class="mono" fill="#8b7d65" font-size="9">fox</text>
      <text x="129" y="14" class="mono" fill="#8b7d65" font-size="9">jump</text>
      <text x="164" y="14" class="mono" fill="#8b7d65" font-size="9">dog</text>
      <text x="200" y="14" class="mono" fill="#8b7d65" font-size="9">learn</text>

      <text x="10" y="34" class="mono" fill="#1f1a14" font-size="11">s1</text>
      <text x="65" y="34" class="mono" fill="#1f1a14" font-size="11">1</text>
      <text x="100" y="34" class="mono" fill="#1f1a14" font-size="11">1</text>
      <text x="135" y="34" class="mono" fill="#1f1a14" font-size="11">1</text>
      <text x="170" y="34" class="mono" fill="#1f1a14" font-size="11">0</text>
      <text x="205" y="34" class="mono" fill="#1f1a14" font-size="11">0</text>

      <text x="10" y="54" class="mono" fill="#1f1a14" font-size="11">s2</text>
      <text x="65" y="54" class="mono" fill="#1f1a14" font-size="11">0</text>
      <text x="100" y="54" class="mono" fill="#1f1a14" font-size="11">0</text>
      <text x="135" y="54" class="mono" fill="#1f1a14" font-size="11">1</text>
      <text x="170" y="54" class="mono" fill="#1f1a14" font-size="11">2</text>
      <text x="205" y="54" class="mono" fill="#1f1a14" font-size="11">1</text>
    </g>

    <text x="20" y="218" class="mono" fill="#b8472e" font-size="10" font-weight="700">CAN'T:</text>
    <text x="20" y="234" class="mono" fill="#4a4239" font-size="11">capture similar meaning</text>
    <text x="20" y="250" class="mono" fill="#4a4239" font-size="11">("good" ≠ "great")</text>
    <text x="20" y="278" class="mono" fill="#8b7d65" font-size="10" font-style="italic">sklearn.CountVectorizer</text>

    <rect x="370" y="20" width="340" height="280" fill="#ede5d6" stroke="#d4c9b5"/>
    <rect x="370" y="20" width="340" height="40" fill="#2a5d62"/>
    <text x="540" y="46" class="mono" fill="#f5efe6" font-size="11" font-weight="700" text-anchor="middle">GEN 2 · 2013 (Mikolov)</text>
    <text x="390" y="86" class="display-r" fill="#1f1a14" font-size="20">Word2Vec</text>
    <text x="390" y="108" class="body" fill="#4a4239" font-size="13" font-style="italic">One static vector per word</text>

    <text x="390" y="138" class="mono" fill="#1f1a14" font-size="11">vec("king")  = [0.21, 0.45, …]</text>
    <text x="390" y="156" class="mono" fill="#1f1a14" font-size="11">vec("queen") = [0.20, 0.48, …]</text>
    <text x="390" y="174" class="mono" fill="#1f1a14" font-size="11">vec("apple") = [0.66, 0.31, …]</text>
    <text x="390" y="200" class="mono" fill="#2a5d62" font-size="11" font-style="italic">king − man + woman ≈ queen</text>

    <text x="390" y="224" class="mono" fill="#b8472e" font-size="10" font-weight="700">CAN'T:</text>
    <text x="390" y="240" class="mono" fill="#4a4239" font-size="11">context · polysemy · order</text>
    <text x="390" y="258" class="mono" fill="#4a4239" font-size="11">(see §4 — three problems)</text>
    <text x="390" y="278" class="mono" fill="#8b7d65" font-size="10" font-style="italic">gensim.models.Word2Vec</text>

    <rect x="740" y="20" width="340" height="280" fill="#ede5d6" stroke="#d4c9b5"/>
    <rect x="740" y="20" width="340" height="40" fill="#b8472e"/>
    <text x="910" y="46" class="mono" fill="#f5efe6" font-size="11" font-weight="700" text-anchor="middle">GEN 3 · 2017 (Vaswani et al.)</text>
    <text x="760" y="86" class="display-r" fill="#1f1a14" font-size="20">Transformer</text>
    <text x="760" y="108" class="body" fill="#4a4239" font-size="13" font-style="italic">Contextual vectors</text>

    <text x="760" y="138" class="mono" fill="#1f1a14" font-size="11">"apple is red"</text>
    <text x="760" y="154" class="mono" fill="#1f1a14" font-size="11">→ vec_apple = [0.7, 0.3, …]</text>
    <text x="760" y="180" class="mono" fill="#1f1a14" font-size="11">"Apple stock fell"</text>
    <text x="760" y="196" class="mono" fill="#1f1a14" font-size="11">→ vec_apple = [0.1, 0.9, …]</text>
    <text x="760" y="220" class="mono" fill="#b8472e" font-size="10" font-weight="700">SAME WORD, DIFFERENT VECTORS</text>

    <text x="760" y="246" class="mono" fill="#2a5d62" font-size="10" font-weight="700">ADDS:</text>
    <text x="760" y="262" class="mono" fill="#4a4239" font-size="11">positional encoding + attention</text>
    <text x="760" y="278" class="mono" fill="#8b7d65" font-size="10" font-style="italic">"Attention Is All You Need"</text>

    <line x1="342" y1="160" x2="368" y2="160" stroke="#b8472e" stroke-width="2" marker-end="url(#ig6Arrow)"/>
    <line x1="712" y1="160" x2="738" y2="160" stroke="#b8472e" stroke-width="2" marker-end="url(#ig6Arrow)"/>
  </g>

  <g transform="translate(60, 720)">
    <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§04 · WHY WORD2VEC NEEDED A REPLACEMENT — THREE PROBLEMS</text>

    <rect x="0" y="20" width="350" height="180" fill="#f8e6cf" stroke="#b8472e" stroke-width="1"/>
    <text x="20" y="46" class="mono" fill="#b8472e" font-size="11" font-weight="700">1 · NO CONTEXT</text>
    <text x="20" y="76" class="body" fill="#1f1a14" font-size="14" font-style="italic">"Ram is a good boy."</text>
    <text x="20" y="96" class="body" fill="#1f1a14" font-size="14" font-style="italic">"He is going to school."</text>
    <text x="20" y="130" class="mono" fill="#4a4239" font-size="11">vec("he") is the same vector</text>
    <text x="20" y="146" class="mono" fill="#4a4239" font-size="11">whether or not Ram came before.</text>
    <text x="20" y="172" class="mono" fill="#2a5d62" font-size="11" font-weight="700">FIXED BY: attention</text>

    <rect x="370" y="20" width="350" height="180" fill="#f8e6cf" stroke="#b8472e" stroke-width="1"/>
    <text x="390" y="46" class="mono" fill="#b8472e" font-size="11" font-weight="700">2 · POLYSEMY</text>
    <text x="390" y="76" class="body" fill="#1f1a14" font-size="14" font-style="italic">"This apple is red."</text>
    <text x="390" y="96" class="body" fill="#1f1a14" font-size="14" font-style="italic">"I bought an Apple phone."</text>
    <text x="390" y="130" class="mono" fill="#4a4239" font-size="11">Same vector for both senses.</text>
    <text x="390" y="146" class="mono" fill="#4a4239" font-size="11">A blurry compromise — neither.</text>
    <text x="390" y="172" class="mono" fill="#2a5d62" font-size="11" font-weight="700">FIXED BY: contextualised embeds</text>

    <rect x="740" y="20" width="340" height="180" fill="#f8e6cf" stroke="#b8472e" stroke-width="1"/>
    <text x="760" y="46" class="mono" fill="#b8472e" font-size="11" font-weight="700">3 · ORDER-BLINDNESS</text>
    <text x="760" y="76" class="body" fill="#1f1a14" font-size="14" font-style="italic">"bird sky fly"</text>
    <text x="760" y="92" class="body" fill="#1f1a14" font-size="14" font-style="italic">"fly sky bird"</text>
    <text x="760" y="108" class="body" fill="#1f1a14" font-size="14" font-style="italic">"bird fly sky"</text>
    <text x="760" y="138" class="mono" fill="#4a4239" font-size="11">All three encode identically</text>
    <text x="760" y="154" class="mono" fill="#4a4239" font-size="11">in count-vec or averaged W2V.</text>
    <text x="760" y="180" class="mono" fill="#2a5d62" font-size="11" font-weight="700">FIXED BY: positional encoding</text>
  </g>

  <g transform="translate(60, 960)">
    <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§08 · ARCHITECTURE TAXONOMY — WHICH BLOCK FOR WHICH TASK</text>

    <rect x="0" y="20" width="1080" height="200" fill="#ede5d6" stroke="#d4c9b5"/>
    <line x1="360" y1="20" x2="360" y2="220" stroke="#d4c9b5"/>
    <line x1="720" y1="20" x2="720" y2="220" stroke="#d4c9b5"/>
    <line x1="0" y1="60" x2="1080" y2="60" stroke="#d4c9b5"/>

    <text x="180" y="46" class="mono" fill="#2a5d62" font-size="12" font-weight="700" text-anchor="middle">ENCODER-ONLY</text>
    <text x="540" y="46" class="mono" fill="#b8472e" font-size="12" font-weight="700" text-anchor="middle">DECODER-ONLY</text>
    <text x="900" y="46" class="mono" fill="#c89b3c" font-size="12" font-weight="700" text-anchor="middle">ENCODER-DECODER</text>

    <text x="180" y="92" class="display-r" fill="#1f1a14" font-size="18" text-anchor="middle">BERT family</text>
    <text x="180" y="112" class="mono" fill="#8b7d65" font-size="11" text-anchor="middle">RoBERTa, DistilBERT, Sentence-BERT</text>

    <text x="540" y="92" class="display-r" fill="#1f1a14" font-size="18" text-anchor="middle">GPT family</text>
    <text x="540" y="112" class="mono" fill="#8b7d65" font-size="11" text-anchor="middle">GPT, Claude, Llama, Mistral, Gemma</text>

    <text x="900" y="92" class="display-r" fill="#1f1a14" font-size="18" text-anchor="middle">T5 / BART</text>
    <text x="900" y="112" class="mono" fill="#8b7d65" font-size="11" text-anchor="middle">also Whisper (speech→text)</text>

    <text x="180" y="146" class="mono" fill="#1f1a14" font-size="11" font-weight="700" text-anchor="middle">USE FOR:</text>
    <text x="180" y="164" class="mono" fill="#4a4239" font-size="11" text-anchor="middle">· classification</text>
    <text x="180" y="180" class="mono" fill="#4a4239" font-size="11" text-anchor="middle">· NER / token labelling</text>
    <text x="180" y="196" class="mono" fill="#4a4239" font-size="11" text-anchor="middle">· retrieval embeddings</text>

    <text x="540" y="146" class="mono" fill="#1f1a14" font-size="11" font-weight="700" text-anchor="middle">USE FOR:</text>
    <text x="540" y="164" class="mono" fill="#4a4239" font-size="11" text-anchor="middle">· chat / generation</text>
    <text x="540" y="180" class="mono" fill="#4a4239" font-size="11" text-anchor="middle">· code completion</text>
    <text x="540" y="196" class="mono" fill="#4a4239" font-size="11" text-anchor="middle">· agents (modern LLMs)</text>

    <text x="900" y="146" class="mono" fill="#1f1a14" font-size="11" font-weight="700" text-anchor="middle">USE FOR:</text>
    <text x="900" y="164" class="mono" fill="#4a4239" font-size="11" text-anchor="middle">· translation</text>
    <text x="900" y="180" class="mono" fill="#4a4239" font-size="11" text-anchor="middle">· summarisation</text>
    <text x="900" y="196" class="mono" fill="#4a4239" font-size="11" text-anchor="middle">· seq-to-seq (different input/output)</text>
  </g>

  <g transform="translate(60, 1220)">
    <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">FIVE CORRECTIONS YOU SHOULD CARRY</text>
    <rect x="0" y="14" width="1080" height="190" fill="#f8e6cf" stroke="#b8472e" stroke-dasharray="4 3"/>

    <g transform="translate(20, 38)">
      <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" font-weight="700">1.</text>
      <text x="22" y="0" class="mono" fill="#1f1a14" font-size="12">Word2Vec dimensions are <tspan font-style="italic">not</tspan> labelled topics ("animal", "fruit"). They're uninterpretable latent dimensions.</text>

      <text x="0" y="28" class="mono" fill="#b8472e" font-size="11" font-weight="700">2.</text>
      <text x="22" y="28" class="mono" fill="#1f1a14" font-size="12">Between Word2Vec (2013) and Transformer (2017), ELMo (Feb 2018) and BERT (Oct 2018) bridged static → contextual.</text>

      <text x="0" y="56" class="mono" fill="#b8472e" font-size="11" font-weight="700">3.</text>
      <text x="22" y="56" class="mono" fill="#1f1a14" font-size="12">"Large" in LLM means parameters AND data, scaled together. See Kaplan 2020, Hoffmann 2022 (scaling laws).</text>

      <text x="0" y="84" class="mono" fill="#b8472e" font-size="11" font-weight="700">4.</text>
      <text x="22" y="84" class="mono" fill="#1f1a14" font-size="12">Transformer alone didn't cause the AI explosion — GPU scale, data scale, and infrastructure money all mattered too.</text>

      <text x="0" y="112" class="mono" fill="#b8472e" font-size="11" font-weight="700">5.</text>
      <text x="22" y="112" class="mono" fill="#1f1a14" font-size="12">Decoder predicts the next <tspan font-style="italic">token</tspan> (subword), not the next word. That's why API providers bill per token.</text>

      <text x="0" y="148" class="mono" fill="#8b7d65" font-size="10" font-style="italic">+ corpus ≠ vocabulary (still). Plus: diffusion models displaced GANs for image gen since 2022.</text>
    </g>
  </g>

  <text x="60" y="1480" class="mono" fill="#8b7d65" font-size="10" letter-spacing="2">SESSION 06 · 2026-05-19 · SASMITA COURSE</text>
  <text x="1140" y="1480" class="mono" fill="#8b7d65" font-size="10" letter-spacing="2" text-anchor="end">NEXT → SESSION 07 · TRANSFORMER ENCODER</text>
</svg>
