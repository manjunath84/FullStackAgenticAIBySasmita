<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2100" font-family="'Spectral', 'Iowan Old Style', Georgia, serif">
<defs>
<style>
.paper { fill: #f5efe6; }
.paper-2 { fill: #ede5d6; }
.ink { fill: #1f1a14; }
.ink-soft { fill: #4a4239; }
.ink-mute { fill: #8b7d65; }
.terracotta { fill: #b8472e; }
.terracotta-light { fill: #d96d4a; }
.teal { fill: #2a5d62; }
.teal-soft { fill: #5ba0a8; }
.ochre { fill: #c89b3c; }
.highlight { fill: #f8e6cf; }
.spring { fill: #6db33f; }
.line-stroke { stroke: #d4c9b5; }
.mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
.display { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; }
</style>
<pattern id="dots13" patternUnits="userSpaceOnUse" width="100" height="100">
<circle cx="20" cy="30" r="0.6" fill="#1f1a14" opacity="0.06"/>
<circle cx="70" cy="80" r="0.5" fill="#1f1a14" opacity="0.04"/>
</pattern>
</defs>

<rect width="1100" height="2100" class="paper"/>
<rect width="1100" height="2100" fill="url(#dots13)"/>

<!-- HEADER -->
<text x="60" y="80" class="mono terracotta" font-size="13" font-weight="700" letter-spacing="6">SESSION 13 · RAG · PART 2</text>
<text x="60" y="170" class="display ink" font-size="80" font-weight="700" letter-spacing="-1">Retrieving the</text>
<text x="60" y="250" class="display terracotta" font-size="80" font-weight="700" letter-spacing="-1">right chunks.</text>
<line x1="60" y1="280" x2="1040" y2="280" stroke="#1f1a14" stroke-width="2"/>
<text x="60" y="320" class="ink-soft display" font-size="22">Question in. Cosine similarity. Top-k. Stuff into prompt. LLM out.</text>
<text x="60" y="345" class="ink-soft display" font-size="22">One composed chain, end to end.</text>
<text x="60" y="385" class="mono ink-mute" font-size="11" letter-spacing="2">66 MIN · LANGCHAIN LCEL · CHATPROMPTTEMPLATE · RUNNABLEPASSTHROUGH · STUFF CHAIN</text>

<!-- THE BIG IDEA -->
<g transform="translate(60, 430)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE READ PATH</text>
  <rect x="0" y="20" width="980" height="180" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-width="2"/>
  <text x="24" y="58" class="display ink" font-size="22" font-weight="700">Session 12 indexed the store. Session 13 reads from it.</text>
  <text x="24" y="86" class="display ink" font-size="22" font-weight="700">Same store, two views: <tspan class="terracotta">debug</tspan> view and <tspan class="terracotta">chain</tspan> view.</text>
  <text x="24" y="124" class="ink-soft" font-size="15">similarity_search returns a List[Document] — readable, useful for debugging.</text>
  <text x="24" y="146" class="ink-soft" font-size="15">as_retriever returns a Runnable — opaque, pipeable, used in production chains.</text>
  <text x="24" y="180" class="mono ink-mute" font-size="12" letter-spacing="1">SAME ALGORITHM · DIFFERENT INTERFACES · PICK BY USE CASE</text>
</g>

<!-- TWO VIEWS -->
<g transform="translate(60, 660)">
  <text class="mono ochre" font-size="11" font-weight="700" letter-spacing="3">TWO VIEWS OF THE SAME SEARCH</text>

  <rect x="0" y="20" width="475" height="240" fill="rgba(200, 155, 60, 0.08)" stroke="#c89b3c" stroke-width="1"/>
  <text x="20" y="50" class="display ink" font-size="20" font-weight="700">similarity_search</text>
  <text x="20" y="78" class="mono ink-soft" font-size="11">vector_store.similarity_search(q, k=4)</text>
  <text x="20" y="108" class="ink-soft" font-size="14">Returns List[Document] directly.</text>
  <text x="20" y="128" class="ink-soft" font-size="14">You can read each chunk's text.</text>
  <text x="20" y="158" class="ink-soft" font-size="14">Use when retrieval looks wrong</text>
  <text x="20" y="176" class="ink-soft" font-size="14">and you want to see what came back.</text>
  <text x="20" y="216" class="display ink-soft" font-size="15" font-style="italic">The debug instrument.</text>

  <rect x="505" y="20" width="475" height="240" fill="rgba(42, 93, 98, 0.06)" stroke="#2a5d62" stroke-width="2"/>
  <text x="525" y="50" class="display teal" font-size="20" font-weight="700">as_retriever</text>
  <text x="525" y="78" class="mono ink-soft" font-size="11">vector_store.as_retriever(k=4)</text>
  <text x="525" y="108" class="ink-soft" font-size="14">Returns a Runnable.</text>
  <text x="525" y="128" class="ink-soft" font-size="14">Opaque — you can't read output</text>
  <text x="525" y="146" class="ink-soft" font-size="14">until you invoke it.</text>
  <text x="525" y="176" class="ink-soft" font-size="14">Pipeable in LCEL chains.</text>
  <text x="525" y="216" class="display teal" font-size="15" font-style="italic">The production instrument.</text>
</g>

<!-- THE CHAIN -->
<g transform="translate(60, 950)">
  <text class="mono teal" font-size="11" font-weight="700" letter-spacing="3">THE STUFF CHAIN — ONLINE / PER QUESTION</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">Question fans out. Context and question rejoin.</text>

  <!-- Visual: chain graph -->
  <g transform="translate(0, 60)">

    <!-- Input -->
    <rect x="380" y="0" width="220" height="60" fill="#1f1a14"/>
    <text x="490" y="28" text-anchor="middle" fill="#f5efe6" class="mono" font-size="12" letter-spacing="2" font-weight="700">USER QUESTION</text>
    <text x="490" y="48" text-anchor="middle" fill="#f8e6cf" class="mono" font-size="10">string</text>

    <!-- Fork lines -->
    <line x1="490" y1="60" x2="200" y2="100" stroke="#1f1a14" stroke-width="2"/>
    <line x1="490" y1="60" x2="780" y2="100" stroke="#1f1a14" stroke-width="2"/>

    <!-- Left branch: retriever -->
    <rect x="80" y="100" width="240" height="60" fill="#2a5d62"/>
    <text x="200" y="128" text-anchor="middle" fill="#f5efe6" class="mono" font-size="12" letter-spacing="2" font-weight="700">RETRIEVER</text>
    <text x="200" y="148" text-anchor="middle" fill="#5ba0a8" class="mono" font-size="10">similarity_search · k=4</text>

    <text x="200" y="180" text-anchor="middle" class="ink" font-size="20" font-weight="700">↓</text>

    <rect x="80" y="190" width="240" height="60" fill="#5ba0a8"/>
    <text x="200" y="218" text-anchor="middle" fill="#1f1a14" class="mono" font-size="12" letter-spacing="2" font-weight="700">FORMAT_DOCS</text>
    <text x="200" y="238" text-anchor="middle" fill="#1f1a14" class="mono" font-size="10">List[Document] → string</text>

    <!-- Right branch: passthrough -->
    <rect x="660" y="100" width="240" height="60" fill="#b8472e"/>
    <text x="780" y="128" text-anchor="middle" fill="#f5efe6" class="mono" font-size="12" letter-spacing="2" font-weight="700">RUNNABLEPASSTHROUGH</text>
    <text x="780" y="148" text-anchor="middle" fill="#f8e6cf" class="mono" font-size="10">identity · question forwarded</text>

    <text x="780" y="180" text-anchor="middle" class="ink" font-size="20" font-weight="700">↓</text>

    <rect x="660" y="190" width="240" height="60" fill="#d96d4a"/>
    <text x="780" y="218" text-anchor="middle" fill="#1f1a14" class="mono" font-size="12" letter-spacing="2" font-weight="700">QUESTION</text>
    <text x="780" y="238" text-anchor="middle" fill="#1f1a14" class="mono" font-size="10">unchanged string</text>

    <!-- Join lines -->
    <line x1="200" y1="250" x2="490" y2="290" stroke="#1f1a14" stroke-width="2"/>
    <line x1="780" y1="250" x2="490" y2="290" stroke="#1f1a14" stroke-width="2"/>

    <!-- Prompt template -->
    <rect x="320" y="290" width="340" height="60" fill="#c89b3c"/>
    <text x="490" y="318" text-anchor="middle" fill="#1f1a14" class="mono" font-size="12" letter-spacing="2" font-weight="700">CHATPROMPTTEMPLATE</text>
    <text x="490" y="338" text-anchor="middle" fill="#1f1a14" class="mono" font-size="10">substitutes &#123;context&#125; and &#123;question&#125;</text>

    <text x="490" y="370" text-anchor="middle" class="ink" font-size="20" font-weight="700">↓</text>

    <!-- LLM -->
    <rect x="320" y="380" width="340" height="60" fill="#1f1a14"/>
    <text x="490" y="408" text-anchor="middle" fill="#f5efe6" class="mono" font-size="12" letter-spacing="2" font-weight="700">CHATOPENAI · TEMPERATURE 0</text>
    <text x="490" y="428" text-anchor="middle" fill="#f8e6cf" class="mono" font-size="10">greedy decoding · most reproducible</text>

    <text x="490" y="460" text-anchor="middle" class="ink" font-size="20" font-weight="700">↓</text>

    <!-- Output -->
    <rect x="380" y="470" width="220" height="60" fill="rgba(109, 179, 63, 0.15)" stroke="#6db33f" stroke-width="2"/>
    <text x="490" y="498" text-anchor="middle" fill="#1f1a14" class="mono" font-size="12" letter-spacing="2" font-weight="700">AIMESSAGE</text>
    <text x="490" y="518" text-anchor="middle" fill="#1f1a14" class="mono" font-size="10">grounded answer</text>
  </g>
</g>

<!-- CODE BLOCK -->
<g transform="translate(60, 1580)">
  <text class="mono ink-mute" font-size="11" font-weight="700" letter-spacing="3">THE CODE — ONE COMPOSED RUNNABLE</text>
  <rect x="0" y="20" width="980" height="180" fill="#1f1a14"/>
  <text x="24" y="50" fill="#f8e6cf" class="mono" font-size="13">stuff_chain = (</text>
  <text x="24" y="72" fill="#f8e6cf" class="mono" font-size="13">    &#123;"context": retriever | format_docs, "question": RunnablePassthrough()&#125;</text>
  <text x="24" y="94" fill="#f8e6cf" class="mono" font-size="13">    | stuff_prompt</text>
  <text x="24" y="116" fill="#f8e6cf" class="mono" font-size="13">    | llm</text>
  <text x="24" y="138" fill="#f8e6cf" class="mono" font-size="13">)</text>
  <text x="24" y="172" fill="#5ba0a8" class="mono" font-size="13">answer = stuff_chain.invoke("How many orgs use Databricks?")</text>
</g>

<!-- DEBUG STORY -->
<g transform="translate(60, 1800)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">LIVE DEBUG · WHEN RETRIEVAL SILENTLY RETURNS NOTHING</text>
  <rect x="0" y="20" width="980" height="130" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="22" y="50" class="display ink" font-size="18" font-weight="700">Symptom: confident answers, but ungrounded — Unity Catalog "is a Udemy platform…"</text>
  <text x="22" y="76" class="ink-soft" font-size="14">Diagnostic: <tspan class="mono" font-size="12">vector_store.similarity_search(q, k=4)</tspan> returned <tspan class="mono terracotta" font-size="13" font-weight="700">[]</tspan>. Empty.</text>
  <text x="22" y="98" class="ink-soft" font-size="14">Cause: cells run out of order. <tspan class="mono" font-size="12">add_documents(chunks)</tspan> never executed after kernel reset.</text>
  <text x="22" y="120" class="ink-soft" font-size="14">Fix: restart kernel, run cells top to bottom. Lesson: similarity_search is your first debug tool.</text>
</g>

<!-- JAVA / SPRING BRIDGE -->
<g transform="translate(60, 1965)">
  <rect x="0" y="0" width="980" height="100" fill="rgba(109, 179, 63, 0.07)" stroke="#6db33f" stroke-width="2"/>
  <rect x="0" y="0" width="6" height="100" fill="#6db33f"/>
  <text x="22" y="28" class="mono spring" font-size="11" letter-spacing="3" font-weight="700">JAVA / SPRING BRIDGE</text>
  <text x="22" y="56" class="display ink" font-size="18" font-weight="700">LCEL's | is Java 8's Function.andThen() — functional composition, not Spring DI.</text>
  <text x="22" y="82" class="ink-soft" font-size="13">Every runnable is a Function&lt;Input,Output&gt;. The dict branch is a parallel fan-out, like CompletableFuture.allOf().</text>
</g>

<!-- FOOTER -->
<g transform="translate(60, 2080)">
  <line x1="0" y1="-10" x2="980" y2="-10" stroke="#1f1a14" stroke-width="1"/>
  <text x="0" y="12" class="mono ink-mute" font-size="11" letter-spacing="3">SASMITA COURSE · SESSION 13 · 2026-05-19</text>
  <text x="980" y="12" text-anchor="end" class="mono ink-mute" font-size="11" letter-spacing="3">RE-RANKERS &amp; MMR → SESSION 14</text>
</g>

</svg>
