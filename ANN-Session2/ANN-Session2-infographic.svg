<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-labelledby="infoTitle infoDesc">
  <title id="infoTitle">ANN-Session 2 — The training loop, on one page</title>
  <desc id="infoDesc">Visual summary of the neural network training loop: random initialization, forward pass, loss, backpropagation, weight update; plus activation functions, hidden layers, gradient descent, and learning rate.</desc>

  <defs>
    <style>
      .ig-bg { fill: #f5efe6; }
      .ig-ink { fill: #1f1a14; }
      .ig-ink-soft { fill: #4a4239; }
      .ig-ink-mute { fill: #8b7d65; }
      .ig-terra { fill: #b8472e; }
      .ig-terra-light { fill: #d96d4a; }
      .ig-teal { fill: #2a5d62; }
      .ig-teal-light { fill: #5ba0a8; }
      .ig-ochre { fill: #c89b3c; }
      .ig-line { stroke: #d4c9b5; }
      .ig-highlight { fill: #f8e6cf; }
      .ig-spring { fill: #6db33f; }
      .display { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; font-weight: 700; }
      .display-r { font-family: 'Fraunces', serif; font-weight: 700; }
      .body { font-family: 'Spectral', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'Menlo', monospace; }
    </style>

    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1a14" />
    </marker>
    <marker id="arrowTerra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8472e" />
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d62" />
    </marker>
  </defs>

  <rect class="ig-bg" width="1200" height="1500" />

  <g>
    <text x="60" y="80" class="mono ig-terra" font-size="13" letter-spacing="6" font-weight="700">ANN · SESSION 02 · VISUAL SUMMARY</text>
    <text x="60" y="160" class="display ig-ink" font-size="64">How a neural network</text>
    <text x="60" y="222" class="display ig-terra" font-size="64">actually learns.</text>
    <line x1="60" y1="260" x2="1140" y2="260" stroke="#1f1a14" stroke-width="2"/>
    <text x="60" y="295" class="body ig-ink-soft" font-size="20" font-style="italic">Forward pass, measure error, nudge the weights opposite the gradient — repeat.</text>
  </g>

  <g transform="translate(600, 600)">
    <text x="0" y="-235" class="mono ig-terra" font-size="12" letter-spacing="4" font-weight="700" text-anchor="middle">THE TRAINING LOOP</text>

    <g transform="translate(0,-180)">
      <circle r="68" fill="#1f1a14"/>
      <text y="-12" class="mono" font-size="11" letter-spacing="2" fill="#c89b3c" text-anchor="middle" font-weight="700">STEP 0</text>
      <text y="8" class="display-r" font-size="16" fill="#f5efe6" text-anchor="middle">Random</text>
      <text y="28" class="display-r" font-size="16" fill="#f5efe6" text-anchor="middle">init</text>
    </g>

    <g transform="translate(170,-56)">
      <circle r="68" fill="#2a5d62"/>
      <text y="-18" class="mono" font-size="11" letter-spacing="2" fill="#f5efe6" text-anchor="middle" font-weight="700">STEP 1</text>
      <text y="4" class="display-r" font-size="16" fill="#f5efe6" text-anchor="middle">Forward</text>
      <text y="24" class="display-r" font-size="16" fill="#f5efe6" text-anchor="middle">pass</text>
      <text y="42" class="mono" font-size="10" fill="#f5efe6" text-anchor="middle">ŷ = φ(Wx+b)</text>
    </g>

    <g transform="translate(105,150)">
      <circle r="68" fill="#c89b3c"/>
      <text y="-18" class="mono" font-size="11" letter-spacing="2" fill="#1f1a14" text-anchor="middle" font-weight="700">STEP 2</text>
      <text y="4" class="display-r" font-size="16" fill="#1f1a14" text-anchor="middle">Measure</text>
      <text y="24" class="display-r" font-size="16" fill="#1f1a14" text-anchor="middle">error</text>
      <text y="42" class="mono" font-size="10" fill="#1f1a14" text-anchor="middle">J = (ŷ−y)²</text>
    </g>

    <g transform="translate(-105,150)">
      <circle r="68" fill="#b8472e"/>
      <text y="-18" class="mono" font-size="11" letter-spacing="2" fill="#f5efe6" text-anchor="middle" font-weight="700">STEP 3</text>
      <text y="4" class="display-r" font-size="16" fill="#f5efe6" text-anchor="middle">Back-</text>
      <text y="24" class="display-r" font-size="16" fill="#f5efe6" text-anchor="middle">prop</text>
      <text y="42" class="mono" font-size="10" fill="#f5efe6" text-anchor="middle">∂J/∂w via chain</text>
    </g>

    <g transform="translate(-170,-56)">
      <circle r="68" fill="#6db33f"/>
      <text y="-18" class="mono" font-size="11" letter-spacing="2" fill="#1f1a14" text-anchor="middle" font-weight="700">STEP 4</text>
      <text y="4" class="display-r" font-size="16" fill="#1f1a14" text-anchor="middle">Update</text>
      <text y="24" class="display-r" font-size="16" fill="#1f1a14" text-anchor="middle">weights</text>
      <text y="42" class="mono" font-size="10" fill="#1f1a14" text-anchor="middle">w ← w − η·∂J/∂w</text>
    </g>

    <path d="M 55 -150 A 180 180 0 0 1 130 -100" fill="none" stroke="#1f1a14" stroke-width="2" marker-end="url(#arrowDark)"/>
    <path d="M 175 12 A 180 180 0 0 1 145 105" fill="none" stroke="#1f1a14" stroke-width="2" marker-end="url(#arrowDark)"/>
    <path d="M 40 175 A 100 100 0 0 1 -55 175" fill="none" stroke="#1f1a14" stroke-width="2" marker-end="url(#arrowDark)"/>
    <path d="M -150 100 A 180 180 0 0 1 -180 10" fill="none" stroke="#1f1a14" stroke-width="2" marker-end="url(#arrowDark)"/>
    <path d="M -130 -95 A 220 220 0 0 1 110 -100" fill="none" stroke="#b8472e" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowTerra)"/>
    <text x="0" y="-65" class="mono ig-terra" font-size="12" text-anchor="middle" font-weight="700">repeat · 1000s of times</text>

    <text x="0" y="10" class="display ig-ink" font-size="22" text-anchor="middle">This is</text>
    <text x="0" y="42" class="display ig-terra" font-size="22" text-anchor="middle">the whole game.</text>
  </g>

  <g transform="translate(60, 880)">
    <text x="0" y="0" class="mono ig-terra" font-size="11" letter-spacing="3" font-weight="700">§02 · ACTIVATION MENU</text>
    <text x="0" y="32" class="display ig-ink" font-size="22">Hidden vs output layer</text>

    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="170" height="120" fill="#ffffff" stroke="#d4c9b5"/>
      <text x="10" y="22" class="mono ig-ink" font-size="12" font-weight="700">ReLU</text>
      <text x="10" y="38" class="mono ig-ink-mute" font-size="10">max(0, z)</text>
      <line x1="20" y1="100" x2="160" y2="100" stroke="#8b7d65" stroke-width="1"/>
      <line x1="90" y1="50" x2="90" y2="110" stroke="#8b7d65" stroke-width="1"/>
      <polyline points="20,100 90,100 160,50" fill="none" stroke="#b8472e" stroke-width="3"/>
    </g>

    <g transform="translate(190, 60)">
      <rect x="0" y="0" width="170" height="120" fill="#ffffff" stroke="#d4c9b5"/>
      <text x="10" y="22" class="mono ig-ink" font-size="12" font-weight="700">Sigmoid</text>
      <text x="10" y="38" class="mono ig-ink-mute" font-size="10">1/(1+e⁻ᶻ) ∈ (0,1)</text>
      <line x1="20" y1="95" x2="160" y2="95" stroke="#8b7d65" stroke-width="1"/>
      <line x1="90" y1="50" x2="90" y2="110" stroke="#8b7d65" stroke-width="1"/>
      <path d="M 20 92 C 60 92, 70 90, 90 70 C 110 50, 120 50, 160 50" fill="none" stroke="#2a5d62" stroke-width="3"/>
    </g>

    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="170" height="120" fill="#ffffff" stroke="#d4c9b5"/>
      <text x="10" y="22" class="mono ig-ink" font-size="12" font-weight="700">Tanh</text>
      <text x="10" y="38" class="mono ig-ink-mute" font-size="10">∈ (−1, 1)</text>
      <line x1="20" y1="80" x2="160" y2="80" stroke="#8b7d65" stroke-width="1"/>
      <line x1="90" y1="50" x2="90" y2="110" stroke="#8b7d65" stroke-width="1"/>
      <path d="M 20 110 C 60 110, 70 105, 90 80 C 110 55, 120 50, 160 50" fill="none" stroke="#c89b3c" stroke-width="3"/>
    </g>

    <g transform="translate(190, 200)">
      <rect x="0" y="0" width="170" height="120" fill="#ffffff" stroke="#d4c9b5"/>
      <text x="10" y="22" class="mono ig-ink" font-size="12" font-weight="700">Softmax</text>
      <text x="10" y="38" class="mono ig-ink-mute" font-size="10">eᶻⁱ / Σⱼeᶻʲ · sums to 1</text>
      <rect x="22" y="60" width="20" height="40" fill="#b8472e"/>
      <rect x="50" y="76" width="20" height="24" fill="#5ba0a8"/>
      <rect x="78" y="84" width="20" height="16" fill="#5ba0a8"/>
      <rect x="106" y="90" width="20" height="10" fill="#5ba0a8"/>
      <rect x="134" y="74" width="20" height="26" fill="#5ba0a8"/>
      <text x="32" y="56" class="mono ig-terra" font-size="9" text-anchor="middle">argmax</text>
    </g>

    <g transform="translate(0, 350)">
      <text x="0" y="0" class="mono ig-ink" font-size="11" font-weight="700">USE WHICH WHERE</text>
      <rect x="0" y="14" width="360" height="106" fill="#ede5d6" stroke="#d4c9b5"/>
      <text x="14" y="36" class="mono ig-ink-soft" font-size="11">                       hidden        output</text>
      <line x1="14" y1="42" x2="346" y2="42" stroke="#d4c9b5"/>
      <text x="14" y="60" class="mono ig-ink" font-size="11">Regression             ReLU          none (identity)</text>
      <text x="14" y="80" class="mono ig-ink" font-size="11">Binary classif.        ReLU          sigmoid</text>
      <text x="14" y="100" class="mono ig-ink" font-size="11">Multi-class classif.   ReLU          softmax</text>
    </g>
  </g>

  <g transform="translate(680, 880)">
    <text x="0" y="0" class="mono ig-terra" font-size="11" letter-spacing="3" font-weight="700">§03 · COUNTING PARAMETERS</text>
    <text x="0" y="32" class="display ig-ink" font-size="22">What's actually learned</text>

    <g transform="translate(0, 60)">
      <circle cx="40" cy="40" r="16" fill="#2a5d62"/>
      <circle cx="40" cy="100" r="16" fill="#2a5d62"/>
      <circle cx="40" cy="160" r="16" fill="#2a5d62"/>
      <text x="40" y="44" class="mono" font-size="11" fill="#f5efe6" text-anchor="middle">x₁</text>
      <text x="40" y="104" class="mono" font-size="11" fill="#f5efe6" text-anchor="middle">x₂</text>
      <text x="40" y="164" class="mono" font-size="11" fill="#f5efe6" text-anchor="middle">x₃</text>

      <circle cx="200" cy="30" r="16" fill="#c89b3c"/>
      <circle cx="200" cy="80" r="16" fill="#c89b3c"/>
      <circle cx="200" cy="130" r="16" fill="#c89b3c"/>
      <circle cx="200" cy="180" r="16" fill="#c89b3c"/>

      <circle cx="360" cy="100" r="20" fill="#b8472e"/>
      <text x="360" y="105" class="mono" font-size="13" fill="#f5efe6" text-anchor="middle" font-weight="700">ŷ</text>

      <g stroke="#8b7d65" stroke-width="0.8" opacity="0.5">
        <line x1="56" y1="40" x2="184" y2="30"/>
        <line x1="56" y1="40" x2="184" y2="80"/>
        <line x1="56" y1="40" x2="184" y2="130"/>
        <line x1="56" y1="40" x2="184" y2="180"/>
        <line x1="56" y1="100" x2="184" y2="30"/>
        <line x1="56" y1="100" x2="184" y2="80"/>
        <line x1="56" y1="100" x2="184" y2="130"/>
        <line x1="56" y1="100" x2="184" y2="180"/>
        <line x1="56" y1="160" x2="184" y2="30"/>
        <line x1="56" y1="160" x2="184" y2="80"/>
        <line x1="56" y1="160" x2="184" y2="130"/>
        <line x1="56" y1="160" x2="184" y2="180"/>
      </g>

      <g stroke="#8b7d65" stroke-width="0.8" opacity="0.5">
        <line x1="216" y1="30" x2="340" y2="100"/>
        <line x1="216" y1="80" x2="340" y2="100"/>
        <line x1="216" y1="130" x2="340" y2="100"/>
        <line x1="216" y1="180" x2="340" y2="100"/>
      </g>

      <text x="40" y="220" class="mono ig-ink-mute" font-size="10" text-anchor="middle">3 INPUTS</text>
      <text x="200" y="220" class="mono ig-ink-mute" font-size="10" text-anchor="middle">4 HIDDEN</text>
      <text x="360" y="140" class="mono ig-ink-mute" font-size="10" text-anchor="middle">1 OUTPUT</text>
    </g>

    <g transform="translate(0, 320)">
      <text x="0" y="0" class="mono ig-ink" font-size="11" font-weight="700">THE COUNT</text>
      <rect x="0" y="14" width="440" height="156" fill="#ede5d6" stroke="#d4c9b5"/>
      <text x="14" y="38" class="mono ig-ink-soft" font-size="12">weights:  3×4 + 4×1 = 16</text>
      <text x="14" y="58" class="mono ig-ink-soft" font-size="12">biases:   4 + 1     = 5</text>
      <text x="14" y="84" class="mono ig-ink" font-size="13" font-weight="700">total parameters    = 21</text>

      <line x1="14" y1="100" x2="426" y2="100" stroke="#d4c9b5"/>
      <text x="14" y="122" class="mono ig-terra" font-size="11" font-weight="700">SAME MACHINERY, MORE PARAMETERS</text>
      <text x="14" y="142" class="mono ig-ink-soft" font-size="11">GPT-3 .............  175,000,000,000</text>
      <text x="14" y="160" class="mono ig-ink-soft" font-size="11">Llama 3 405B ......  405,000,000,000</text>
    </g>
  </g>

  <g transform="translate(60, 1280)">
    <text x="0" y="0" class="mono ig-terra" font-size="11" letter-spacing="3" font-weight="700">§05 · GRADIENT DESCENT</text>
    <text x="0" y="32" class="display ig-ink" font-size="22">Direction + step size</text>

    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="500" height="160" fill="#ffffff" stroke="#d4c9b5"/>
      <line x1="40" y1="140" x2="460" y2="140" stroke="#8b7d65" stroke-width="1"/>
      <line x1="250" y1="20" x2="250" y2="150" stroke="#8b7d65" stroke-width="1"/>
      <text x="465" y="144" class="mono ig-ink-mute" font-size="10">w</text>
      <text x="240" y="18" class="mono ig-ink-mute" font-size="10">J(w)</text>
      <path d="M 60 30 Q 250 240, 440 30" fill="none" stroke="#1f1a14" stroke-width="2"/>
      <circle cx="250" cy="135" r="5" fill="#b8472e"/>
      <text x="250" y="158" class="mono ig-terra" font-size="10" text-anchor="middle" font-weight="700">w*</text>

      <circle cx="110" cy="78" r="4" fill="#c89b3c"/>
      <path d="M 110 78 L 380 60" fill="none" stroke="#c89b3c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrowDark)"/>
      <text x="105" y="62" class="mono ig-ochre" font-size="10" font-weight="700">too big →</text>
      <text x="320" y="50" class="mono ig-ochre" font-size="10">overshoots</text>

      <circle cx="110" cy="78" r="4" fill="#2a5d62"/>
      <path d="M 110 78 Q 170 100, 200 120 Q 230 132, 248 134" fill="none" stroke="#2a5d62" stroke-width="2" marker-end="url(#arrowTeal)"/>
      <text x="170" y="116" class="mono ig-teal" font-size="10" font-weight="700">just right ↘</text>

      <circle cx="380" cy="60" r="4" fill="#1f1a14"/>
      <path d="M 380 60 L 360 70 L 340 78 L 320 84 L 305 88" fill="none" stroke="#1f1a14" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="335" y="105" class="mono ig-ink" font-size="10">too small → slow</text>
    </g>

    <text x="0" y="245" class="body ig-ink-soft" font-size="14" font-style="italic">Gradient = direction. Learning rate η = step size.</text>
  </g>

  <g transform="translate(620, 1280)">
    <text x="0" y="0" class="mono ig-terra" font-size="11" letter-spacing="3" font-weight="700">FIVE CORRECTIONS YOU SHOULD CARRY</text>
    <rect x="0" y="14" width="520" height="190" fill="#f8e6cf" stroke="#b8472e" stroke-dasharray="4 3"/>

    <g transform="translate(14, 36)">
      <text x="0" y="0" class="mono ig-terra" font-size="11" font-weight="700">1.</text>
      <text x="22" y="0" class="mono ig-ink" font-size="11">Train until loss <tspan font-style="italic">plateaus</tspan>, not until it = 0.</text>

      <text x="0" y="32" class="mono ig-terra" font-size="11" font-weight="700">2.</text>
      <text x="22" y="32" class="mono ig-ink" font-size="11">Multi-class uses softmax, not bucketed sigmoid.</text>

      <text x="0" y="64" class="mono ig-terra" font-size="11" font-weight="700">3.</text>
      <text x="22" y="64" class="mono ig-ink" font-size="11">ReLU is for hidden layers; the output activation is</text>
      <text x="22" y="78" class="mono ig-ink" font-size="11">task-specific (identity / sigmoid / softmax).</text>

      <text x="0" y="110" class="mono ig-terra" font-size="11" font-weight="700">4.</text>
      <text x="22" y="110" class="mono ig-ink" font-size="11">Dropout is regularisation, not feature selection.</text>

      <text x="0" y="142" class="mono ig-terra" font-size="11" font-weight="700">5.</text>
      <text x="22" y="142" class="mono ig-ink" font-size="11">Hidden layers add non-linearity (UAT), independent</text>
      <text x="22" y="156" class="mono ig-ink" font-size="11">of dropout.</text>
    </g>
  </g>

  <g transform="translate(60, 1480)">
    <text x="0" y="0" class="mono ig-ink-mute" font-size="10" letter-spacing="2">ANN-SESSION 02 · 2026-05-18 · SASMITA COURSE</text>
    <text x="1080" y="0" class="mono ig-ink-mute" font-size="10" letter-spacing="2" text-anchor="end">NEXT → SESSION 03 · TENSORFLOW</text>
  </g>
</svg>
