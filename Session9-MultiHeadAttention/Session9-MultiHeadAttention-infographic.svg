<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2400" font-family="'Spectral', 'Iowan Old Style', Georgia, serif">
<defs>
<style>
.paper { fill: #f5efe6; }
.paper-2 { fill: #ede5d6; }
.ink { fill: #1f1a14; }
.ink-soft { fill: #4a4239; }
.ink-mute { fill: #8b7d65; }
.terracotta { fill: #b8472e; }
.terracotta-light { fill: #d96d4a; }
.teal { fill: #2a5d62; }
.teal-soft { fill: #5ba0a8; }
.ochre { fill: #c89b3c; }
.highlight { fill: #f8e6cf; }
.spring { fill: #6db33f; }
.mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
.display { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; }
</style>
<pattern id="dots9" patternUnits="userSpaceOnUse" width="100" height="100">
<circle cx="20" cy="30" r="0.6" fill="#1f1a14" opacity="0.06"/>
<circle cx="70" cy="80" r="0.5" fill="#1f1a14" opacity="0.04"/>
</pattern>
</defs>

<rect width="1100" height="2400" class="paper"/>
<rect width="1100" height="2400" fill="url(#dots9)"/>

<!-- HEADER -->
<text x="60" y="80" class="mono terracotta" font-size="13" font-weight="700" letter-spacing="6">SESSION 09 · TRANSFORMER ENCODER</text>
<text x="60" y="170" class="display ink" font-size="80" font-weight="700" letter-spacing="-1">Multi-Head</text>
<text x="60" y="250" class="display terracotta" font-size="80" font-weight="700" letter-spacing="-1">Self-Attention.</text>
<line x1="60" y1="280" x2="1040" y2="280" stroke="#1f1a14" stroke-width="2"/>
<text x="60" y="320" class="ink-soft display" font-size="22">Every token attends to every other token. Run it eight times in parallel.</text>
<text x="60" y="365" class="mono ink-mute" font-size="11" letter-spacing="2">VASWANI ET AL. 2017 · §3.2  ·  h = 8 heads  ·  d_k = 64  ·  N = 6 layers</text>

<!-- THE FORMULA -->
<g transform="translate(60, 420)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE FORMULA</text>
  <rect x="0" y="20" width="980" height="160" fill="#1f1a14"/>
  <text x="490" y="90" text-anchor="middle" class="mono" fill="#5ba0a8" font-size="22">Attention(Q, K, V)  =</text>
  <text x="490" y="135" text-anchor="middle" class="mono" fill="#c89b3c" font-size="30" font-weight="700">softmax( Q · Kᵀ / √d_k ) · V</text>
  <text x="490" y="168" text-anchor="middle" class="mono ink-mute" font-size="11" letter-spacing="2" fill="#8b7d65">SCALED DOT-PRODUCT ATTENTION</text>
</g>

<!-- KEY FIX -->
<g transform="translate(60, 620)">
  <rect x="0" y="0" width="980" height="90" fill="rgba(184, 71, 46, 0.08)" stroke="#b8472e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="20" y="32" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">THE FIX FROM THE TRANSCRIPT</text>
  <text x="20" y="62" class="ink" font-size="17">Divide by <tspan class="mono" font-weight="700">√d_k</tspan>, not <tspan class="mono" font-weight="700">d_k</tspan>. With d_k = 64, that's <tspan class="mono" font-weight="700">÷ 8</tspan>, not ÷ 64.</text>
  <text x="20" y="82" class="ink-soft" font-size="14">Scaling keeps dot products from exploding as dimension grows.</text>
</g>

<!-- WORKED EXAMPLE -->
<g transform="translate(60, 750)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">WORKED EXAMPLE · ALAMMAR'S THINKING/MACHINES</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">Computing z₁ — the new representation of "thinking"</text>

  <!-- Table -->
  <g transform="translate(0, 60)">
    <!-- header row -->
    <rect x="0" y="0" width="480" height="44" class="paper-2"/>
    <rect x="480" y="0" width="250" height="44" class="paper-2"/>
    <rect x="730" y="0" width="250" height="44" class="paper-2"/>
    <text x="20" y="28" class="mono ink" font-size="12" font-weight="700" letter-spacing="2">STEP</text>
    <text x="500" y="28" class="mono ink" font-size="12" font-weight="700" letter-spacing="2">thinking → thinking</text>
    <text x="750" y="28" class="mono ink" font-size="12" font-weight="700" letter-spacing="2">thinking → machines</text>

    <!-- row 1: dot product -->
    <rect x="0" y="44" width="980" height="44" fill="none" stroke="#d4c9b5"/>
    <text x="20" y="72" class="ink" font-size="15">Dot product <tspan class="mono">q_1 · k_j</tspan></text>
    <text x="500" y="72" class="mono ink" font-size="18">112</text>
    <text x="750" y="72" class="mono ink" font-size="18">96</text>

    <!-- row 2: scale -->
    <rect x="0" y="88" width="980" height="44" fill="rgba(184, 71, 46, 0.08)" stroke="#d4c9b5"/>
    <text x="20" y="116" class="ink" font-size="15">Scale by <tspan class="mono" font-weight="700">√d_k = √64 = 8</tspan></text>
    <text x="500" y="116" class="mono terracotta" font-size="18" font-weight="700">14</text>
    <text x="750" y="116" class="mono terracotta" font-size="18" font-weight="700">12</text>

    <!-- row 3: softmax -->
    <rect x="0" y="132" width="980" height="44" fill="none" stroke="#d4c9b5"/>
    <text x="20" y="160" class="ink" font-size="15">Softmax across the row</text>
    <text x="500" y="160" class="mono teal" font-size="18" font-weight="700">0.88</text>
    <text x="750" y="160" class="mono teal" font-size="18" font-weight="700">0.12</text>

    <!-- row 4: weighted value -->
    <rect x="0" y="176" width="980" height="44" fill="rgba(42, 93, 98, 0.06)" stroke="#d4c9b5"/>
    <text x="20" y="204" class="ink" font-size="15">Weighted value contribution</text>
    <text x="500" y="204" class="mono ink" font-size="15">0.88 · v_1</text>
    <text x="750" y="204" class="mono ink" font-size="15">0.12 · v_2</text>

    <!-- sum -->
    <rect x="0" y="232" width="980" height="50" fill="#1f1a14"/>
    <text x="490" y="263" text-anchor="middle" class="mono" fill="#f8e6cf" font-size="16">z₁  =  0.88 · v_1  +  0.12 · v_2</text>
  </g>
</g>

<!-- Q stays fixed callout -->
<g transform="translate(60, 1110)">
  <rect x="0" y="0" width="980" height="70" class="highlight" stroke="#c89b3c"/>
  <text x="20" y="28" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">WHAT SPEAKER D WAS ASKING</text>
  <text x="20" y="56" class="ink" font-size="15">"Why is it Q₁ in both rows?" — because we're computing <tspan font-style="italic">thinking's</tspan> output. Q stays fixed; only <tspan class="mono">k_j, v_j</tspan> vary across targets.</text>
</g>

<!-- MULTI-HEAD DIAGRAM -->
<g transform="translate(60, 1220)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">MULTI-HEAD · WHY × 8</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">Eight parallel attention heads, each with its own W_Q, W_K, W_V.</text>

  <!-- Input box -->
  <g transform="translate(0, 80)">
    <rect x="0" y="0" width="170" height="280" fill="#2a5d62"/>
    <text x="85" y="36" text-anchor="middle" class="mono" fill="#5ba0a8" font-size="10" letter-spacing="2">INPUT</text>
    <text x="85" y="76" text-anchor="middle" class="mono" fill="#f5efe6" font-size="22" font-weight="700">X</text>
    <text x="85" y="108" text-anchor="middle" class="mono" fill="#f5efe6" font-size="14">n × 512</text>
    <text x="85" y="148" text-anchor="middle" class="mono" fill="#5ba0a8" font-size="11">positioned</text>
    <text x="85" y="166" text-anchor="middle" class="mono" fill="#5ba0a8" font-size="11">embeddings</text>
  </g>

  <!-- arrow -->
  <text x="200" y="240" class="display ink" font-size="40">→</text>

  <!-- 8 heads -->
  <g transform="translate(240, 80)">
    <text x="0" y="-10" class="mono ink-mute" font-size="11" letter-spacing="2">8 HEADS IN PARALLEL · EACH 64-DIM</text>
    <g>
      <!-- Each head row -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="380" height="30" fill="#b8472e"/>
        <text x="14" y="20" class="mono" fill="#f8e6cf" font-size="11">head 1:  X·W_Q¹ → Q¹    X·W_K¹ → K¹    X·W_V¹ → V¹</text>
      </g>
      <g transform="translate(0, 34)">
        <rect x="0" y="0" width="380" height="30" fill="#b8472e" opacity="0.92"/>
        <text x="14" y="20" class="mono" fill="#f8e6cf" font-size="11">head 2:  X·W_Q² → Q²    X·W_K² → K²    X·W_V² → V²</text>
      </g>
      <g transform="translate(0, 68)">
        <rect x="0" y="0" width="380" height="30" fill="#b8472e" opacity="0.84"/>
        <text x="14" y="20" class="mono" fill="#f8e6cf" font-size="11">head 3:  X·W_Q³ → Q³    X·W_K³ → K³    X·W_V³ → V³</text>
      </g>
      <g transform="translate(0, 102)">
        <rect x="0" y="0" width="380" height="30" fill="#b8472e" opacity="0.76"/>
        <text x="14" y="20" class="mono" fill="#f8e6cf" font-size="11">head 4:  X·W_Q⁴ → Q⁴    X·W_K⁴ → K⁴    X·W_V⁴ → V⁴</text>
      </g>
      <g transform="translate(0, 136)">
        <rect x="0" y="0" width="380" height="30" fill="#b8472e" opacity="0.68"/>
        <text x="14" y="20" class="mono" fill="#f8e6cf" font-size="11">head 5:  X·W_Q⁵ → Q⁵    X·W_K⁵ → K⁵    X·W_V⁵ → V⁵</text>
      </g>
      <g transform="translate(0, 170)">
        <rect x="0" y="0" width="380" height="30" fill="#b8472e" opacity="0.60"/>
        <text x="14" y="20" class="mono" fill="#f8e6cf" font-size="11">head 6:  X·W_Q⁶ → Q⁶    X·W_K⁶ → K⁶    X·W_V⁶ → V⁶</text>
      </g>
      <g transform="translate(0, 204)">
        <rect x="0" y="0" width="380" height="30" fill="#b8472e" opacity="0.52"/>
        <text x="14" y="20" class="mono" fill="#f8e6cf" font-size="11">head 7:  X·W_Q⁷ → Q⁷    X·W_K⁷ → K⁷    X·W_V⁷ → V⁷</text>
      </g>
      <g transform="translate(0, 238)">
        <rect x="0" y="0" width="380" height="30" fill="#b8472e" opacity="0.44"/>
        <text x="14" y="20" class="mono" fill="#f8e6cf" font-size="11">head 8:  X·W_Q⁸ → Q⁸    X·W_K⁸ → K⁸    X·W_V⁸ → V⁸</text>
      </g>
    </g>
  </g>

  <!-- arrow -->
  <text x="640" y="240" class="display ink" font-size="40">→</text>

  <!-- concat -->
  <g transform="translate(680, 80)">
    <rect x="0" y="80" width="120" height="120" fill="#c89b3c"/>
    <text x="60" y="116" text-anchor="middle" class="mono ink" font-size="10" letter-spacing="2">CONCAT</text>
    <text x="60" y="146" text-anchor="middle" class="mono ink" font-size="22" font-weight="700">8 × 64</text>
    <text x="60" y="172" text-anchor="middle" class="mono ink" font-size="13">= 512</text>
  </g>

  <!-- arrow -->
  <text x="810" y="240" class="display ink" font-size="40">→</text>

  <!-- W_O -->
  <g transform="translate(850, 80)">
    <rect x="0" y="80" width="190" height="120" fill="#1f1a14"/>
    <text x="95" y="118" text-anchor="middle" class="mono" fill="#5ba0a8" font-size="10" letter-spacing="2">W_O · OUTPUT</text>
    <text x="95" y="152" text-anchor="middle" class="mono" fill="#f8e6cf" font-size="22" font-weight="700">Z</text>
    <text x="95" y="178" text-anchor="middle" class="mono" fill="#f5efe6" font-size="12">n × 512</text>
  </g>
</g>

<!-- DIMENSION PROPERTIES -->
<g transform="translate(60, 1620)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE DIMENSIONS THAT TRIP EVERYONE UP</text>
  <g transform="translate(0, 30)">
    <rect x="0" y="0" width="240" height="120" fill="rgba(251,247,239,0.7)" stroke="#5ba0a8" stroke-width="4" stroke-dasharray="0" pointer-events="none"/>
    <rect x="0" y="0" width="4" height="120" class="teal-soft"/>
    <text x="20" y="38" class="display ink" font-size="22" font-weight="700">d_model</text>
    <text x="20" y="68" class="mono ink" font-size="28" font-weight="700">512</text>
    <text x="20" y="100" class="ink-soft" font-size="13">width flowing between blocks</text>

    <rect x="250" y="0" width="240" height="120" fill="rgba(251,247,239,0.7)"/>
    <rect x="250" y="0" width="4" height="120" class="teal-soft"/>
    <text x="270" y="38" class="display ink" font-size="22" font-weight="700">h</text>
    <text x="270" y="68" class="mono ink" font-size="28" font-weight="700">8</text>
    <text x="270" y="100" class="ink-soft" font-size="13">attention heads per layer</text>

    <rect x="500" y="0" width="240" height="120" fill="rgba(251,247,239,0.7)"/>
    <rect x="500" y="0" width="4" height="120" class="terracotta"/>
    <text x="520" y="38" class="display ink" font-size="22" font-weight="700">d_k = d_v</text>
    <text x="520" y="68" class="mono ink" font-size="28" font-weight="700">64</text>
    <text x="520" y="100" class="ink-soft" font-size="13">per-head Q/K/V (= 512/8)</text>

    <rect x="750" y="0" width="240" height="120" fill="rgba(251,247,239,0.7)"/>
    <rect x="750" y="0" width="4" height="120" class="teal-soft"/>
    <text x="770" y="38" class="display ink" font-size="22" font-weight="700">N</text>
    <text x="770" y="68" class="mono ink" font-size="28" font-weight="700">6</text>
    <text x="770" y="100" class="ink-soft" font-size="13">stacked encoder layers</text>
  </g>
</g>

<!-- WHY MULTIPLE HEADS -->
<g transform="translate(60, 1820)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">WHY MULTIPLE HEADS · THE ANIMAL/IT EXAMPLE</text>
  <rect x="0" y="20" width="980" height="160" class="highlight" stroke="#c89b3c"/>
  <text x="20" y="56" class="display ink" font-size="22" font-style="italic">"The animal didn't cross the street because <tspan class="terracotta" font-weight="700">it</tspan> was too tired."</text>
  <text x="20" y="92" class="ink-soft" font-size="15">Resolving <tspan font-weight="700">it</tspan>:</text>
  <text x="40" y="118" class="ink" font-size="15">• head A attends <tspan font-weight="700">it → animal</tspan> (coreference)</text>
  <text x="40" y="140" class="ink" font-size="15">• head B attends <tspan font-weight="700">it → tired</tspan> (only animals get tired)</text>
  <text x="40" y="162" class="ink" font-size="15">• head C attends along <tspan font-weight="700">cross the street</tspan> (phrase binding)</text>
</g>

<!-- CORRECTIONS STRIP -->
<g transform="translate(60, 2030)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">KEY CORRECTIONS FROM THE TRANSCRIPT</text>
  <g transform="translate(0, 30)">
    <rect x="0" y="0" width="980" height="40" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-dasharray="4,3"/>
    <text x="14" y="26" class="mono terracotta" font-size="12" font-weight="700">÷ d_k</text>
    <text x="80" y="26" class="ink" font-size="14">→ should be <tspan class="mono" font-weight="700">÷ √d_k</tspan> (so √64 = 8, not 64)</text>

    <rect x="0" y="48" width="980" height="40" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-dasharray="4,3"/>
    <text x="14" y="74" class="mono terracotta" font-size="12" font-weight="700">"W_O = concat"</text>
    <text x="180" y="74" class="ink" font-size="14">→ W_O is a <tspan font-weight="700">separate learned 512×512 matrix</tspan>, applied AFTER concat</text>

    <rect x="0" y="96" width="980" height="40" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-dasharray="4,3"/>
    <text x="14" y="122" class="mono terracotta" font-size="12" font-weight="700">d_k = 512</text>
    <text x="120" y="122" class="ink" font-size="14">→ that's <tspan font-weight="700">d_model</tspan>; per-head <tspan class="mono" font-weight="700">d_k = 64</tspan> (= d_model/h)</text>

    <rect x="0" y="144" width="980" height="40" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-dasharray="4,3"/>
    <text x="14" y="170" class="mono terracotta" font-size="12" font-weight="700">"MLM = supervised"</text>
    <text x="220" y="170" class="ink" font-size="14">→ MLM is <tspan font-weight="700">self-supervised</tspan> (labels derived from input itself)</text>

    <rect x="0" y="192" width="980" height="40" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-dasharray="4,3"/>
    <text x="14" y="218" class="mono terracotta" font-size="12" font-weight="700">"7 encoders"</text>
    <text x="160" y="218" class="ink" font-size="14">→ N = <tspan font-weight="700">6</tspan> encoder layers in the paper; 8 is the number of <tspan font-weight="700">heads</tspan></text>
  </g>
</g>

<!-- FOOTER -->
<line x1="60" y1="2320" x2="1040" y2="2320" stroke="#1f1a14" stroke-width="2"/>
<text x="60" y="2355" class="mono ink-mute" font-size="11" letter-spacing="2">SESSION 09 · 2026-05-18</text>
<text x="1040" y="2355" text-anchor="end" class="mono ink-mute" font-size="11" letter-spacing="2">VASWANI ET AL. 2017 · ALAMMAR · ILLUSTRATED TRANSFORMER</text>

</svg>
