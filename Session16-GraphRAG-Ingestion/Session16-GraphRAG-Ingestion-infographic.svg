<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Spectral, Georgia, serif">
  <defs>
    <style>
      .h1 { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; font-weight: 700; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .body { font-family: 'Spectral', 'Iowan Old Style', Georgia, serif; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f1a14"/>
    </marker>
    <marker id="arrow-terr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#b8472e"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2a5d62"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1400" height="900" fill="#f5efe6"/>
  <rect x="0" y="0" width="1400" height="120" fill="#ede5d6"/>

  <!-- header -->
  <text x="60" y="58" class="mono" font-size="13" letter-spacing="5" fill="#b8472e" font-weight="700">SESSION 16 · GRAPHRAG · INGESTION</text>
  <text x="60" y="100" class="h1" font-size="46" fill="#1f1a14">One database, two retrievers, three flags.</text>
  <text x="1340" y="58" class="mono" font-size="11" fill="#8b7d65" text-anchor="end" letter-spacing="2">2026-05-03 · 67 MIN</text>

  <!-- LEFT COLUMN: the pipeline -->
  <text x="60" y="170" class="mono" font-size="11" letter-spacing="3" fill="#b8472e" font-weight="700">THE PIPELINE — INGESTION ONLY</text>
  <line x1="60" y1="180" x2="650" y2="180" stroke="#1f1a14" stroke-width="1.5"/>

  <!-- step 1 -->
  <rect x="60" y="200" width="180" height="70" fill="#1f1a14"/>
  <text x="150" y="232" class="mono" font-size="12" fill="#f5efe6" text-anchor="middle" font-weight="700" letter-spacing="1">RAW DOCS</text>
  <text x="150" y="252" class="mono" font-size="10" fill="#d4c9b5" text-anchor="middle">3 messy policies</text>

  <!-- arrow -->
  <line x1="240" y1="235" x2="270" y2="235" stroke="#1f1a14" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="275" y="200" width="180" height="70" fill="#2a5d62"/>
  <text x="365" y="227" class="mono" font-size="12" fill="#f5efe6" text-anchor="middle" font-weight="700" letter-spacing="1">CHUNK</text>
  <text x="365" y="247" class="mono" font-size="10" fill="#f5efe6" text-anchor="middle">TokenTextSplitter</text>
  <text x="365" y="261" class="mono" font-size="10" fill="#f5efe6" text-anchor="middle" opacity="0.85">size 512 · overlap 24</text>

  <line x1="455" y1="235" x2="485" y2="235" stroke="#1f1a14" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="490" y="200" width="180" height="70" fill="#b8472e"/>
  <text x="580" y="227" class="mono" font-size="12" fill="#f5efe6" text-anchor="middle" font-weight="700" letter-spacing="1">LLM EXTRACT</text>
  <text x="580" y="247" class="mono" font-size="10" fill="#f5efe6" text-anchor="middle">LLMGraphTransformer</text>
  <text x="580" y="261" class="mono" font-size="10" fill="#f5efe6" text-anchor="middle" opacity="0.9">gpt-4o-mini</text>

  <!-- fork down -->
  <line x1="580" y1="270" x2="580" y2="310" stroke="#1f1a14" stroke-width="2"/>
  <line x1="365" y1="270" x2="365" y2="310" stroke="#1f1a14" stroke-width="2"/>
  <line x1="365" y1="310" x2="580" y2="310" stroke="#1f1a14" stroke-width="2"/>
  <line x1="472.5" y1="310" x2="472.5" y2="350" stroke="#1f1a14" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 4: write to Neo4j -->
  <rect x="60" y="365" width="610" height="220" fill="#ede5d6" stroke="#d4c9b5"/>
  <text x="80" y="395" class="mono" font-size="11" letter-spacing="3" fill="#b8472e" font-weight="700">NEO4J — ONE DATABASE</text>

  <!-- Layer 1: graph writes -->
  <rect x="80" y="408" width="280" height="70" fill="#f5efe6" stroke="#1f1a14" stroke-width="1.5"/>
  <text x="95" y="430" class="mono" font-size="11" fill="#1f1a14" font-weight="700">kg.add_graph_documents(...)</text>
  <text x="95" y="448" class="mono" font-size="10" fill="#4a4239">+ baseEntityLabel=True</text>
  <text x="95" y="462" class="mono" font-size="10" fill="#4a4239">+ include_source=True</text>

  <!-- Layer 2: vector writes -->
  <rect x="375" y="408" width="280" height="70" fill="#f5efe6" stroke="#1f1a14" stroke-width="1.5"/>
  <text x="390" y="430" class="mono" font-size="11" fill="#1f1a14" font-weight="700">Neo4jVector.from_documents(...)</text>
  <text x="390" y="448" class="mono" font-size="10" fill="#4a4239">node_label="Document"</text>
  <text x="390" y="462" class="mono" font-size="10" fill="#4a4239">embedding text-emb-3-small</text>

  <!-- end state -->
  <text x="80" y="510" class="mono" font-size="10" letter-spacing="2" fill="#8b7d65">END STATE</text>
  <text x="80" y="528" class="body" font-size="14" fill="#1f1a14" font-style="italic">Document nodes carry text + 1,536-dim embedding.</text>
  <text x="80" y="548" class="body" font-size="14" fill="#1f1a14" font-style="italic">Entity nodes carry LLM-chosen label + :__Entity__ marker.</text>
  <text x="80" y="568" class="body" font-size="14" fill="#1f1a14" font-style="italic">MENTIONS links every entity back to its source chunk.</text>

  <!-- RIGHT COLUMN: the dual-label trick -->
  <text x="730" y="170" class="mono" font-size="11" letter-spacing="3" fill="#b8472e" font-weight="700">THE DUAL-LABEL TRICK</text>
  <line x1="730" y1="180" x2="1340" y2="180" stroke="#1f1a14" stroke-width="1.5"/>

  <text x="730" y="210" class="body" font-size="14" fill="#4a4239" font-style="italic">The LLM picks the primary label freely.</text>
  <text x="730" y="230" class="body" font-size="14" fill="#4a4239" font-style="italic">LangChain stamps every node with a shared secondary label,</text>
  <text x="730" y="250" class="body" font-size="14" fill="#4a4239" font-style="italic">so retrieval has <tspan class="mono" font-size="13" fill="#b8472e">one</tspan> handle to grab everything by.</text>

  <!-- node examples -->
  <g transform="translate(740, 280)">
    <!-- node 1 -->
    <ellipse cx="80" cy="60" rx="78" ry="48" fill="#f8e6cf" stroke="#1f1a14" stroke-width="2"/>
    <text x="80" y="42" class="mono" font-size="10" fill="#1f1a14" text-anchor="middle" font-weight="700">:Company</text>
    <text x="80" y="58" class="mono" font-size="10" fill="#b8472e" text-anchor="middle" font-weight="700">:__Entity__</text>
    <line x1="20" y1="68" x2="140" y2="68" stroke="#d4c9b5"/>
    <text x="80" y="84" class="mono" font-size="10" fill="#4a4239" text-anchor="middle">id: "MedFridge"</text>

    <!-- node 2 -->
    <ellipse cx="290" cy="60" rx="78" ry="48" fill="#f8e6cf" stroke="#1f1a14" stroke-width="2"/>
    <text x="290" y="42" class="mono" font-size="10" fill="#1f1a14" text-anchor="middle" font-weight="700">:Batch</text>
    <text x="290" y="58" class="mono" font-size="10" fill="#b8472e" text-anchor="middle" font-weight="700">:__Entity__</text>
    <line x1="230" y1="68" x2="350" y2="68" stroke="#d4c9b5"/>
    <text x="290" y="84" class="mono" font-size="10" fill="#4a4239" text-anchor="middle">id: "Batch B-4421"</text>

    <!-- node 3 -->
    <ellipse cx="500" cy="60" rx="78" ry="48" fill="#f8e6cf" stroke="#1f1a14" stroke-width="2"/>
    <text x="500" y="42" class="mono" font-size="10" fill="#1f1a14" text-anchor="middle" font-weight="700">:Distributor</text>
    <text x="500" y="58" class="mono" font-size="10" fill="#b8472e" text-anchor="middle" font-weight="700">:__Entity__</text>
    <line x1="440" y1="68" x2="560" y2="68" stroke="#d4c9b5"/>
    <text x="500" y="84" class="mono" font-size="10" fill="#4a4239" text-anchor="middle">id: "NordicCare"</text>

    <!-- arrows between -->
    <line x1="158" y1="60" x2="212" y2="60" stroke="#b8472e" stroke-width="2" marker-end="url(#arrow-terr)"/>
    <text x="185" y="50" class="mono" font-size="9" fill="#b8472e" text-anchor="middle" font-weight="700">RELEASED</text>

    <line x1="368" y1="60" x2="422" y2="60" stroke="#b8472e" stroke-width="2" marker-end="url(#arrow-terr)"/>
    <text x="395" y="50" class="mono" font-size="9" fill="#b8472e" text-anchor="middle" font-weight="700">SHIPPED_TO</text>
  </g>

  <!-- Document node + MENTIONS topology -->
  <text x="730" y="430" class="mono" font-size="11" letter-spacing="3" fill="#2a5d62" font-weight="700">MENTIONS LINKS BACK TO SOURCE</text>
  <line x1="730" y1="440" x2="1340" y2="440" stroke="#d4c9b5"/>

  <g transform="translate(740, 460)">
    <!-- center Document node -->
    <rect x="225" y="20" width="160" height="60" fill="#2a5d62" stroke="#1f1a14" stroke-width="2"/>
    <text x="305" y="45" class="mono" font-size="11" fill="#f5efe6" text-anchor="middle" font-weight="700">:Document</text>
    <text x="305" y="62" class="mono" font-size="10" fill="#5ba0a8" text-anchor="middle">chunk #4 · text + embedding</text>

    <!-- three entity nodes around -->
    <ellipse cx="80" cy="120" rx="60" ry="35" fill="#f8e6cf" stroke="#1f1a14" stroke-width="1.5"/>
    <text x="80" y="115" class="mono" font-size="9" fill="#1f1a14" text-anchor="middle">:Company</text>
    <text x="80" y="129" class="mono" font-size="9" fill="#b8472e" text-anchor="middle">:__Entity__</text>

    <ellipse cx="305" cy="170" rx="60" ry="35" fill="#f8e6cf" stroke="#1f1a14" stroke-width="1.5"/>
    <text x="305" y="165" class="mono" font-size="9" fill="#1f1a14" text-anchor="middle">:Batch</text>
    <text x="305" y="179" class="mono" font-size="9" fill="#b8472e" text-anchor="middle">:__Entity__</text>

    <ellipse cx="530" cy="120" rx="60" ry="35" fill="#f8e6cf" stroke="#1f1a14" stroke-width="1.5"/>
    <text x="530" y="115" class="mono" font-size="9" fill="#1f1a14" text-anchor="middle">:Distributor</text>
    <text x="530" y="129" class="mono" font-size="9" fill="#b8472e" text-anchor="middle">:__Entity__</text>

    <!-- MENTIONS edges from doc to entities -->
    <line x1="225" y1="65" x2="135" y2="105" stroke="#2a5d62" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
    <line x1="305" y1="80" x2="305" y2="135" stroke="#2a5d62" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
    <line x1="385" y1="65" x2="475" y2="105" stroke="#2a5d62" stroke-width="1.8" marker-end="url(#arrow-teal)"/>

    <text x="170" y="80" class="mono" font-size="9" fill="#2a5d62" font-weight="700">MENTIONS</text>
    <text x="320" y="110" class="mono" font-size="9" fill="#2a5d62" font-weight="700">MENTIONS</text>
    <text x="430" y="80" class="mono" font-size="9" fill="#2a5d62" font-weight="700">MENTIONS</text>
  </g>

  <!-- FOOTER BAND: three flags -->
  <rect x="0" y="710" width="1400" height="190" fill="#ede5d6"/>

  <text x="60" y="745" class="mono" font-size="11" letter-spacing="3" fill="#b8472e" font-weight="700">THREE FLAGS THAT CARRY THIS SESSION</text>
  <line x1="60" y1="755" x2="1340" y2="755" stroke="#1f1a14" stroke-width="1.5"/>

  <!-- flag 1 -->
  <g transform="translate(60, 770)">
    <text x="0" y="20" class="mono" font-size="11" fill="#b8472e" font-weight="700">baseEntityLabel=True</text>
    <text x="0" y="40" class="body" font-size="13" fill="#4a4239" font-style="italic">Every LLM-extracted node also gets</text>
    <text x="0" y="58" class="body" font-size="13" fill="#4a4239" font-style="italic"><tspan class="mono" font-size="12" fill="#1f1a14">:__Entity__</tspan> — one label to retrieve by.</text>
    <text x="0" y="80" class="mono" font-size="10" fill="#8b7d65">Lecturer said "entity" — actual label is __Entity__</text>
  </g>

  <!-- flag 2 -->
  <g transform="translate(490, 770)">
    <text x="0" y="20" class="mono" font-size="11" fill="#b8472e" font-weight="700">include_source=True</text>
    <text x="0" y="40" class="body" font-size="13" fill="#4a4239" font-style="italic">Each chunk becomes a <tspan class="mono" font-size="12" fill="#1f1a14">:Document</tspan> node;</text>
    <text x="0" y="58" class="body" font-size="13" fill="#4a4239" font-style="italic">extracted entities link back via <tspan class="mono" font-size="12" fill="#1f1a14">[:MENTIONS]</tspan>.</text>
    <text x="0" y="80" class="mono" font-size="10" fill="#8b7d65">Provenance — every entity traces home</text>
  </g>

  <!-- flag 3 -->
  <g transform="translate(920, 770)">
    <text x="0" y="20" class="mono" font-size="11" fill="#b8472e" font-weight="700">pre_delete_collection=True</text>
    <text x="0" y="40" class="body" font-size="13" fill="#4a4239" font-style="italic">Wipes the vector index before</text>
    <text x="0" y="58" class="body" font-size="13" fill="#4a4239" font-style="italic">re-embedding. Convenient, expensive.</text>
    <text x="0" y="80" class="mono" font-size="10" fill="#8b7d65">Comment out after first successful run</text>
  </g>

  <text x="1340" y="880" class="mono" font-size="10" fill="#8b7d65" text-anchor="end" letter-spacing="2">SESSION 16 · INGESTION DONE · RETRIEVAL IN SESSION 17</text>
</svg>
