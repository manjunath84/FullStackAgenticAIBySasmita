<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2050" font-family="'Spectral', 'Iowan Old Style', Georgia, serif">
<defs>
<style>
.paper { fill: #f5efe6; }
.paper-2 { fill: #ede5d6; }
.ink { fill: #1f1a14; }
.ink-soft { fill: #4a4239; }
.ink-mute { fill: #8b7d65; }
.terracotta { fill: #b8472e; }
.terracotta-light { fill: #d96d4a; }
.teal { fill: #2a5d62; }
.teal-soft { fill: #5ba0a8; }
.ochre { fill: #c89b3c; }
.highlight { fill: #f8e6cf; }
.spring { fill: #6db33f; }
.line-stroke { stroke: #d4c9b5; }
.mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
.display { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; }
</style>
<pattern id="dots12" patternUnits="userSpaceOnUse" width="100" height="100">
<circle cx="20" cy="30" r="0.6" fill="#1f1a14" opacity="0.06"/>
<circle cx="70" cy="80" r="0.5" fill="#1f1a14" opacity="0.04"/>
</pattern>
</defs>

<rect width="1100" height="2050" class="paper"/>
<rect width="1100" height="2050" fill="url(#dots12)"/>

<!-- HEADER -->
<text x="60" y="80" class="mono terracotta" font-size="13" font-weight="700" letter-spacing="6">SESSION 12 · RAG · PART 1</text>
<text x="60" y="170" class="display ink" font-size="80" font-weight="700" letter-spacing="-1">Indexing your</text>
<text x="60" y="250" class="display terracotta" font-size="80" font-weight="700" letter-spacing="-1">documents.</text>
<line x1="60" y1="280" x2="1040" y2="280" stroke="#1f1a14" stroke-width="2"/>
<text x="60" y="320" class="ink-soft display" font-size="22">Load. Chunk. Embed. Store.</text>
<text x="60" y="345" class="ink-soft display" font-size="22">The model doesn't learn your data — the prompt fetches it.</text>
<text x="60" y="385" class="mono ink-mute" font-size="11" letter-spacing="2">68 MIN · LANGCHAIN · PYPDF · RECURSIVE SPLITTER · TEXT-EMBEDDING-3 · VECTOR STORES</text>

<!-- THE BIG IDEA -->
<g transform="translate(60, 430)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">WHY RAG EXISTS</text>
  <rect x="0" y="20" width="980" height="180" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-width="2"/>
  <text x="24" y="58" class="display ink" font-size="22" font-weight="700">A trained LLM knows the public internet.</text>
  <text x="24" y="86" class="display ink" font-size="22" font-weight="700">It does not know <tspan class="terracotta">your</tspan> drug policy, billing codes, onboarding manual.</text>
  <text x="24" y="124" class="ink-soft" font-size="15">RAG closes that gap at <tspan font-weight="700">query time</tspan>: fetch the most relevant snippets from your documents,</text>
  <text x="24" y="146" class="ink-soft" font-size="15">paste them into the prompt as context, let the model answer using that context.</text>
  <text x="24" y="180" class="mono ink-mute" font-size="12" letter-spacing="1">NOT FINE-TUNING · NOT MEMORY · JUST PROMPT AUGMENTATION</text>
</g>

<!-- CONTEXT ROT -->
<g transform="translate(60, 660)">
  <text class="mono ochre" font-size="11" font-weight="700" letter-spacing="3">CONTEXT WINDOW vs CONTEXT ROT</text>

  <rect x="0" y="20" width="475" height="240" fill="rgba(200, 155, 60, 0.08)" stroke="#c89b3c" stroke-width="1"/>
  <text x="20" y="50" class="display ink" font-size="20" font-weight="700">Context window</text>
  <text x="20" y="78" class="ink-soft" font-size="14">Total tokens the model can process in one</text>
  <text x="20" y="98" class="ink-soft" font-size="14">call: input + retrieved context + output.</text>
  <text x="20" y="128" class="mono ink-mute" font-size="11">A token ≈ 3–4 English characters.</text>
  <text x="20" y="148" class="mono ink-mute" font-size="11">Gemini 2.5 Pro: ~2M tokens.</text>
  <text x="20" y="168" class="mono ink-mute" font-size="11">Most production models: 128k – 1M.</text>
  <text x="20" y="208" class="display ink-soft" font-size="15" font-style="italic">The advertised limit, not the useful limit.</text>

  <rect x="505" y="20" width="475" height="240" fill="rgba(184, 71, 46, 0.08)" stroke="#b8472e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="525" y="50" class="display terracotta" font-size="20" font-weight="700">Context rot</text>
  <text x="525" y="78" class="ink" font-size="14">Quality degrades <tspan font-weight="700">well before</tspan> you fill the window.</text>
  <text x="525" y="98" class="ink" font-size="14">Chroma Research (2025): all 18 frontier models</text>
  <text x="525" y="118" class="ink" font-size="14">got worse as input length grew.</text>
  <text x="525" y="148" class="mono ink-mute" font-size="11">200k-window model can degrade at 50k.</text>
  <text x="525" y="168" class="mono ink-mute" font-size="11">Rule of thumb: stay under ~50% of the window.</text>
  <text x="525" y="208" class="display ink-soft" font-size="15" font-style="italic">This is why RAG still matters even at 2M tokens.</text>
</g>

<!-- THE PIPELINE -->
<g transform="translate(60, 950)">
  <text class="mono teal" font-size="11" font-weight="700" letter-spacing="3">THE INDEXING PIPELINE — OFFLINE / BATCH</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">Four steps. Each one has real choices.</text>

  <!-- Pipeline visual -->
  <g transform="translate(0, 60)">
    <!-- Load -->
    <rect x="0" y="0" width="230" height="80" fill="#1f1a14"/>
    <text x="115" y="35" text-anchor="middle" fill="#f5efe6" class="mono" font-size="13" letter-spacing="3" font-weight="700">1 · LOAD</text>
    <text x="115" y="58" text-anchor="middle" fill="#f8e6cf" class="mono" font-size="11">extract text from PDFs</text>

    <text x="240" y="48" class="ink" font-size="22" font-weight="700">→</text>

    <!-- Chunk -->
    <rect x="270" y="0" width="230" height="80" fill="#b8472e"/>
    <text x="385" y="35" text-anchor="middle" fill="#f5efe6" class="mono" font-size="13" letter-spacing="3" font-weight="700">2 · CHUNK</text>
    <text x="385" y="58" text-anchor="middle" fill="#f8e6cf" class="mono" font-size="11">split into logical pieces</text>

    <text x="510" y="48" class="ink" font-size="22" font-weight="700">→</text>

    <!-- Embed -->
    <rect x="540" y="0" width="220" height="80" fill="#2a5d62"/>
    <text x="650" y="35" text-anchor="middle" fill="#f5efe6" class="mono" font-size="13" letter-spacing="3" font-weight="700">3 · EMBED</text>
    <text x="650" y="58" text-anchor="middle" fill="#5ba0a8" class="mono" font-size="11">text → fixed-length vector</text>

    <text x="770" y="48" class="ink" font-size="22" font-weight="700">→</text>

    <!-- Store -->
    <rect x="800" y="0" width="180" height="80" fill="#c89b3c"/>
    <text x="890" y="35" text-anchor="middle" fill="#1f1a14" class="mono" font-size="13" letter-spacing="3" font-weight="700">4 · STORE</text>
    <text x="890" y="58" text-anchor="middle" fill="#1f1a14" class="mono" font-size="11">vector database</text>
  </g>
</g>

<!-- STEP DETAILS -->
<g transform="translate(60, 1110)">

  <!-- STEP 1 - LOAD -->
  <g>
    <rect x="0" y="0" width="475" height="220" fill="rgba(31, 26, 20, 0.04)" stroke="#d4c9b5" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="220" fill="#1f1a14"/>
    <text x="22" y="32" class="mono ink-mute" font-size="11" letter-spacing="3" font-weight="700">STEP 1 — LOAD</text>
    <text x="22" y="60" class="display ink" font-size="20" font-weight="700">The messiest step.</text>
    <text x="22" y="86" class="ink-soft" font-size="13">PDFs are layout containers, not text files.</text>
    <text x="22" y="104" class="ink-soft" font-size="13">If extraction is wrong, nothing downstream recovers.</text>

    <text x="22" y="134" class="mono ink" font-size="11" font-weight="700" letter-spacing="1">TOOLS</text>
    <text x="22" y="154" class="mono ink-soft" font-size="11">PyPDF · PyMuPDF — Python loaders</text>
    <text x="22" y="172" class="mono ink-soft" font-size="11">Docling (IBM) — PDF → Markdown</text>
    <text x="22" y="190" class="mono ink-soft" font-size="11">LangExtract (Google) — structured fields + grounding</text>
    <text x="22" y="208" class="mono ink-soft" font-size="11">Azure Doc Intelligence — production scale, custom models</text>
  </g>

  <!-- STEP 2 - CHUNK -->
  <g transform="translate(505, 0)">
    <rect x="0" y="0" width="475" height="220" fill="rgba(184, 71, 46, 0.04)" stroke="#d4c9b5" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="220" fill="#b8472e"/>
    <text x="22" y="32" class="mono terracotta" font-size="11" letter-spacing="3" font-weight="700">STEP 2 — CHUNK</text>
    <text x="22" y="60" class="display ink" font-size="20" font-weight="700">A chunk = one logical unit.</text>
    <text x="22" y="86" class="ink-soft" font-size="13">Why split? Embedding models have input limits;</text>
    <text x="22" y="104" class="ink-soft" font-size="13">focused snippets retrieve better than whole books.</text>

    <text x="22" y="134" class="mono ink" font-size="11" font-weight="700" letter-spacing="1">RECURSIVECHARACTERTEXTSPLITTER</text>
    <text x="22" y="154" class="mono ink-soft" font-size="11">chunk_size=1000 · chunk_overlap=200</text>
    <text x="22" y="172" class="mono ink-soft" font-size="11">separators=["\n\n", "\n", " ", ""]</text>
    <text x="22" y="194" class="ink-soft" font-size="12">Recursive = try coarsest separator first,</text>
    <text x="22" y="210" class="ink-soft" font-size="12">fall back to finer ones if pieces still too large.</text>
  </g>
</g>

<!-- STEP 3 - EMBED + STEP 4 - STORE -->
<g transform="translate(60, 1360)">

  <!-- STEP 3 - EMBED -->
  <g>
    <rect x="0" y="0" width="475" height="240" fill="rgba(42, 93, 98, 0.05)" stroke="#d4c9b5" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="240" fill="#2a5d62"/>
    <text x="22" y="32" class="mono teal" font-size="11" letter-spacing="3" font-weight="700">STEP 3 — EMBED</text>
    <text x="22" y="60" class="display ink" font-size="20" font-weight="700">Meaning as coordinates.</text>
    <text x="22" y="86" class="ink-soft" font-size="13">Each chunk → vector of floats. Similar meaning,</text>
    <text x="22" y="104" class="ink-soft" font-size="13">close vectors. The numbers aren't readable;</text>
    <text x="22" y="122" class="ink-soft" font-size="13">only their geometric relationships matter.</text>

    <text x="22" y="152" class="mono ink" font-size="11" font-weight="700" letter-spacing="1">OPENAI MODELS</text>
    <text x="22" y="172" class="mono ink-soft" font-size="11">text-embedding-ada-002 · 1536-dim (legacy)</text>
    <text x="22" y="190" class="mono ink-soft" font-size="11">text-embedding-3-small · 1536-dim</text>
    <text x="22" y="208" class="mono ink-soft" font-size="11">text-embedding-3-large · 3072-dim (configurable)</text>
    <text x="22" y="228" class="mono ink-mute" font-size="10">Or: HuggingFace open-source (Sentence-BERT family)</text>
  </g>

  <!-- STEP 4 - STORE -->
  <g transform="translate(505, 0)">
    <rect x="0" y="0" width="475" height="240" fill="rgba(200, 155, 60, 0.06)" stroke="#d4c9b5" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="240" fill="#c89b3c"/>
    <text x="22" y="32" class="mono ochre" font-size="11" letter-spacing="3" font-weight="700">STEP 4 — STORE</text>
    <text x="22" y="60" class="display ink" font-size="20" font-weight="700">A vector DB, not a SQL index.</text>
    <text x="22" y="86" class="ink-soft" font-size="13">Needs to answer: "give me the 4 vectors</text>
    <text x="22" y="104" class="ink-soft" font-size="13">closest to this query vector." SQL can't.</text>

    <text x="22" y="134" class="mono ink" font-size="11" font-weight="700" letter-spacing="1">OPTIONS</text>
    <text x="22" y="154" class="mono ink-soft" font-size="11">Chroma · local, embedded, open source</text>
    <text x="22" y="172" class="mono ink-soft" font-size="11">FAISS · Meta AI, in-memory, C++ + Python</text>
    <text x="22" y="190" class="mono ink-soft" font-size="11">InMemoryVectorStore · LangChain, demo only</text>
    <text x="22" y="208" class="mono ink-soft" font-size="11">Pinecone · managed cloud</text>
    <text x="22" y="226" class="mono ink-soft" font-size="11">Azure Cosmos DB · vector mode</text>
  </g>
</g>

<!-- LIVE RUN STATS -->
<g transform="translate(60, 1630)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE LIVE RUN · 57-PAGE DATABRICKS PDF</text>
  <rect x="0" y="20" width="980" height="120" fill="#1f1a14"/>
  <text x="40" y="60" fill="#f5efe6" class="mono" font-size="13" letter-spacing="2">INPUT</text>
  <text x="40" y="90" fill="#f8e6cf" class="display" font-size="38" font-weight="700">57 pages</text>

  <text x="280" y="60" fill="#f5efe6" class="mono" font-size="13" letter-spacing="2">CHUNKS</text>
  <text x="280" y="90" fill="#f8e6cf" class="display" font-size="38" font-weight="700">90</text>
  <text x="280" y="115" fill="#8b7d65" class="mono" font-size="11">min 1 · max 999 · avg 707 chars</text>

  <text x="540" y="60" fill="#f5efe6" class="mono" font-size="13" letter-spacing="2">VECTORS</text>
  <text x="540" y="90" fill="#f8e6cf" class="display" font-size="38" font-weight="700">90 × 1536</text>
  <text x="540" y="115" fill="#8b7d65" class="mono" font-size="11">one ada-002 vector per chunk</text>

  <text x="820" y="60" fill="#f5efe6" class="mono" font-size="13" letter-spacing="2">STORE</text>
  <text x="820" y="90" fill="#f8e6cf" class="display" font-size="22" font-weight="700">InMemory</text>
  <text x="820" y="115" fill="#8b7d65" class="mono" font-size="11">LangChain dict-of-vectors</text>
</g>

<!-- JAVA / SPRING BRIDGE -->
<g transform="translate(60, 1810)">
  <rect x="0" y="0" width="980" height="130" fill="rgba(109, 179, 63, 0.07)" stroke="#6db33f" stroke-width="2" stroke-dasharray="0"/>
  <rect x="0" y="0" width="6" height="130" fill="#6db33f"/>
  <text x="22" y="28" class="mono spring" font-size="11" letter-spacing="3" font-weight="700">JAVA / SPRING BRIDGE</text>
  <text x="22" y="58" class="display ink" font-size="20" font-weight="700">RAG ≈ query-time JOIN between a vector store and an LLM call.</text>
  <text x="22" y="86" class="ink-soft" font-size="14">The model is stateless; the vector store is its read-only data source.</text>
  <text x="22" y="108" class="ink-soft" font-size="14">Fine-tuning is redeploying the service. RAG just changes the request payload.</text>
</g>

<!-- FOOTER -->
<g transform="translate(60, 1990)">
  <line x1="0" y1="0" x2="980" y2="0" stroke="#1f1a14" stroke-width="1"/>
  <text x="0" y="28" class="mono ink-mute" font-size="11" letter-spacing="3">SASMITA COURSE · SESSION 12 · 2026-05-19</text>
  <text x="980" y="28" text-anchor="end" class="mono ink-mute" font-size="11" letter-spacing="3">RETRIEVAL → SESSION 13</text>
</g>

</svg>
