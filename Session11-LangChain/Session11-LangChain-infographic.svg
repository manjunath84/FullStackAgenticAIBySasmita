<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2400" font-family="'Spectral', 'Iowan Old Style', Georgia, serif">
<defs>
<style>
.paper { fill: #f5efe6; }
.paper-2 { fill: #ede5d6; }
.ink { fill: #1f1a14; }
.ink-soft { fill: #4a4239; }
.ink-mute { fill: #8b7d65; }
.terracotta { fill: #b8472e; }
.terracotta-light { fill: #d96d4a; }
.teal { fill: #2a5d62; }
.teal-soft { fill: #5ba0a8; }
.ochre { fill: #c89b3c; }
.highlight { fill: #f8e6cf; }
.spring { fill: #6db33f; }
.mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
.display { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; }
</style>
<pattern id="dots11" patternUnits="userSpaceOnUse" width="100" height="100">
<circle cx="20" cy="30" r="0.6" fill="#1f1a14" opacity="0.06"/>
<circle cx="70" cy="80" r="0.5" fill="#1f1a14" opacity="0.04"/>
</pattern>
</defs>

<rect width="1100" height="2400" class="paper"/>
<rect width="1100" height="2400" fill="url(#dots11)"/>

<!-- HEADER -->
<text x="60" y="80" class="mono terracotta" font-size="13" font-weight="700" letter-spacing="6">SESSION 11 · LANGCHAIN</text>
<text x="60" y="170" class="display ink" font-size="80" font-weight="700" letter-spacing="-1">The Unifying</text>
<text x="60" y="250" class="display terracotta" font-size="80" font-weight="700" letter-spacing="-1">Layer.</text>
<line x1="60" y1="280" x2="1040" y2="280" stroke="#1f1a14" stroke-width="2"/>
<text x="60" y="320" class="ink-soft display" font-size="22">One interface across OpenAI, Anthropic, Google, Hugging Face, Groq.</text>
<text x="60" y="345" class="ink-soft display" font-size="22">Change one string. Swap the model.</text>
<text x="60" y="385" class="mono ink-mute" font-size="11" letter-spacing="2">63 MIN · LANGCHAIN + LANGGRAPH + LANGFUSE · init_chat_model · ChatOpenAI · .invoke()</text>

<!-- TWO FIXES BANNER -->
<g transform="translate(60, 430)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">TWO FIXES TO FLAG UP FRONT</text>
  <rect x="0" y="20" width="480" height="120" fill="rgba(184, 71, 46, 0.08)" stroke="#b8472e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="20" y="50" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">"SIGMOID OUTPUT"</text>
  <text x="20" y="80" class="ink" font-size="15">It's <tspan font-weight="700">softmax</tspan>, not sigmoid.</text>
  <text x="20" y="104" class="ink" font-size="15">Sigmoid is per-element. Softmax normalizes</text>
  <text x="20" y="124" class="ink" font-size="15">over the whole vocabulary — probs sum to 1.</text>

  <rect x="500" y="20" width="480" height="120" fill="rgba(184, 71, 46, 0.08)" stroke="#b8472e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="520" y="50" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">"LLM CAN NEVER BE DETERMINISTIC"</text>
  <text x="520" y="80" class="ink" font-size="15">Overstated. With <tspan font-weight="700">T=0 + greedy</tspan> on</text>
  <text x="520" y="104" class="ink" font-size="15">one machine, output <tspan font-weight="700">is</tspan> deterministic.</text>
  <text x="520" y="124" class="ink" font-size="15">Non-det comes from sampling + serving infra.</text>
</g>

<!-- THE PORTABILITY PROBLEM -->
<g transform="translate(60, 620)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE PROBLEM LANGCHAIN SOLVES</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">Without it: every provider, a new SDK.</text>

  <!-- Without LangChain -->
  <g transform="translate(0, 60)">
    <text x="0" y="0" class="mono ink-mute" font-size="11" letter-spacing="2">WITHOUT LANGCHAIN</text>
    <rect x="0" y="14" width="475" height="240" fill="rgba(184, 71, 46, 0.05)" stroke="#d4c9b5" stroke-width="1"/>

    <rect x="20" y="38" width="200" height="44" fill="#b8472e"/>
    <text x="120" y="60" text-anchor="middle" fill="#f5efe6" class="mono" font-size="11" letter-spacing="2">OPENAI SDK</text>
    <text x="120" y="76" text-anchor="middle" fill="#f8e6cf" class="mono" font-size="10">openai.chat.completions.create(...)</text>

    <rect x="20" y="98" width="200" height="44" fill="#2a5d62"/>
    <text x="120" y="120" text-anchor="middle" fill="#f5efe6" class="mono" font-size="11" letter-spacing="2">ANTHROPIC SDK</text>
    <text x="120" y="136" text-anchor="middle" fill="#5ba0a8" class="mono" font-size="10">client.messages.create(...)</text>

    <rect x="20" y="158" width="200" height="44" fill="#c89b3c"/>
    <text x="120" y="180" text-anchor="middle" fill="#1f1a14" class="mono" font-size="11" letter-spacing="2">GOOGLE SDK</text>
    <text x="120" y="196" text-anchor="middle" fill="#1f1a14" class="mono" font-size="10">genai.GenerativeModel(...)</text>

    <text x="240" y="62" class="ink" font-size="13" font-style="italic">Different shape.</text>
    <text x="240" y="120" class="ink" font-size="13" font-style="italic">max_tokens required.</text>
    <text x="240" y="180" class="ink" font-size="13" font-style="italic">Different again.</text>

    <text x="20" y="232" class="ink-soft" font-size="13" font-style="italic">Swap provider → rewrite call sites → re-test prompts.</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(485, 180)">
    <path d="M 0 0 L 20 0 L 20 -10 L 40 5 L 20 20 L 20 10 L 0 10 Z" fill="#b8472e"/>
  </g>

  <!-- With LangChain -->
  <g transform="translate(545, 60)">
    <text x="0" y="0" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">WITH LANGCHAIN</text>
    <rect x="0" y="14" width="435" height="240" fill="rgba(109, 179, 63, 0.07)" stroke="#6db33f" stroke-width="2"/>

    <text x="20" y="48" class="mono ink" font-size="13">from langchain.chat_models import init_chat_model</text>
    <text x="20" y="78" class="mono ink-mute" font-size="13"># OpenAI</text>
    <text x="20" y="100" class="mono ink" font-size="13">llm = init_chat_model(<tspan class="terracotta" font-weight="700">"openai:gpt-4o-mini"</tspan>)</text>

    <text x="20" y="138" class="mono ink-mute" font-size="13"># Anthropic — change one string</text>
    <text x="20" y="160" class="mono ink" font-size="13">llm = init_chat_model(<tspan class="terracotta" font-weight="700">"anthropic:claude-…"</tspan>)</text>

    <text x="20" y="198" class="mono ink-mute" font-size="13"># Gemini — same again</text>
    <text x="20" y="220" class="mono ink" font-size="13">llm = init_chat_model(<tspan class="terracotta" font-weight="700">"google_genai:gemini-…"</tspan>)</text>

    <text x="20" y="244" class="ink-soft" font-size="13" font-style="italic">Rest of the application code is unchanged.</text>
  </g>

  <!-- Java/Spring bridge -->
  <g transform="translate(0, 340)">
    <rect x="0" y="0" width="980" height="58" fill="rgba(109, 179, 63, 0.07)" stroke="#6db33f" stroke-width="2"/>
    <text x="20" y="22" class="mono spring" font-size="10" font-weight="700" letter-spacing="3">JAVA / SPRING BRIDGE</text>
    <text x="20" y="44" class="ink" font-size="14">Same pattern as <tspan class="mono" font-weight="700">JdbcTemplate</tspan> over <tspan class="mono" font-weight="700">DataSource</tspan>: one API, swap driver/provider via config. App code unchanged.</text>
  </g>
</g>

<!-- THE ECOSYSTEM -->
<g transform="translate(60, 1090)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE ECOSYSTEM · FOUR PRODUCTS, ONE STACK</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">Build · Orchestrate · Observe.</text>

  <g transform="translate(0, 60)">
    <!-- LangChain -->
    <rect x="0" y="0" width="480" height="130" fill="#b8472e"/>
    <text x="20" y="32" fill="#f8e6cf" class="mono" font-size="11" letter-spacing="3">BUILD · OPEN SOURCE</text>
    <text x="20" y="68" fill="#f5efe6" class="display" font-size="32" font-weight="700">LangChain</text>
    <text x="20" y="96" fill="#f8e6cf" font-size="15">Chat models, prompts, messages, tools,</text>
    <text x="20" y="116" fill="#f8e6cf" font-size="15">memory, output parsers, linear chains.</text>

    <!-- LangGraph -->
    <rect x="500" y="0" width="480" height="130" fill="#2a5d62"/>
    <text x="520" y="32" fill="#5ba0a8" class="mono" font-size="11" letter-spacing="3">ORCHESTRATE · OPEN SOURCE</text>
    <text x="520" y="68" fill="#f5efe6" class="display" font-size="32" font-weight="700">LangGraph</text>
    <text x="520" y="96" fill="#5ba0a8" font-size="15">Stateful graph workflows. Loops,</text>
    <text x="520" y="116" fill="#5ba0a8" font-size="15">branches, single- or multi-agent.</text>

    <!-- LangSmith -->
    <rect x="0" y="146" width="480" height="130" fill="#c89b3c"/>
    <text x="20" y="178" fill="#1f1a14" class="mono" font-size="11" letter-spacing="3">OBSERVE · CLOSED-SOURCE SAAS</text>
    <text x="20" y="214" fill="#1f1a14" class="display" font-size="32" font-weight="700">LangSmith</text>
    <text x="20" y="242" fill="#1f1a14" font-size="15">Traces, evals, prompt management.</text>
    <text x="20" y="262" fill="#1f1a14" font-size="15">First-party. Free tier; not self-hostable.</text>

    <!-- LangFuse -->
    <rect x="500" y="146" width="480" height="130" fill="#1f1a14"/>
    <text x="520" y="178" fill="#c89b3c" class="mono" font-size="11" letter-spacing="3">OBSERVE · OPEN SOURCE</text>
    <text x="520" y="214" fill="#f5efe6" class="display" font-size="32" font-weight="700">LangFuse</text>
    <text x="520" y="242" fill="#ede5d6" font-size="15">Same feature set as LangSmith.</text>
    <text x="520" y="262" fill="#ede5d6" font-size="15">MIT license, self-host or managed cloud.</text>
  </g>

  <text y="430" class="ink-soft" font-size="14" font-style="italic">Lecturer said "LangSmith and LangFuse are exactly same." Feature set yes; deployment model and ownership differ.</text>
</g>

<!-- TEMPERATURE VISUALIZATION -->
<g transform="translate(60, 1590)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">TEMPERATURE · WHAT THE DIAL ACTUALLY DOES</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">P(token) = softmax(logits / T)</text>
  <text y="62" class="ink-soft" font-size="15">Same six candidate tokens, three temperatures. Bars are <tspan font-weight="700">computed</tspan> from softmax — same y-scale across all three.</text>

  <!-- Three bar charts -->
  <g transform="translate(0, 90)">

    <!-- T = 0.3 -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">T = 0.3 · SHARP</text>
      <text x="0" y="20" class="ink-soft" font-size="13">Argmax dominates. Effectively greedy.</text>

      <!-- Axis -->
      <line x1="0" y1="290" x2="300" y2="290" stroke="#1f1a14" stroke-width="1.5"/>
      <line x1="0" y1="40" x2="0" y2="290" stroke="#1f1a14" stroke-width="1.5"/>
      <text x="-5" y="44" text-anchor="end" class="mono ink-mute" font-size="9">1.0</text>
      <text x="-5" y="167" text-anchor="end" class="mono ink-mute" font-size="9">0.5</text>
      <text x="-5" y="293" text-anchor="end" class="mono ink-mute" font-size="9">0.0</text>

      <!-- Bars (height = prob * 250) -->
      <!-- p = [0.8275, 0.1563, 0.0152, 0.0011, 0.0, 0.0] -->
      <rect x="14" y="83" width="38" height="207" fill="#b8472e"/>
      <text x="33" y="78" text-anchor="middle" class="mono ink" font-size="10">0.83</text>
      <text x="33" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₁</text>

      <rect x="58" y="251" width="38" height="39" fill="#d96d4a"/>
      <text x="77" y="246" text-anchor="middle" class="mono ink" font-size="10">0.16</text>
      <text x="77" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₂</text>

      <rect x="102" y="286" width="38" height="4" fill="#d96d4a"/>
      <text x="121" y="281" text-anchor="middle" class="mono ink" font-size="10">0.02</text>
      <text x="121" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₃</text>

      <rect x="146" y="289" width="38" height="1" fill="#d96d4a"/>
      <text x="165" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₄</text>

      <rect x="190" y="290" width="38" height="0" fill="#d96d4a"/>
      <text x="209" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₅</text>

      <rect x="234" y="290" width="38" height="0" fill="#d96d4a"/>
      <text x="253" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₆</text>
    </g>

    <!-- T = 1.0 -->
    <g transform="translate(340, 0)">
      <text x="0" y="0" class="mono teal" font-size="11" font-weight="700" letter-spacing="2">T = 1.0 · STANDARD</text>
      <text x="0" y="20" class="ink-soft" font-size="13">Sample from the trained distribution.</text>

      <line x1="0" y1="290" x2="300" y2="290" stroke="#1f1a14" stroke-width="1.5"/>
      <line x1="0" y1="40" x2="0" y2="290" stroke="#1f1a14" stroke-width="1.5"/>
      <text x="-5" y="44" text-anchor="end" class="mono ink-mute" font-size="9">1.0</text>
      <text x="-5" y="167" text-anchor="end" class="mono ink-mute" font-size="9">0.5</text>
      <text x="-5" y="293" text-anchor="end" class="mono ink-mute" font-size="9">0.0</text>

      <!-- p = [0.4710, 0.2857, 0.1419, 0.0637, 0.0235, 0.0142] heights *250 -->
      <rect x="14" y="172" width="38" height="118" fill="#2a5d62"/>
      <text x="33" y="167" text-anchor="middle" class="mono ink" font-size="10">0.47</text>
      <text x="33" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₁</text>

      <rect x="58" y="219" width="38" height="71" fill="#5ba0a8"/>
      <text x="77" y="214" text-anchor="middle" class="mono ink" font-size="10">0.29</text>
      <text x="77" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₂</text>

      <rect x="102" y="254" width="38" height="36" fill="#5ba0a8"/>
      <text x="121" y="249" text-anchor="middle" class="mono ink" font-size="10">0.14</text>
      <text x="121" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₃</text>

      <rect x="146" y="274" width="38" height="16" fill="#5ba0a8"/>
      <text x="165" y="269" text-anchor="middle" class="mono ink" font-size="10">0.06</text>
      <text x="165" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₄</text>

      <rect x="190" y="284" width="38" height="6" fill="#5ba0a8"/>
      <text x="209" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₅</text>

      <rect x="234" y="287" width="38" height="3" fill="#5ba0a8"/>
      <text x="253" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₆</text>
    </g>

    <!-- T = 2.0 -->
    <g transform="translate(680, 0)">
      <text x="0" y="0" class="mono ochre" font-size="11" font-weight="700" letter-spacing="2">T = 2.0 · FLAT</text>
      <text x="0" y="20" class="ink-soft" font-size="13">Low-probability tokens become competitive.</text>

      <line x1="0" y1="290" x2="300" y2="290" stroke="#1f1a14" stroke-width="1.5"/>
      <line x1="0" y1="40" x2="0" y2="290" stroke="#1f1a14" stroke-width="1.5"/>
      <text x="-5" y="44" text-anchor="end" class="mono ink-mute" font-size="9">1.0</text>
      <text x="-5" y="167" text-anchor="end" class="mono ink-mute" font-size="9">0.5</text>
      <text x="-5" y="293" text-anchor="end" class="mono ink-mute" font-size="9">0.0</text>

      <!-- p = [0.3234, 0.2518, 0.1775, 0.1190, 0.0722, 0.0562] heights *250 -->
      <rect x="14" y="209" width="38" height="81" fill="#c89b3c"/>
      <text x="33" y="204" text-anchor="middle" class="mono ink" font-size="10">0.32</text>
      <text x="33" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₁</text>

      <rect x="58" y="227" width="38" height="63" fill="#c89b3c"/>
      <text x="77" y="222" text-anchor="middle" class="mono ink" font-size="10">0.25</text>
      <text x="77" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₂</text>

      <rect x="102" y="246" width="38" height="44" fill="#c89b3c"/>
      <text x="121" y="241" text-anchor="middle" class="mono ink" font-size="10">0.18</text>
      <text x="121" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₃</text>

      <rect x="146" y="260" width="38" height="30" fill="#c89b3c"/>
      <text x="165" y="255" text-anchor="middle" class="mono ink" font-size="10">0.12</text>
      <text x="165" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₄</text>

      <rect x="190" y="272" width="38" height="18" fill="#c89b3c"/>
      <text x="209" y="267" text-anchor="middle" class="mono ink" font-size="10">0.07</text>
      <text x="209" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₅</text>

      <rect x="234" y="276" width="38" height="14" fill="#c89b3c"/>
      <text x="253" y="271" text-anchor="middle" class="mono ink" font-size="10">0.06</text>
      <text x="253" y="305" text-anchor="middle" class="mono ink-mute" font-size="10">t₆</text>
    </g>

  </g>

  <text y="440" class="ink-soft" font-size="14" font-style="italic">Logits used: [4.0, 3.5, 2.8, 2.0, 1.0, 0.5]. Lecturer's "imaginary at high T" is real — and reversible. Lower T sharpens; higher T flattens.</text>
</g>

<!-- THE CODE SHAPE -->
<g transform="translate(60, 2110)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE END-TO-END SHAPE</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">Five lines. Same skeleton for every provider.</text>

  <g transform="translate(0, 60)">
    <rect x="0" y="0" width="980" height="200" fill="#1f1a14"/>
    <rect x="0" y="0" width="6" height="200" fill="#c89b3c"/>

    <text x="22" y="32" class="mono" fill="#8b7d65" font-size="12"># 1. Load credentials from .env</text>
    <text x="22" y="52" class="mono" fill="#f5efe6" font-size="13">from dotenv import load_dotenv; load_dotenv()</text>

    <text x="22" y="80" class="mono" fill="#8b7d65" font-size="12"># 2. Pick a model — change this string to swap providers</text>
    <text x="22" y="100" class="mono" fill="#f5efe6" font-size="13">llm = init_chat_model(<tspan fill="#d96d4a" font-weight="700">"openai:gpt-4o-mini"</tspan>, temperature=0.7, max_tokens=500)</text>

    <text x="22" y="128" class="mono" fill="#8b7d65" font-size="12"># 3. Build role-tagged messages</text>
    <text x="22" y="148" class="mono" fill="#f5efe6" font-size="13">msgs = [SystemMessage(<tspan fill="#5ba0a8">"…instructions…"</tspan>), HumanMessage(<tspan fill="#5ba0a8">"…question…"</tspan>)]</text>

    <text x="22" y="176" class="mono" fill="#8b7d65" font-size="12"># 4. Invoke. Returns an AIMessage.</text>
    <text x="22" y="196" class="mono" fill="#f5efe6" font-size="13">response = llm.invoke(msgs); print(response.content)</text>
  </g>
</g>

<!-- FOOTER -->
<g transform="translate(60, 2350)">
  <line x1="0" y1="0" x2="980" y2="0" stroke="#1f1a14" stroke-width="1"/>
  <text x="0" y="25" class="mono ink-mute" font-size="10" letter-spacing="2">SESSION 11 · 2026-05-18 · ~63 MIN</text>
  <text x="980" y="25" text-anchor="end" class="mono ink-mute" font-size="10" letter-spacing="2">LANGCHAIN DOCS · OPENAI / ANTHROPIC API REFS · HINTON 2015</text>
</g>

</svg>
