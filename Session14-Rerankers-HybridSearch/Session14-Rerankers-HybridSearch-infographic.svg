<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2580" preserveAspectRatio="xMidYMid meet" font-family="'Spectral', Georgia, serif">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe6"/>
      <stop offset="1" stop-color="#ede5d6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1a14"/>
      <stop offset="1" stop-color="#3a312a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1a14"/>
    </marker>
  </defs>

  <rect width="1100" height="2580" fill="url(#paper)"/>

  <!-- HERO -->
  <g>
    <rect x="0" y="0" width="1100" height="360" fill="url(#ink)"/>
    <g opacity="0.18" stroke="#d96d4a" stroke-width="0.7" fill="none">
      <circle cx="900" cy="180" r="3" fill="#d96d4a"/>
      <circle cx="960" cy="110" r="3" fill="#d96d4a"/>
      <circle cx="1020" cy="210" r="3" fill="#d96d4a"/>
      <circle cx="880" cy="270" r="3" fill="#d96d4a"/>
      <circle cx="990" cy="300" r="3" fill="#d96d4a"/>
      <line x1="900" y1="180" x2="960" y2="110"/>
      <line x1="900" y1="180" x2="1020" y2="210"/>
      <line x1="900" y1="180" x2="880" y2="270"/>
      <line x1="960" y1="110" x2="1020" y2="210"/>
      <line x1="1020" y1="210" x2="990" y2="300"/>
      <line x1="880" y1="270" x2="990" y2="300"/>
    </g>
    <text x="70" y="80" font-size="13" letter-spacing="8" fill="#c89b3c" font-weight="600" font-family="'JetBrains Mono', monospace">SESSION 14 · STUDY NOTES · RAG PART 2</text>
    <text x="70" y="160" font-size="56" font-weight="700" fill="#f5efe6" font-style="italic">Rerankers &amp;</text>
    <text x="70" y="218" font-size="56" font-weight="700" fill="#d96d4a" font-style="italic">Hybrid Search</text>
    <text x="70" y="278" font-size="20" fill="#c5b9a0" font-style="italic">Why vector search alone misses things — and the</text>
    <text x="70" y="305" font-size="20" fill="#c5b9a0" font-style="italic">two layers that make RAG actually precise.</text>
    <line x1="70" y1="335" x2="180" y2="335" stroke="#d96d4a" stroke-width="2"/>
    <text x="70" y="354" font-size="11" letter-spacing="3" fill="#8b7d65" font-family="'JetBrains Mono', monospace">CROSS-ENCODER · BM25 · RRF · LANGCHAIN</text>
  </g>

  <!-- THESIS -->
  <g transform="translate(0, 410)">
    <text x="70" y="0" font-size="100" fill="#b8472e" opacity="0.3" font-family="serif">"</text>
    <foreignObject x="120" y="-40" width="900" height="160">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:24px; line-height:1.4; color:#1f1a14; font-style:italic; font-family:Georgia, serif;">
        The bi-encoder retriever is the <span style="color:#b8472e; font-weight:600;">cheap, broad</span> first pass. The cross-encoder reranker is the <span style="color:#b8472e; font-weight:600;">expensive, precise</span> second pass. You almost always want both.
      </div>
    </foreignObject>
  </g>

  <!-- SECTION 01 — THE TWO ENCODERS -->
  <g transform="translate(0, 660)">
    <text x="70" y="0" font-size="11" letter-spacing="4" fill="#b8472e" font-weight="700" font-family="'JetBrains Mono', monospace">§ 01 — THE ARCHITECTURAL DIFFERENCE</text>
    <text x="70" y="44" font-size="34" fill="#1f1a14" font-weight="700" font-style="italic">Bi-encoder vs cross-encoder</text>

    <!-- BI-ENCODER PANEL -->
    <g transform="translate(70, 100)">
      <rect width="460" height="280" fill="#fbf7ef" stroke="#5ba0a8" stroke-width="2"/>
      <text x="20" y="32" font-size="11" letter-spacing="3" fill="#2a5d62" font-weight="700" font-family="'JetBrains Mono', monospace">BI-ENCODER · VECTOR SEARCH</text>
      <!-- query path -->
      <rect x="20" y="60" width="100" height="34" fill="#f8e6cf" stroke="#1f1a14"/>
      <text x="70" y="82" text-anchor="middle" font-weight="700" font-size="13">query</text>
      <text x="135" y="82" font-size="14">→</text>
      <rect x="155" y="55" width="110" height="44" fill="#2a5d62"/>
      <text x="210" y="82" text-anchor="middle" fill="#f5efe6" font-weight="700" font-size="13">Encoder</text>
      <text x="280" y="82" font-size="14">→</text>
      <rect x="300" y="60" width="90" height="34" fill="#fbf7ef" stroke="#1f1a14"/>
      <text x="345" y="82" text-anchor="middle" font-weight="700" font-size="12" font-family="'JetBrains Mono', monospace">q_vec</text>
      <!-- doc path -->
      <rect x="20" y="125" width="100" height="34" fill="#f8e6cf" stroke="#1f1a14"/>
      <text x="70" y="147" text-anchor="middle" font-weight="700" font-size="13">doc</text>
      <text x="135" y="147" font-size="14">→</text>
      <rect x="155" y="120" width="110" height="44" fill="#2a5d62"/>
      <text x="210" y="147" text-anchor="middle" fill="#f5efe6" font-weight="700" font-size="13">Encoder</text>
      <text x="280" y="147" font-size="14">→</text>
      <rect x="300" y="125" width="90" height="34" fill="#fbf7ef" stroke="#1f1a14"/>
      <text x="345" y="147" text-anchor="middle" font-weight="700" font-size="12" font-family="'JetBrains Mono', monospace">d_vec</text>
      <!-- cosine -->
      <path d="M 390 77 Q 430 77 430 110 Q 430 142 390 142" fill="none" stroke="#1f1a14" stroke-width="1.5"/>
      <rect x="80" y="195" width="300" height="42" fill="#1f1a14"/>
      <text x="230" y="221" text-anchor="middle" fill="#f5efe6" font-weight="700" font-family="'JetBrains Mono', monospace" font-size="13">cosine_sim(q_vec, d_vec) → score</text>
      <text x="230" y="262" text-anchor="middle" font-size="12" fill="#4a4239" font-style="italic" font-family="Georgia, serif">vectors compared after the fact</text>
    </g>

    <!-- CROSS-ENCODER PANEL -->
    <g transform="translate(570, 100)">
      <rect width="460" height="280" fill="#fbf7ef" stroke="#b8472e" stroke-width="2"/>
      <text x="20" y="32" font-size="11" letter-spacing="3" fill="#b8472e" font-weight="700" font-family="'JetBrains Mono', monospace">CROSS-ENCODER · RERANKER</text>
      <rect x="20" y="80" width="270" height="40" fill="#f8e6cf" stroke="#1f1a14"/>
      <text x="155" y="106" text-anchor="middle" font-weight="700" font-size="12" font-family="'JetBrains Mono', monospace">[CLS] query [SEP] doc [SEP]</text>
      <text x="305" y="106" font-size="14">→</text>
      <rect x="325" y="76" width="110" height="48" fill="#b8472e"/>
      <text x="380" y="106" text-anchor="middle" fill="#f5efe6" font-weight="700" font-size="13">Encoder</text>
      <text x="155" y="170" text-anchor="middle" font-size="14">↓</text>
      <rect x="60" y="180" width="160" height="40" fill="#fbf7ef" stroke="#1f1a14"/>
      <text x="140" y="200" text-anchor="middle" font-weight="700" font-size="12" font-family="'JetBrains Mono', monospace">CLS hidden state</text>
      <text x="140" y="216" text-anchor="middle" font-size="11" fill="#4a4239">(pooled rep)</text>
      <text x="235" y="206" font-size="14">→</text>
      <rect x="255" y="180" width="170" height="40" fill="#1f1a14"/>
      <text x="340" y="200" text-anchor="middle" fill="#c89b3c" font-weight="700" font-size="12" font-family="'JetBrains Mono', monospace">linear head</text>
      <text x="340" y="216" text-anchor="middle" fill="#f5efe6" font-size="11" font-family="'JetBrains Mono', monospace">→ relevance score</text>
      <text x="230" y="258" text-anchor="middle" font-size="12" fill="#4a4239" font-style="italic" font-family="Georgia, serif">self-attention sees both at once</text>
    </g>

    <!-- comparison row -->
    <g transform="translate(70, 410)">
      <text x="0" y="0" font-size="11" letter-spacing="3" fill="#8b7d65" font-weight="700" font-family="'JetBrains Mono', monospace">FAST · BROAD · IMPRECISE</text>
      <text x="500" y="0" font-size="11" letter-spacing="3" fill="#8b7d65" font-weight="700" font-family="'JetBrains Mono', monospace">SLOW · NARROW · PRECISE</text>
      <line x1="0" y1="14" x2="960" y2="14" stroke="#d4c9b5"/>
    </g>
  </g>

  <!-- SECTION 02 — RETRIEVE-THEN-RERANK -->
  <g transform="translate(0, 1180)">
    <text x="70" y="0" font-size="11" letter-spacing="4" fill="#b8472e" font-weight="700" font-family="'JetBrains Mono', monospace">§ 02 — THE PATTERN</text>
    <text x="70" y="44" font-size="34" fill="#1f1a14" font-weight="700" font-style="italic">Retrieve-then-rerank</text>

    <g transform="translate(70, 90)">
      <!-- step 1 -->
      <rect x="0" y="0" width="290" height="80" fill="#2a5d62"/>
      <text x="145" y="34" text-anchor="middle" fill="#f5efe6" font-weight="700" font-size="14" font-family="'JetBrains Mono', monospace">STAGE 1 · bi-encoder</text>
      <text x="145" y="56" text-anchor="middle" fill="#c89b3c" font-size="12">k=10 or k=20 candidates</text>
      <text x="313" y="46" font-size="22">→</text>
      <!-- step 2 -->
      <rect x="335" y="0" width="290" height="80" fill="#b8472e"/>
      <text x="480" y="34" text-anchor="middle" fill="#f5efe6" font-weight="700" font-size="14" font-family="'JetBrains Mono', monospace">STAGE 2 · cross-encoder</text>
      <text x="480" y="56" text-anchor="middle" fill="#c89b3c" font-size="12">re-score · drop below threshold</text>
      <text x="648" y="46" font-size="22">→</text>
      <!-- step 3 -->
      <rect x="670" y="0" width="290" height="80" fill="#1f1a14"/>
      <text x="815" y="34" text-anchor="middle" fill="#f5efe6" font-weight="700" font-size="14" font-family="'JetBrains Mono', monospace">STAGE 3 · LLM</text>
      <text x="815" y="56" text-anchor="middle" fill="#c89b3c" font-size="12">top 3–5 chunks in prompt</text>
    </g>

    <foreignObject x="70" y="200" width="960" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px; line-height:1.55; color:#4a4239;">
        Why this works: the bi-encoder is cheap enough to score the whole corpus. The cross-encoder is too slow for that — but cheap enough for the 10 survivors. You get recall from stage 1 and precision from stage 2. <strong style="color:#b8472e;">The reranker can also drop candidates below a score threshold</strong>, shortening the prompt and reducing hallucination.
      </div>
    </foreignObject>
  </g>

  <!-- SECTION 03 — HYBRID + RRF -->
  <g transform="translate(0, 1530)">
    <text x="70" y="0" font-size="11" letter-spacing="4" fill="#b8472e" font-weight="700" font-family="'JetBrains Mono', monospace">§ 03 — TWO CHANNELS, ONE LIST</text>
    <text x="70" y="44" font-size="34" fill="#1f1a14" font-weight="700" font-style="italic">Hybrid search &amp; RRF</text>

    <!-- two columns of lists -->
    <g transform="translate(70, 90)">
      <text x="0" y="0" font-size="11" letter-spacing="3" fill="#2a5d62" font-weight="700" font-family="'JetBrains Mono', monospace">VECTOR LIST</text>
      <rect x="0" y="20" width="200" height="40" fill="#2a5d62"/><text x="100" y="46" text-anchor="middle" fill="#f5efe6" font-weight="700">1. Doc A</text>
      <rect x="0" y="65" width="200" height="40" fill="#5ba0a8"/><text x="100" y="91" text-anchor="middle" fill="#f5efe6" font-weight="700">2. Doc B</text>
      <rect x="0" y="110" width="200" height="40" fill="#5ba0a8" opacity="0.7"/><text x="100" y="136" text-anchor="middle" fill="#f5efe6" font-weight="700">3. Doc C</text>
    </g>
    <g transform="translate(310, 90)">
      <text x="0" y="0" font-size="11" letter-spacing="3" fill="#b8472e" font-weight="700" font-family="'JetBrains Mono', monospace">BM25 LIST · keyword</text>
      <rect x="0" y="20" width="200" height="40" fill="#b8472e"/><text x="100" y="46" text-anchor="middle" fill="#f5efe6" font-weight="700">1. Doc C</text>
      <rect x="0" y="65" width="200" height="40" fill="#d96d4a"/><text x="100" y="91" text-anchor="middle" fill="#f5efe6" font-weight="700">2. Doc A</text>
      <rect x="0" y="110" width="200" height="40" fill="#d96d4a" opacity="0.7"/><text x="100" y="136" text-anchor="middle" fill="#f5efe6" font-weight="700">3. Doc B</text>
    </g>
    <text x="555" y="160" font-size="24">⟹</text>
    <!-- RRF formula box -->
    <g transform="translate(620, 100)">
      <rect width="400" height="170" fill="#1f1a14"/>
      <text x="200" y="34" text-anchor="middle" fill="#c89b3c" font-size="12" letter-spacing="2" font-weight="700" font-family="'JetBrains Mono', monospace">RRF with k = 1 (lecturer's example)</text>
      <text x="20" y="68" fill="#5ba0a8" font-family="'JetBrains Mono', monospace">A:</text>
      <text x="55" y="68" fill="#f5efe6" font-family="'JetBrains Mono', monospace">1/(1+1) + 1/(1+2)</text>
      <text x="380" y="68" fill="#d96d4a" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', monospace">= 0.833</text>
      <text x="20" y="96" fill="#5ba0a8" font-family="'JetBrains Mono', monospace">C:</text>
      <text x="55" y="96" fill="#f5efe6" font-family="'JetBrains Mono', monospace">1/(1+3) + 1/(1+1)</text>
      <text x="380" y="96" fill="#d96d4a" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', monospace">= 0.750</text>
      <text x="20" y="124" fill="#5ba0a8" font-family="'JetBrains Mono', monospace">B:</text>
      <text x="55" y="124" fill="#f5efe6" font-family="'JetBrains Mono', monospace">1/(1+2) + 1/(1+3)</text>
      <text x="380" y="124" fill="#d96d4a" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', monospace">= 0.583</text>
      <line x1="20" y1="138" x2="380" y2="138" stroke="#c89b3c" stroke-dasharray="2,3"/>
      <text x="200" y="158" text-anchor="middle" fill="#f5efe6" font-style="italic" font-family="Georgia, serif">fused: A &gt; C &gt; B</text>
    </g>

    <!-- WHEN -->
    <g transform="translate(70, 320)">
      <foreignObject x="0" y="0" width="960" height="120">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px; line-height:1.55; color:#4a4239;">
          <div style="font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:2px; color:#b8472e; font-weight:700; margin-bottom:8px;">WHEN HYBRID HELPS</div>
          BM25 catches what vector search misses: exact codes, acronyms, product names, billing modifiers — strings whose <em>identity</em> matters more than their meaning. Vector search catches paraphrase and synonyms. <strong>Their failure modes are complementary.</strong>
          <br/><br/>
          <span style="font-family:'JetBrains Mono', monospace; color:#1f1a14;">LangChain default:</span> <code style="background:#f8e6cf; padding:2px 6px; border:1px solid rgba(200,155,60,0.3);">EnsembleRetriever(weights=[0.5, 0.5])</code> with internal <code style="background:#f8e6cf; padding:2px 6px; border:1px solid rgba(200,155,60,0.3);">k=60</code>. Hybrid is <em>optional</em>; reranker is the bigger win.
        </div>
      </foreignObject>
    </g>
  </g>

  <!-- SECTION 04 — FULL PIPELINE -->
  <g transform="translate(0, 2100)">
    <text x="70" y="0" font-size="11" letter-spacing="4" fill="#b8472e" font-weight="700" font-family="'JetBrains Mono', monospace">§ 04 — FULL PIPELINE</text>
    <text x="70" y="44" font-size="34" fill="#1f1a14" font-weight="700" font-style="italic">Query → Hybrid → Rerank → LLM</text>

    <g transform="translate(70, 90)">
      <rect x="380" y="0" width="200" height="44" fill="#1f1a14"/>
      <text x="480" y="29" text-anchor="middle" fill="#f5efe6" font-weight="700" font-size="14">query</text>
      <line x1="480" y1="44" x2="180" y2="100" stroke="#1f1a14" stroke-width="1.5"/>
      <line x1="480" y1="44" x2="780" y2="100" stroke="#1f1a14" stroke-width="1.5"/>
      <rect x="40" y="100" width="280" height="56" fill="#2a5d62"/>
      <text x="180" y="124" text-anchor="middle" fill="#f5efe6" font-weight="700" font-size="14">FAISS retriever</text>
      <text x="180" y="144" text-anchor="middle" fill="#c89b3c" font-size="11" font-family="'JetBrains Mono', monospace">semantic · k=10</text>
      <rect x="640" y="100" width="280" height="56" fill="#b8472e"/>
      <text x="780" y="124" text-anchor="middle" fill="#f5efe6" font-weight="700" font-size="14">BM25 retriever</text>
      <text x="780" y="144" text-anchor="middle" fill="#c89b3c" font-size="11" font-family="'JetBrains Mono', monospace">lexical · k=10</text>
      <line x1="180" y1="156" x2="480" y2="200" stroke="#1f1a14" stroke-width="1.5"/>
      <line x1="780" y1="156" x2="480" y2="200" stroke="#1f1a14" stroke-width="1.5"/>
      <rect x="280" y="200" width="400" height="56" fill="#1f1a14"/>
      <text x="480" y="224" text-anchor="middle" fill="#f5efe6" font-weight="700" font-size="14" font-family="'JetBrains Mono', monospace">EnsembleRetriever (RRF)</text>
      <text x="480" y="244" text-anchor="middle" fill="#c89b3c" font-size="11">weighted · ~10 unique candidates</text>
      <line x1="480" y1="256" x2="480" y2="290" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="280" y="290" width="400" height="56" fill="#c89b3c"/>
      <text x="480" y="314" text-anchor="middle" fill="#1f1a14" font-weight="700" font-size="14" font-family="'JetBrains Mono', monospace">CrossEncoderReranker</text>
      <text x="480" y="334" text-anchor="middle" fill="#1f1a14" font-size="11">top_n=3 · drops weak chunks</text>
      <line x1="480" y1="346" x2="480" y2="378" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="280" y="378" width="400" height="44" fill="#4a4239"/>
      <text x="480" y="404" text-anchor="middle" fill="#f5efe6" font-weight="700" font-size="13" font-family="'JetBrains Mono', monospace">format_docs → prompt → LLM</text>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(0, 2520)">
    <line x1="70" y1="0" x2="1030" y2="0" stroke="#1f1a14" stroke-width="1"/>
    <text x="70" y="30" font-size="11" letter-spacing="2" fill="#8b7d65" font-family="'JetBrains Mono', monospace">SESSION 14 · 2026-05-19 · 82.2 MIN · RAG PART 2</text>
    <text x="1030" y="30" text-anchor="end" font-size="11" letter-spacing="2" fill="#8b7d65" font-family="'JetBrains Mono', monospace">NEXT — RERANKER &amp; HYBRID, IN CODE</text>
  </g>
</svg>
