<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="igMCP2Title">
        <title id="igMCP2Title">MCP Lecture 2 — Build your own MCP server and client</title>
        <defs>
          <style>
            .display { font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; }
            .display-r { font-family: 'Fraunces', serif; font-weight: 700; }
            .body { font-family: 'Spectral', serif; }
            .mono { font-family: 'JetBrains Mono', monospace; }
          </style>
          <marker id="ig2Arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#b8472e"/>
          </marker>
        </defs>
        <rect width="1200" height="1500" fill="#f5efe6"/>

        <text x="60" y="80" class="mono" fill="#b8472e" font-size="13" letter-spacing="6" font-weight="700">MCP · LECTURE 02 · VISUAL SUMMARY</text>
        <text x="60" y="160" class="display" fill="#1f1a14" font-size="58">Build your own MCP server</text>
        <text x="60" y="218" class="display" fill="#b8472e" font-size="58">and client.</text>
        <line x1="60" y1="252" x2="1140" y2="252" stroke="#1f1a14" stroke-width="2"/>
        <text x="60" y="285" class="body" fill="#4a4239" font-size="18" font-style="italic">FastMCP + three decorators + thirty lines of Python.</text>

        <text x="60" y="340" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§03 · THE SERVER — MINIMAL EXAMPLE</text>

        <g transform="translate(60, 360)">
          <rect x="0" y="0" width="1080" height="290" fill="#1f1a14"/>
          <text x="20" y="30" class="mono" fill="#c89b3c" font-size="12" font-weight="700">simple_server.py</text>
          <text x="20" y="60" class="mono" fill="#f5efe6" font-size="12">from fastmcp import FastMCP</text>
          <text x="20" y="80" class="mono" fill="#f5efe6" font-size="12"></text>
          <text x="20" y="100" class="mono" fill="#f5efe6" font-size="12">mcp = FastMCP(name="Beginner MCP Server")</text>
          <text x="20" y="130" class="mono" fill="#6db33f" font-size="12">@mcp.tool</text>
          <text x="20" y="150" class="mono" fill="#f5efe6" font-size="12">def add(a: int, b: int) -&gt; int:</text>
          <text x="20" y="170" class="mono" fill="#8b7d65" font-size="12">    """Add two numbers together."""</text>
          <text x="20" y="190" class="mono" fill="#f5efe6" font-size="12">    return a + b</text>
          <text x="20" y="220" class="mono" fill="#c89b3c" font-size="12">@mcp.resource("resource://greeting")</text>
          <text x="20" y="240" class="mono" fill="#f5efe6" font-size="12">def get_greeting() -&gt; str:</text>
          <text x="20" y="260" class="mono" fill="#f5efe6" font-size="12">    return "Hey! Welcome to MCP"</text>
          <text x="20" y="285" class="mono" fill="#f5efe6" font-size="12">mcp.run()  # stdio is the default</text>
        </g>

        <text x="60" y="700" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§04 · THREE PRIMITIVES IN FASTMCP</text>

        <g transform="translate(60, 720)">
          <rect x="0" y="0" width="350" height="200" fill="#ede5d6" stroke="#d4c9b5"/>
          <rect x="0" y="0" width="350" height="36" fill="#b8472e"/>
          <text x="175" y="24" class="mono" fill="#f5efe6" font-size="12" font-weight="700" text-anchor="middle">@mcp.tool</text>
          <text x="175" y="62" class="display-r" fill="#1f1a14" font-size="18" text-anchor="middle">Model-controlled</text>
          <text x="175" y="90" class="body" fill="#4a4239" font-size="13" font-style="italic" text-anchor="middle">LLM picks during reasoning</text>
          <text x="175" y="124" class="mono" fill="#1f1a14" font-size="11" text-anchor="middle">def add(a: int, b: int):</text>
          <text x="175" y="142" class="mono" fill="#1f1a14" font-size="11" text-anchor="middle">    """Add two numbers."""</text>
          <text x="175" y="160" class="mono" fill="#1f1a14" font-size="11" text-anchor="middle">    return a + b</text>
          <text x="175" y="186" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">USE FOR: actions</text>

          <rect x="365" y="0" width="350" height="200" fill="#ede5d6" stroke="#d4c9b5"/>
          <rect x="365" y="0" width="350" height="36" fill="#2a5d62"/>
          <text x="540" y="24" class="mono" fill="#f5efe6" font-size="12" font-weight="700" text-anchor="middle">@mcp.resource("uri")</text>
          <text x="540" y="62" class="display-r" fill="#1f1a14" font-size="18" text-anchor="middle">App-controlled</text>
          <text x="540" y="90" class="body" fill="#4a4239" font-size="13" font-style="italic" text-anchor="middle">Host attaches to context</text>
          <text x="540" y="124" class="mono" fill="#1f1a14" font-size="11" text-anchor="middle">@mcp.resource("foo://bar")</text>
          <text x="540" y="142" class="mono" fill="#1f1a14" font-size="11" text-anchor="middle">def fn() -&gt; str:</text>
          <text x="540" y="160" class="mono" fill="#1f1a14" font-size="11" text-anchor="middle">    return json.dumps(...)</text>
          <text x="540" y="186" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">USE FOR: docs / configs</text>

          <rect x="730" y="0" width="350" height="200" fill="#ede5d6" stroke="#d4c9b5"/>
          <rect x="730" y="0" width="350" height="36" fill="#c89b3c"/>
          <text x="905" y="24" class="mono" fill="#1f1a14" font-size="12" font-weight="700" text-anchor="middle">@mcp.prompt</text>
          <text x="905" y="62" class="display-r" fill="#1f1a14" font-size="18" text-anchor="middle">User-controlled</text>
          <text x="905" y="90" class="body" fill="#4a4239" font-size="13" font-style="italic" text-anchor="middle">User picks via slash command</text>
          <text x="905" y="124" class="mono" fill="#1f1a14" font-size="11" text-anchor="middle">def explain_topic(topic):</text>
          <text x="905" y="142" class="mono" fill="#1f1a14" font-size="11" text-anchor="middle">    return f"Explain {topic}..."</text>
          <text x="905" y="186" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">USE FOR: /slash-commands</text>
        </g>

        <text x="60" y="960" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§06 · TWO WAYS TO RUN — STDIO VS HTTP</text>

        <g transform="translate(60, 980)">
          <rect x="0" y="0" width="520" height="220" fill="#ede5d6" stroke="#d4c9b5"/>
          <text x="20" y="30" class="mono" fill="#2a5d62" font-size="12" font-weight="700">STDIO TRANSPORT (default)</text>
          <text x="20" y="58" class="body" fill="#4a4239" font-size="13" font-style="italic">Server is a subprocess of the client.</text>
          <text x="20" y="78" class="body" fill="#4a4239" font-size="13" font-style="italic">Local only. Cursor's default.</text>
          <text x="20" y="115" class="mono" fill="#1f1a14" font-size="11">$ python simple_client.py</text>
          <text x="20" y="140" class="mono" fill="#8b7d65" font-size="10">(client spawns server as child process,</text>
          <text x="20" y="155" class="mono" fill="#8b7d65" font-size="10"> talks over stdin/stdout pipes)</text>
          <text x="20" y="195" class="mono" fill="#2a5d62" font-size="10" font-weight="700">BEST FOR: personal IDE + local servers</text>

          <rect x="540" y="0" width="520" height="220" fill="#ede5d6" stroke="#d4c9b5"/>
          <text x="560" y="30" class="mono" fill="#b8472e" font-size="12" font-weight="700">STREAMABLE HTTP TRANSPORT</text>
          <text x="560" y="58" class="body" fill="#4a4239" font-size="13" font-style="italic">Server is a long-running service.</text>
          <text x="560" y="78" class="body" fill="#4a4239" font-size="13" font-style="italic">Remote / shared. Production-style.</text>
          <text x="560" y="115" class="mono" fill="#1f1a14" font-size="11">$ python simple_server.py --http</text>
          <text x="560" y="135" class="mono" fill="#1f1a14" font-size="11">$ export MCP_HTTP_URL=http://...</text>
          <text x="560" y="155" class="mono" fill="#1f1a14" font-size="11">$ python simple_client.py</text>
          <text x="560" y="195" class="mono" fill="#b8472e" font-size="10" font-weight="700">BEST FOR: shared / remote / production</text>
        </g>

        <g transform="translate(60, 1240)">
          <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">FIVE CORRECTIONS YOU SHOULD CARRY</text>
          <rect x="0" y="14" width="1080" height="190" fill="#f8e6cf" stroke="#b8472e" stroke-dasharray="4 3"/>
          <g transform="translate(20, 38)">
            <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" font-weight="700">1.</text>
            <text x="22" y="0" class="mono" fill="#1f1a14" font-size="12">It's FastMCP, NOT FastAPI. They're unrelated libraries.</text>
            <text x="0" y="28" class="mono" fill="#b8472e" font-size="11" font-weight="700">2.</text>
            <text x="22" y="28" class="mono" fill="#1f1a14" font-size="12">Resources must return TEXT or BYTES. json.dumps() any structured data first.</text>
            <text x="0" y="56" class="mono" fill="#b8472e" font-size="11" font-weight="700">3.</text>
            <text x="22" y="56" class="mono" fill="#1f1a14" font-size="12">Resources and prompts are NOT deprecated. Cursor + Claude Desktop use both heavily.</text>
            <text x="0" y="84" class="mono" fill="#b8472e" font-size="11" font-weight="700">4.</text>
            <text x="22" y="84" class="mono" fill="#1f1a14" font-size="12">"Calling an OpenSky MCP server" = calling OpenSky's REST API and wrapping the response.</text>
            <text x="0" y="112" class="mono" fill="#b8472e" font-size="11" font-weight="700">5.</text>
            <text x="22" y="112" class="mono" fill="#1f1a14" font-size="12">Python asyncio is CONCURRENT, not parallel. Single-threaded; yields on each await.</text>
            <text x="0" y="148" class="mono" fill="#8b7d65" font-size="10" font-style="italic">+ Tool inputs are LLM-generated. Validate at the tool boundary — MCP doesn't do that for you.</text>
          </g>
        </g>

        <text x="60" y="1480" class="mono" fill="#8b7d65" font-size="10" letter-spacing="2">MCP · LECTURE 02 · 2026-05-20</text>
        <text x="1140" y="1480" class="mono" fill="#8b7d65" font-size="10" letter-spacing="2" text-anchor="end">NEXT → LANGGRAPH MULTI-AGENT</text>
      </svg>
