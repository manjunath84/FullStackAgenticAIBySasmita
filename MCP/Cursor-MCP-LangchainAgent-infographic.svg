<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="igMCP1Title">
        <title id="igMCP1Title">MCP Lecture 1 — Agents, Tools, and what MCP is for</title>
        <defs>
          <style>
            .display { font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; }
            .display-r { font-family: 'Fraunces', serif; font-weight: 700; }
            .body { font-family: 'Spectral', serif; }
            .mono { font-family: 'JetBrains Mono', monospace; }
          </style>
          <marker id="igArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#b8472e"/>
          </marker>
        </defs>
        <rect width="1200" height="1500" fill="#f5efe6"/>

        <text x="60" y="80" class="mono" fill="#b8472e" font-size="13" letter-spacing="6" font-weight="700">MCP · LECTURE 01 · VISUAL SUMMARY</text>
        <text x="60" y="160" class="display" fill="#1f1a14" font-size="58">Agents, tools, and</text>
        <text x="60" y="218" class="display" fill="#b8472e" font-size="58">what MCP is for.</text>
        <line x1="60" y1="252" x2="1140" y2="252" stroke="#1f1a14" stroke-width="2"/>
        <text x="60" y="285" class="body" fill="#4a4239" font-size="18" font-style="italic">USB-C for LLM tools — one protocol, any host, any server.</text>

        <text x="60" y="340" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§01 · WHAT MAKES AN AGENT</text>
        <g transform="translate(60, 360)">
          <circle cx="540" cy="100" r="80" fill="#b8472e"/>
          <text x="540" y="95" class="display-r" fill="#f5efe6" font-size="22" text-anchor="middle">LLM</text>
          <text x="540" y="120" class="mono" fill="#f5efe6" font-size="10" text-anchor="middle">the brain</text>

          <rect x="100" y="40" width="200" height="60" fill="#c89b3c"/>
          <text x="200" y="62" class="mono" fill="#1f1a14" font-size="11" font-weight="700" text-anchor="middle">TOOLS</text>
          <text x="200" y="80" class="body" fill="#1f1a14" font-size="12" font-style="italic" text-anchor="middle">act on the world</text>

          <rect x="780" y="40" width="200" height="60" fill="#2a5d62"/>
          <text x="880" y="62" class="mono" fill="#f5efe6" font-size="11" font-weight="700" text-anchor="middle">MEMORY</text>
          <text x="880" y="80" class="body" fill="#f5efe6" font-size="12" font-style="italic" text-anchor="middle">persistent state</text>

          <rect x="100" y="140" width="200" height="60" fill="#5ba0a8"/>
          <text x="200" y="162" class="mono" fill="#1f1a14" font-size="11" font-weight="700" text-anchor="middle">PLANNING</text>
          <text x="200" y="180" class="body" fill="#1f1a14" font-size="12" font-style="italic" text-anchor="middle">multi-step reasoning</text>

          <rect x="780" y="140" width="200" height="60" fill="#6db33f"/>
          <text x="880" y="162" class="mono" fill="#1f1a14" font-size="11" font-weight="700" text-anchor="middle">PROMPT / PERSONA</text>
          <text x="880" y="180" class="body" fill="#1f1a14" font-size="12" font-style="italic" text-anchor="middle">role + instructions</text>

          <line x1="300" y1="70"  x2="460" y2="100" stroke="#1f1a14" stroke-width="1"/>
          <line x1="780" y1="70"  x2="620" y2="100" stroke="#1f1a14" stroke-width="1"/>
          <line x1="300" y1="170" x2="460" y2="110" stroke="#1f1a14" stroke-width="1"/>
          <line x1="780" y1="170" x2="620" y2="110" stroke="#1f1a14" stroke-width="1"/>
        </g>

        <text x="60" y="640" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§03-04 · WHY MCP — TOOL CHAOS VS ORGANISED CATALOGUE</text>

        <g transform="translate(60, 660)">
          <rect x="0" y="0" width="540" height="240" fill="#f8e6cf" stroke="#b8472e" stroke-dasharray="4 3"/>
          <text x="20" y="30" class="mono" fill="#b8472e" font-size="12" font-weight="700">BEFORE MCP — 3,000 TOOLS IN A LIST</text>
          <text x="20" y="60" class="body" fill="#1f1a14" font-size="14" font-style="italic">tools=[multiply, word_count, search,</text>
          <text x="20" y="78" class="body" fill="#1f1a14" font-size="14" font-style="italic">       send_email, query_db, push_git, …]</text>
          <text x="20" y="120" class="mono" fill="#b8472e" font-size="10" font-weight="700">CONTEXT ROT</text>
          <text x="20" y="138" class="mono" fill="#1f1a14" font-size="11">600,000 tokens of docstrings before</text>
          <text x="20" y="154" class="mono" fill="#1f1a14" font-size="11">the user even types a message</text>
          <text x="20" y="180" class="mono" fill="#b8472e" font-size="10" font-weight="700">TOOL AMBIGUITY</text>
          <text x="20" y="198" class="mono" fill="#1f1a14" font-size="11">similar descriptions → wrong tool picked</text>
          <text x="20" y="220" class="mono" fill="#b8472e" font-size="10" font-weight="700">DUPLICATION</text>
          <text x="20" y="237" class="mono" fill="#1f1a14" font-size="11">50 teams re-implement search_web()</text>

          <rect x="560" y="0" width="540" height="240" fill="#ede5d6" stroke="#2a5d62"/>
          <text x="580" y="30" class="mono" fill="#2a5d62" font-size="12" font-weight="700">AFTER MCP — TOOLS IN SERVERS</text>
          <text x="580" y="60" class="body" fill="#1f1a14" font-size="14" font-style="italic">Cursor loads only what this task needs:</text>
          <rect x="580" y="80" width="160" height="32" fill="#2a5d62"/>
          <text x="660" y="100" class="mono" fill="#f5efe6" font-size="11" font-weight="700" text-anchor="middle">GitHub MCP</text>
          <rect x="750" y="80" width="160" height="32" fill="#5ba0a8"/>
          <text x="830" y="100" class="mono" fill="#1f1a14" font-size="11" font-weight="700" text-anchor="middle">Tavily MCP</text>
          <rect x="920" y="80" width="160" height="32" fill="#c89b3c"/>
          <text x="1000" y="100" class="mono" fill="#1f1a14" font-size="11" font-weight="700" text-anchor="middle">your MCP</text>

          <text x="580" y="140" class="mono" fill="#2a5d62" font-size="10" font-weight="700">SCOPED CONTEXT</text>
          <text x="580" y="158" class="mono" fill="#1f1a14" font-size="11">only the relevant servers' tools loaded</text>
          <text x="580" y="180" class="mono" fill="#2a5d62" font-size="10" font-weight="700">ONE CANONICAL IMPL.</text>
          <text x="580" y="198" class="mono" fill="#1f1a14" font-size="11">one GitHub server, used by everyone</text>
          <text x="580" y="220" class="mono" fill="#2a5d62" font-size="10" font-weight="700">STANDARD WIRE</text>
          <text x="580" y="237" class="mono" fill="#1f1a14" font-size="11">JSON-RPC over stdio or HTTP</text>
        </g>

        <text x="60" y="960" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">§04 · THREE PRIMITIVES — WHO INITIATES THE CALL</text>

        <g transform="translate(60, 980)">
          <rect x="0" y="0" width="350" height="220" fill="#ede5d6" stroke="#d4c9b5"/>
          <rect x="0" y="0" width="350" height="40" fill="#b8472e"/>
          <text x="175" y="26" class="mono" fill="#f5efe6" font-size="12" font-weight="700" text-anchor="middle">TOOL</text>
          <text x="175" y="68" class="display-r" fill="#1f1a14" font-size="20" text-anchor="middle">Model-controlled</text>
          <text x="175" y="98" class="body" fill="#4a4239" font-size="13" font-style="italic" text-anchor="middle">LLM picks during reasoning</text>
          <text x="175" y="132" class="mono" fill="#1f1a14" font-size="11" text-anchor="middle">@mcp.tool</text>
          <text x="175" y="170" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">search_web(query)</text>
          <text x="175" y="186" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">create_issue(title, body)</text>
          <text x="175" y="202" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">run_sql(query)</text>

          <rect x="370" y="0" width="350" height="220" fill="#ede5d6" stroke="#d4c9b5"/>
          <rect x="370" y="0" width="350" height="40" fill="#2a5d62"/>
          <text x="545" y="26" class="mono" fill="#f5efe6" font-size="12" font-weight="700" text-anchor="middle">RESOURCE</text>
          <text x="545" y="68" class="display-r" fill="#1f1a14" font-size="20" text-anchor="middle">App-controlled</text>
          <text x="545" y="98" class="body" fill="#4a4239" font-size="13" font-style="italic" text-anchor="middle">Host attaches to context</text>
          <text x="545" y="132" class="mono" fill="#1f1a14" font-size="11" text-anchor="middle">@mcp.resource("uri")</text>
          <text x="545" y="170" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">resource://docs/arch.md</text>
          <text x="545" y="186" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">file attachments</text>
          <text x="545" y="202" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">config snapshots</text>

          <rect x="740" y="0" width="350" height="220" fill="#ede5d6" stroke="#d4c9b5"/>
          <rect x="740" y="0" width="350" height="40" fill="#c89b3c"/>
          <text x="915" y="26" class="mono" fill="#1f1a14" font-size="12" font-weight="700" text-anchor="middle">PROMPT</text>
          <text x="915" y="68" class="display-r" fill="#1f1a14" font-size="20" text-anchor="middle">User-controlled</text>
          <text x="915" y="98" class="body" fill="#4a4239" font-size="13" font-style="italic" text-anchor="middle">User picks via slash command</text>
          <text x="915" y="132" class="mono" fill="#1f1a14" font-size="11" text-anchor="middle">@mcp.prompt</text>
          <text x="915" y="170" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">/explain-topic</text>
          <text x="915" y="186" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">/summarise-meeting</text>
          <text x="915" y="202" class="mono" fill="#8b7d65" font-size="10" text-anchor="middle">/refactor-this</text>
        </g>

        <g transform="translate(60, 1240)">
          <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" letter-spacing="3" font-weight="700">FIVE CORRECTIONS YOU SHOULD CARRY</text>
          <rect x="0" y="14" width="1080" height="190" fill="#f8e6cf" stroke="#b8472e" stroke-dasharray="4 3"/>
          <g transform="translate(20, 38)">
            <text x="0" y="0" class="mono" fill="#b8472e" font-size="11" font-weight="700">1.</text>
            <text x="22" y="0" class="mono" fill="#1f1a14" font-size="12">MCP is application-layer (L7), not TCP-layer. JSON-RPC over stdio or streamable HTTP.</text>
            <text x="0" y="28" class="mono" fill="#b8472e" font-size="11" font-weight="700">2.</text>
            <text x="22" y="28" class="mono" fill="#1f1a14" font-size="12">Cursor is the HOST. Inside it are multiple CLIENTS (one per server). Don't conflate.</text>
            <text x="0" y="56" class="mono" fill="#b8472e" font-size="11" font-weight="700">3.</text>
            <text x="22" y="56" class="mono" fill="#1f1a14" font-size="12">Three primitives: model-controlled (tool) / app-controlled (resource) / user-controlled (prompt). All discoverable.</text>
            <text x="0" y="84" class="mono" fill="#b8472e" font-size="11" font-weight="700">4.</text>
            <text x="22" y="84" class="mono" fill="#1f1a14" font-size="12">Anthropic released MCP Nov 2024. OpenAI + Google adopted in 2025. It's the standard now.</text>
            <text x="0" y="112" class="mono" fill="#b8472e" font-size="11" font-weight="700">5.</text>
            <text x="22" y="112" class="mono" fill="#1f1a14" font-size="12">It's "Tavily" (tavily.com), not "Travely" (AssemblyAI transcription error).</text>
            <text x="0" y="148" class="mono" fill="#8b7d65" font-size="10" font-style="italic">+ Resources and prompts are NOT deprecated — Cursor and Claude Desktop use both heavily.</text>
          </g>
        </g>

        <text x="60" y="1480" class="mono" fill="#8b7d65" font-size="10" letter-spacing="2">MCP · LECTURE 01 · 2026-05-20</text>
        <text x="1140" y="1480" class="mono" fill="#8b7d65" font-size="10" letter-spacing="2" text-anchor="end">NEXT → LECTURE 02: BUILD YOUR OWN SERVER</text>
      </svg>
