<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2400" font-family="'Spectral', 'Iowan Old Style', Georgia, serif">
<defs>
<style>
.paper { fill: #f5efe6; }
.paper-2 { fill: #ede5d6; }
.ink { fill: #1f1a14; }
.ink-soft { fill: #4a4239; }
.ink-mute { fill: #8b7d65; }
.terracotta { fill: #b8472e; }
.terracotta-light { fill: #d96d4a; }
.teal { fill: #2a5d62; }
.teal-light { fill: #5ba0a8; }
.ochre { fill: #c89b3c; }
.highlight { fill: #f8e6cf; }
.line { stroke: #d4c9b5; }
.mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
.display { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; }
</style>
<pattern id="dots17" patternUnits="userSpaceOnUse" width="100" height="100">
  <circle cx="20" cy="30" r="0.6" fill="#1f1a14" opacity="0.06"/>
  <circle cx="70" cy="80" r="0.5" fill="#1f1a14" opacity="0.04"/>
</pattern>
<marker id="arrow17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#1f1a14"/>
</marker>
<marker id="arrow17-tc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#b8472e"/>
</marker>
<marker id="arrow17-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#2a5d62"/>
</marker>
</defs>

<rect width="1100" height="2400" class="paper"/>
<rect width="1100" height="2400" fill="url(#dots17)"/>

<!-- HEADER -->
<text x="60" y="80" class="mono terracotta" font-size="13" font-weight="700" letter-spacing="6">SESSION 17 · GRAPHRAG PART 3</text>
<text x="60" y="170" class="display ink" font-size="78" font-weight="700" letter-spacing="-1">The retrieval</text>
<text x="60" y="250" class="display terracotta" font-size="78" font-weight="700" letter-spacing="-1">half.</text>
<line x1="60" y1="280" x2="1040" y2="280" stroke="#1f1a14" stroke-width="2"/>
<text x="60" y="320" class="ink-soft display" font-size="22">Question → entities → fuzzy graph match + vector search → answer.</text>
<text x="60" y="365" class="mono ink-mute" font-size="11" letter-spacing="2">NEO4J 5 · LANGCHAIN-NEO4J · LUCENE ~2 · LCEL · 4 DEMO QUESTIONS PASS</text>

<!-- THE PROBLEM -->
<g transform="translate(60, 420)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE PROBLEM</text>
  <text y="32" class="display ink" font-size="32" font-weight="700">A single retrieval channel sees half the picture.</text>
  <g transform="translate(0, 80)">
    <rect x="0" y="0" width="470" height="135" class="paper-2" stroke="#d4c9b5"/>
    <text x="20" y="32" class="mono ink-mute" font-size="11" letter-spacing="2">VECTOR ONLY</text>
    <text x="20" y="62" class="ink" font-size="16">Robust to paraphrase.</text>
    <text x="20" y="86" class="ink" font-size="16">Blind to multi-hop links.</text>
    <text x="20" y="116" class="mono terracotta" font-size="13">"is B-4421 quarantined?" → chunk found.</text>

    <rect x="510" y="0" width="470" height="135" class="paper-2" stroke="#d4c9b5"/>
    <text x="530" y="32" class="mono ink-mute" font-size="11" letter-spacing="2">GRAPH ONLY</text>
    <text x="530" y="62" class="ink" font-size="16">Nails relational structure.</text>
    <text x="530" y="86" class="ink" font-size="16">Misses prose-buried rules.</text>
    <text x="530" y="116" class="mono terracotta" font-size="13">"3 pre-release conditions?" → triples ≠ prose.</text>
  </g>
  <text y="260" class="ink-soft" font-size="17" font-style="italic">Run both. The failures don't overlap.</text>
</g>

<!-- TWO INDEXES -->
<g transform="translate(60, 760)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">TWO INDEXES, TWO JOBS</text>
  <text y="32" class="display ink" font-size="30" font-weight="700">One Neo4j database. Two completely different lookups.</text>

  <g transform="translate(0, 80)">
    <rect width="470" height="200" fill="#ede5d6" stroke="#d4c9b5"/>
    <text x="20" y="32" class="mono teal" font-size="11" letter-spacing="2" font-weight="700">VECTOR INDEX  ·  built Session 16</text>
    <text x="20" y="62" class="display ink" font-size="20" font-weight="600">graphrag_classnote_vector</text>
    <text x="20" y="92" class="ink-soft" font-size="14">on :Document.embedding</text>
    <text x="20" y="115" class="ink-soft" font-size="14">1536-d, text-embedding-3-small</text>
    <text x="20" y="148" class="mono ink-mute" font-size="11" letter-spacing="1">QUERIED BY</text>
    <text x="20" y="168" class="mono ink" font-size="13">vector_index.similarity_search(q)</text>
    <text x="20" y="188" class="mono ink-mute" font-size="12">↳ default k = 4 chunks</text>
  </g>

  <g transform="translate(510, 80)">
    <rect width="470" height="200" fill="#ede5d6" stroke="#d4c9b5"/>
    <text x="20" y="32" class="mono terracotta" font-size="11" letter-spacing="2" font-weight="700">FULLTEXT INDEX  ·  built Session 17</text>
    <text x="20" y="62" class="display ink" font-size="20" font-weight="600">entity</text>
    <text x="20" y="92" class="ink-soft" font-size="14">on :__Entity__.id</text>
    <text x="20" y="115" class="ink-soft" font-size="14">Lucene-backed string index</text>
    <text x="20" y="148" class="mono ink-mute" font-size="11" letter-spacing="1">QUERIED BY</text>
    <text x="20" y="168" class="mono ink" font-size="13">db.index.fulltext.queryNodes(...)</text>
    <text x="20" y="188" class="mono ink-mute" font-size="12">↳ fuzzy via term~2</text>
  </g>

  <g transform="translate(0, 300)">
    <rect width="980" height="60" fill="#f8e6cf" stroke="#c89b3c" stroke-opacity="0.4"/>
    <text x="20" y="25" class="mono ochre" font-size="11" letter-spacing="2" font-weight="700">WHY __ENTITY__</text>
    <text x="20" y="48" class="ink" font-size="14">Session 16's <tspan class="mono">baseEntityLabel=True</tspan> attached the uniform <tspan class="mono">:__Entity__</tspan> label to every extracted node — one anchor to put the fulltext index on.</text>
  </g>
</g>

<!-- THE PIPELINE -->
<g transform="translate(60, 1180)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE FIVE-STEP RETRIEVAL</text>
  <text y="32" class="display ink" font-size="30" font-weight="700">From question to answer, both channels firing.</text>

  <!-- box: question -->
  <g transform="translate(380, 80)">
    <rect width="220" height="50" fill="#1f1a14"/>
    <text x="110" y="32" class="mono paper" font-size="13" text-anchor="middle" font-weight="700">USER QUESTION</text>
  </g>
  <line x1="490" y1="130" x2="490" y2="155" stroke="#1f1a14" stroke-width="2" marker-end="url(#arrow17)"/>

  <!-- split -->
  <line x1="490" y1="160" x2="160" y2="200" stroke="#b8472e" stroke-width="1.5" marker-end="url(#arrow17-tc)"/>
  <line x1="490" y1="160" x2="820" y2="200" stroke="#2a5d62" stroke-width="1.5" marker-end="url(#arrow17-teal)"/>

  <!-- LEFT CHANNEL: graph -->
  <g transform="translate(60, 210)">
    <rect width="380" height="80" fill="#ede5d6" stroke="#b8472e" stroke-width="2"/>
    <text x="20" y="28" class="mono terracotta" font-size="11" letter-spacing="2" font-weight="700">STEP 1 · ENTITY EXTRACTION</text>
    <text x="20" y="52" class="ink" font-size="14">entity_chain.invoke({"question": q})</text>
    <text x="20" y="72" class="mono ink-mute" font-size="12">→ Entities(names=["B-4421", "NordicCare", ...])</text>
  </g>
  <line x1="250" y1="290" x2="250" y2="315" stroke="#b8472e" stroke-width="1.5" marker-end="url(#arrow17-tc)"/>

  <g transform="translate(60, 320)">
    <rect width="380" height="100" fill="#ede5d6" stroke="#b8472e" stroke-width="2"/>
    <text x="20" y="28" class="mono terracotta" font-size="11" letter-spacing="2" font-weight="700">STEP 2 · LUCENE FUZZY QUERY</text>
    <text x="20" y="52" class="ink" font-size="14">generate_full_text_query(entity)</text>
    <text x="20" y="74" class="mono ink-mute" font-size="12">"MedFreze" → "MedFreze~2"</text>
    <text x="20" y="92" class="mono ink-mute" font-size="12">≤ 2 Damerau-Levenshtein edits</text>
  </g>
  <line x1="250" y1="420" x2="250" y2="445" stroke="#b8472e" stroke-width="1.5" marker-end="url(#arrow17-tc)"/>

  <g transform="translate(60, 450)">
    <rect width="380" height="120" fill="#ede5d6" stroke="#b8472e" stroke-width="2"/>
    <text x="20" y="28" class="mono terracotta" font-size="11" letter-spacing="2" font-weight="700">STEP 3 · GRAPH TRAVERSAL</text>
    <text x="20" y="52" class="mono ink" font-size="12">CALL db.index.fulltext.queryNodes(</text>
    <text x="20" y="70" class="mono ink" font-size="12">    'entity', $query, {limit:2})</text>
    <text x="20" y="92" class="mono ink" font-size="12">MATCH (node)-[r:!MENTIONS]->(neighbor)</text>
    <text x="20" y="110" class="mono ink-mute" font-size="11">UNION ALL incoming · LIMIT 50</text>
  </g>
  <line x1="250" y1="570" x2="250" y2="595" stroke="#b8472e" stroke-width="1.5" marker-end="url(#arrow17-tc)"/>

  <g transform="translate(60, 600)">
    <rect width="380" height="80" fill="#ede5d6" stroke="#b8472e" stroke-width="2"/>
    <text x="20" y="28" class="mono terracotta" font-size="11" letter-spacing="2" font-weight="700">STRUCTURED DATA</text>
    <text x="20" y="52" class="mono ink" font-size="12">B-4421 - PART_OF -> MF-Insulin-Pro</text>
    <text x="20" y="68" class="mono ink" font-size="12">NordicCare - QUARANTINED -> B-4421</text>
  </g>

  <!-- RIGHT CHANNEL: vector -->
  <g transform="translate(660, 210)">
    <rect width="380" height="80" fill="#ede5d6" stroke="#2a5d62" stroke-width="2"/>
    <text x="20" y="28" class="mono teal" font-size="11" letter-spacing="2" font-weight="700">STEP A · EMBED QUESTION</text>
    <text x="20" y="52" class="ink" font-size="14">OpenAIEmbeddings (1536-d)</text>
    <text x="20" y="72" class="mono ink-mute" font-size="12">happens inside similarity_search</text>
  </g>
  <line x1="850" y1="290" x2="850" y2="315" stroke="#2a5d62" stroke-width="1.5" marker-end="url(#arrow17-teal)"/>

  <g transform="translate(660, 320)">
    <rect width="380" height="100" fill="#ede5d6" stroke="#2a5d62" stroke-width="2"/>
    <text x="20" y="28" class="mono teal" font-size="11" letter-spacing="2" font-weight="700">STEP B · COSINE MATCH</text>
    <text x="20" y="52" class="ink" font-size="14">vector_index.similarity_search(q)</text>
    <text x="20" y="74" class="mono ink-mute" font-size="12">on :Document.embedding</text>
    <text x="20" y="92" class="mono ink-mute" font-size="12">top k = 4 (default)</text>
  </g>
  <line x1="850" y1="420" x2="850" y2="445" stroke="#2a5d62" stroke-width="1.5" marker-end="url(#arrow17-teal)"/>

  <g transform="translate(660, 450)">
    <rect width="380" height="120" fill="#ede5d6" stroke="#2a5d62" stroke-width="2"/>
    <text x="20" y="28" class="mono teal" font-size="11" letter-spacing="2" font-weight="700">STEP C · RETURN CHUNKS</text>
    <text x="20" y="52" class="mono ink" font-size="12">[doc.page_content for doc in hits]</text>
    <text x="20" y="76" class="ink" font-size="13">Raw policy prose containing the</text>
    <text x="20" y="94" class="ink" font-size="13">3 pre-release conditions (a/b/c).</text>
  </g>
  <line x1="850" y1="570" x2="850" y2="595" stroke="#2a5d62" stroke-width="1.5" marker-end="url(#arrow17-teal)"/>

  <g transform="translate(660, 600)">
    <rect width="380" height="80" fill="#ede5d6" stroke="#2a5d62" stroke-width="2"/>
    <text x="20" y="28" class="mono teal" font-size="11" letter-spacing="2" font-weight="700">UNSTRUCTURED DATA</text>
    <text x="20" y="52" class="mono ink" font-size="12">--- doc chunk ---</text>
    <text x="20" y="68" class="mono ink" font-size="12">"NordicCare may PRE-RELEASE if..."</text>
  </g>

  <!-- merge arrows -->
  <line x1="250" y1="680" x2="490" y2="720" stroke="#1f1a14" stroke-width="2" marker-end="url(#arrow17)"/>
  <line x1="850" y1="680" x2="610" y2="720" stroke="#1f1a14" stroke-width="2" marker-end="url(#arrow17)"/>

  <!-- merged context -->
  <g transform="translate(360, 730)">
    <rect width="380" height="60" fill="#f8e6cf" stroke="#c89b3c" stroke-width="2"/>
    <text x="190" y="25" class="mono ochre" font-size="11" letter-spacing="2" font-weight="700" text-anchor="middle">MERGED CONTEXT STRING</text>
    <text x="190" y="46" class="ink" font-size="14" text-anchor="middle">"Structured data:\n…\nUnstructured data:\n…"</text>
  </g>
  <line x1="550" y1="790" x2="550" y2="815" stroke="#1f1a14" stroke-width="2" marker-end="url(#arrow17)"/>

  <g transform="translate(360, 820)">
    <rect width="380" height="60" fill="#1f1a14"/>
    <text x="190" y="25" class="mono paper" font-size="11" letter-spacing="2" font-weight="700" text-anchor="middle">qa_prompt · chat · StrOutputParser</text>
    <text x="190" y="48" class="mono terracotta" font-size="13" text-anchor="middle">↓ answer</text>
  </g>
</g>

<!-- LUCENE FUZZY DETAIL -->
<g transform="translate(60, 2110)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">FUZZY MATCH · LUCENE ~2</text>
  <text y="32" class="display ink" font-size="30" font-weight="700">"~2" means at most 2 edit operations.</text>

  <g transform="translate(0, 60)">
    <rect width="980" height="90" fill="#ede5d6" stroke="#d4c9b5"/>
    <text x="20" y="32" class="mono ink-mute" font-size="11" letter-spacing="2">DAMERAU-LEVENSHTEIN  ·  insert · delete · substitute · transpose</text>
    <text x="20" y="60" class="mono ink" font-size="14">MedFreze~2  →  MedFridge  ✓  (insert i, delete e = 2 edits)</text>
    <text x="20" y="80" class="mono ink" font-size="14">Nodi~2      →  NordicCare ✗  (distance > 2 across full term)</text>
  </g>
</g>

<!-- FOOTER -->
<line x1="60" y1="2320" x2="1040" y2="2320" stroke="#1f1a14" stroke-width="2"/>
<text x="60" y="2350" class="mono ink-mute" font-size="11" letter-spacing="2">SOURCES · APACHE LUCENE QUERYPARSER · NEO4J FULLTEXT INDEX · LANGCHAIN-NEO4J · LCEL</text>
<text x="60" y="2376" class="mono terracotta" font-size="11" letter-spacing="2" font-weight="700">SESSION 17 · 2026-05-06 · 63.5 MIN</text>
</svg>
