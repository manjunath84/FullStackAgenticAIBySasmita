<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2500" font-family="'Spectral', 'Iowan Old Style', Georgia, serif">
<defs>
<style>
.paper { fill: #f5efe6; }
.paper-2 { fill: #ede5d6; }
.ink { fill: #1f1a14; }
.ink-soft { fill: #4a4239; }
.ink-mute { fill: #8b7d65; }
.terracotta { fill: #b8472e; }
.terracotta-light { fill: #d96d4a; }
.teal { fill: #2a5d62; }
.teal-soft { fill: #5ba0a8; }
.ochre { fill: #c89b3c; }
.highlight { fill: #f8e6cf; }
.spring { fill: #6db33f; }
.mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
.display { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; }
</style>
<pattern id="dots10" patternUnits="userSpaceOnUse" width="100" height="100">
<circle cx="20" cy="30" r="0.6" fill="#1f1a14" opacity="0.06"/>
<circle cx="70" cy="80" r="0.5" fill="#1f1a14" opacity="0.04"/>
</pattern>
</defs>

<rect width="1100" height="2500" class="paper"/>
<rect width="1100" height="2500" fill="url(#dots10)"/>

<!-- HEADER -->
<text x="60" y="80" class="mono terracotta" font-size="13" font-weight="700" letter-spacing="6">SESSION 10 · TRANSFORMER DECODER</text>
<text x="60" y="170" class="display ink" font-size="80" font-weight="700" letter-spacing="-1">The Decoder,</text>
<text x="60" y="250" class="display terracotta" font-size="80" font-weight="700" letter-spacing="-1">End-to-End.</text>
<line x1="60" y1="280" x2="1040" y2="280" stroke="#1f1a14" stroke-width="2"/>
<text x="60" y="320" class="ink-soft display" font-size="22">Masked self-attention. Cross-attention. One token at a time. Stop at &lt;end&gt;.</text>
<text x="60" y="365" class="mono ink-mute" font-size="11" letter-spacing="2">VASWANI ET AL. 2017 · §3.1–3.2.3  ·  N = 6 decoder layers  ·  I love AI → j'aime l'IA</text>

<!-- TWO FIXES BANNER -->
<g transform="translate(60, 420)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">TWO BIG FIXES UP FRONT</text>
  <rect x="0" y="20" width="480" height="120" fill="rgba(184, 71, 46, 0.08)" stroke="#b8472e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="20" y="50" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">"ADD &amp; NORM = CONCAT"</text>
  <text x="20" y="80" class="ink" font-size="15">Wrong. It's <tspan font-weight="700">residual addition + LayerNorm</tspan>.</text>
  <text x="20" y="104" class="ink" font-size="15">Vector shape stays at <tspan class="mono" font-weight="700">d_model = 512</tspan> end-to-end.</text>
  <text x="20" y="126" class="ink-soft" font-size="13">Nothing concatenated; nothing grows.</text>

  <rect x="500" y="20" width="480" height="120" fill="rgba(184, 71, 46, 0.08)" stroke="#b8472e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="520" y="50" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">"LINEAR = ACTIVATION FN"</text>
  <text x="520" y="80" class="ink" font-size="15">Wrong. Linear is a <tspan font-weight="700">learned matrix mult</tspan>.</text>
  <text x="520" y="104" class="ink" font-size="15"><tspan class="mono">output = W·x + b</tspan> · has parameters.</text>
  <text x="520" y="126" class="ink-soft" font-size="13">Softmax is the activation. Different things.</text>
</g>

<!-- DECODER BLOCK -->
<g transform="translate(60, 600)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE DECODER BLOCK · 3 SUBLAYERS, EACH WRAPPED IN ADD &amp; NORM</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">One more sublayer than the encoder.</text>

  <g transform="translate(0, 60)">
    <!-- Sublayer 1 -->
    <rect x="0" y="0" width="980" height="68" fill="#b8472e"/>
    <text x="20" y="32" class="mono" fill="#f8e6cf" font-size="11" letter-spacing="3">SUBLAYER 1</text>
    <text x="20" y="55" class="display" fill="#f5efe6" font-size="22" font-weight="700">Masked Multi-Head Self-Attention</text>
    <text x="600" y="40" class="mono" fill="#f8e6cf" font-size="12">causal mask · pos i sees 0…i only</text>
    <!-- Add & Norm -->
    <rect x="0" y="68" width="980" height="32" fill="#1f1a14"/>
    <text x="20" y="89" class="mono" fill="#8b7d65" font-size="11" letter-spacing="3">ADD &amp; NORM</text>
    <text x="600" y="89" class="mono" fill="#5ba0a8" font-size="11">residual + LayerNorm · shape preserved</text>

    <!-- Sublayer 2 -->
    <rect x="0" y="108" width="980" height="68" fill="#2a5d62"/>
    <text x="20" y="140" class="mono" fill="#5ba0a8" font-size="11" letter-spacing="3">SUBLAYER 2 · NEW VS ENCODER</text>
    <text x="20" y="163" class="display" fill="#f5efe6" font-size="22" font-weight="700">Cross-Attention</text>
    <text x="600" y="148" class="mono" fill="#5ba0a8" font-size="12">Q from decoder · K, V from encoder</text>
    <!-- Add & Norm -->
    <rect x="0" y="176" width="980" height="32" fill="#1f1a14"/>
    <text x="20" y="197" class="mono" fill="#8b7d65" font-size="11" letter-spacing="3">ADD &amp; NORM</text>
    <text x="600" y="197" class="mono" fill="#5ba0a8" font-size="11">residual + LayerNorm</text>

    <!-- Sublayer 3 -->
    <rect x="0" y="216" width="980" height="68" fill="#c89b3c"/>
    <text x="20" y="248" class="mono ink" font-size="11" letter-spacing="3">SUBLAYER 3</text>
    <text x="20" y="271" class="display ink" font-size="22" font-weight="700">Feed-Forward Network</text>
    <text x="600" y="256" class="mono ink" font-size="12">two linear + ReLU · position-wise</text>
    <!-- Add & Norm -->
    <rect x="0" y="284" width="980" height="32" fill="#1f1a14"/>
    <text x="20" y="305" class="mono" fill="#8b7d65" font-size="11" letter-spacing="3">ADD &amp; NORM</text>
    <text x="600" y="305" class="mono" fill="#5ba0a8" font-size="11">× N = 6 stacked decoder layers</text>
  </g>
</g>

<!-- CAUSAL MASK -->
<g transform="translate(60, 1010)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">HOW THE CAUSAL MASK WORKS</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">Set future entries to −∞ before softmax.</text>

  <!-- Three matrices -->
  <g transform="translate(0, 60)" font-size="13">
    <!-- raw -->
    <text x="120" y="-6" text-anchor="middle" class="mono ink-mute" font-size="11" letter-spacing="2">RAW SCORES</text>
    <rect x="0" y="0" width="240" height="180" fill="none" stroke="#d4c9b5" stroke-width="1"/>
    <g class="mono ink">
      <text x="20" y="40">a₀₀</text><text x="80" y="40">a₀₁</text><text x="140" y="40">a₀₂</text><text x="200" y="40">a₀₃</text>
      <text x="20" y="80">a₁₀</text><text x="80" y="80">a₁₁</text><text x="140" y="80">a₁₂</text><text x="200" y="80">a₁₃</text>
      <text x="20" y="120">a₂₀</text><text x="80" y="120">a₂₁</text><text x="140" y="120">a₂₂</text><text x="200" y="120">a₂₃</text>
      <text x="20" y="160">a₃₀</text><text x="80" y="160">a₃₁</text><text x="140" y="160">a₃₂</text><text x="200" y="160">a₃₃</text>
    </g>

    <text x="265" y="92" class="display ink" font-size="32">→</text>

    <!-- masked -->
    <text x="430" y="-6" text-anchor="middle" class="mono terracotta" font-size="11" letter-spacing="2">CAUSAL MASK · −∞ ABOVE DIAGONAL</text>
    <rect x="310" y="0" width="240" height="180" fill="none" stroke="#b8472e" stroke-width="1" stroke-dasharray="3,2"/>
    <g class="mono">
      <text x="330" y="40" class="ink">a₀₀</text><text x="390" y="40" class="terracotta">−∞</text><text x="450" y="40" class="terracotta">−∞</text><text x="510" y="40" class="terracotta">−∞</text>
      <text x="330" y="80" class="ink">a₁₀</text><text x="390" y="80" class="ink">a₁₁</text><text x="450" y="80" class="terracotta">−∞</text><text x="510" y="80" class="terracotta">−∞</text>
      <text x="330" y="120" class="ink">a₂₀</text><text x="390" y="120" class="ink">a₂₁</text><text x="450" y="120" class="ink">a₂₂</text><text x="510" y="120" class="terracotta">−∞</text>
      <text x="330" y="160" class="ink">a₃₀</text><text x="390" y="160" class="ink">a₃₁</text><text x="450" y="160" class="ink">a₃₂</text><text x="510" y="160" class="ink">a₃₃</text>
    </g>

    <text x="575" y="92" class="display ink" font-size="32">→</text>

    <!-- softmax -->
    <text x="740" y="-6" text-anchor="middle" class="mono teal" font-size="11" letter-spacing="2">AFTER SOFTMAX · ROW SUMS = 1</text>
    <rect x="620" y="0" width="240" height="180" fill="rgba(42, 93, 98, 0.08)" stroke="#2a5d62" stroke-width="1"/>
    <g class="mono">
      <text x="640" y="40" class="teal" font-weight="700">1.00</text><text x="710" y="40" class="ink-mute">0</text><text x="770" y="40" class="ink-mute">0</text><text x="830" y="40" class="ink-mute">0</text>
      <text x="640" y="80" class="teal" font-weight="700">0.40</text><text x="700" y="80" class="teal" font-weight="700">0.60</text><text x="770" y="80" class="ink-mute">0</text><text x="830" y="80" class="ink-mute">0</text>
      <text x="640" y="120" class="teal" font-weight="700">0.18</text><text x="700" y="120" class="teal" font-weight="700">0.42</text><text x="760" y="120" class="teal" font-weight="700">0.40</text><text x="830" y="120" class="ink-mute">0</text>
      <text x="640" y="160" class="teal" font-weight="700">0.12</text><text x="700" y="160" class="teal" font-weight="700">0.28</text><text x="760" y="160" class="teal" font-weight="700">0.30</text><text x="820" y="160" class="teal" font-weight="700">0.30</text>
    </g>
  </g>
  <text x="60" y="280" class="ink-soft" font-size="14">Each row still sums to 1, but only lower-triangular entries are nonzero. <tspan font-weight="700">Future tokens are invisible.</tspan></text>
</g>

<!-- CROSS-ATTN -->
<g transform="translate(60, 1340)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">CROSS-ATTENTION · Q FROM DECODER, K/V FROM ENCODER</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">The decoder's hook into the encoder.</text>

  <g transform="translate(0, 60)">
    <!-- Encoder side -->
    <rect x="0" y="0" width="380" height="160" fill="#2a5d62"/>
    <text x="20" y="32" class="mono" fill="#5ba0a8" font-size="11" letter-spacing="3">ENCODER (RUNS ONCE)</text>
    <text x="20" y="68" class="display" fill="#f5efe6" font-size="22" font-weight="700">"I love AI"</text>
    <text x="20" y="100" class="mono" fill="#f5efe6" font-size="14">→ K_enc, V_enc</text>
    <text x="20" y="130" class="mono" fill="#5ba0a8" font-size="11">cached · reused every decoder step</text>

    <!-- Arrow -->
    <text x="400" y="92" class="display ink" font-size="40">→</text>

    <!-- Cross-attn box -->
    <rect x="450" y="0" width="280" height="160" fill="#1f1a14"/>
    <text x="590" y="38" text-anchor="middle" class="mono" fill="#5ba0a8" font-size="10" letter-spacing="2">CROSS-ATTENTION</text>
    <text x="590" y="80" text-anchor="middle" class="mono" fill="#c89b3c" font-size="16">softmax(</text>
    <text x="590" y="105" text-anchor="middle" class="mono" fill="#c89b3c" font-size="16">Q_dec · K_encᵀ / √d_k</text>
    <text x="590" y="130" text-anchor="middle" class="mono" fill="#c89b3c" font-size="16">) · V_enc</text>

    <!-- Arrow -->
    <text x="745" y="92" class="display ink" font-size="40">←</text>

    <!-- Decoder side -->
    <rect x="800" y="0" width="180" height="160" fill="#b8472e"/>
    <text x="820" y="32" class="mono" fill="#f8e6cf" font-size="11" letter-spacing="3">DECODER</text>
    <text x="820" y="68" class="display" fill="#f5efe6" font-size="22" font-weight="700">Q_dec</text>
    <text x="820" y="100" class="mono" fill="#f5efe6" font-size="13">current state</text>
    <text x="820" y="130" class="mono" fill="#f8e6cf" font-size="11">from masked self-attn</text>
  </g>
</g>

<!-- AUTOREGRESSIVE LOOP -->
<g transform="translate(60, 1580)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE AUTOREGRESSIVE GENERATION LOOP</text>
  <text y="30" class="display ink" font-size="28" font-weight="700">One token per step. Append. Repeat. Halt at &lt;end&gt;.</text>

  <g transform="translate(0, 60)">
    <!-- Step boxes -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="230" height="120" class="paper-2" stroke="#d4c9b5"/>
      <text x="20" y="30" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">STEP 1</text>
      <text x="20" y="60" class="display ink" font-size="18" font-weight="700">Input</text>
      <text x="20" y="85" class="mono ink" font-size="14">&lt;start&gt;</text>
      <text x="20" y="108" class="ink-soft" font-size="13">→ predict j'aime</text>
    </g>
    <text x="240" y="68" class="display ink" font-size="28">→</text>
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="230" height="120" class="paper-2" stroke="#d4c9b5"/>
      <text x="20" y="30" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">STEP 2</text>
      <text x="20" y="60" class="display ink" font-size="18" font-weight="700">Input</text>
      <text x="20" y="85" class="mono ink" font-size="14">&lt;start&gt; j'aime</text>
      <text x="20" y="108" class="ink-soft" font-size="13">→ predict l'IA</text>
    </g>
    <text x="500" y="68" class="display ink" font-size="28">→</text>
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="230" height="120" class="paper-2" stroke="#d4c9b5"/>
      <text x="20" y="30" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">STEP 3</text>
      <text x="20" y="60" class="display ink" font-size="18" font-weight="700">Input</text>
      <text x="20" y="85" class="mono ink" font-size="14">&lt;start&gt; j'aime l'IA</text>
      <text x="20" y="108" class="ink-soft" font-size="13">→ predict &lt;end&gt;</text>
    </g>
    <text x="760" y="68" class="display ink" font-size="28">→</text>
    <g transform="translate(780, 0)">
      <rect x="0" y="0" width="200" height="120" fill="#1f1a14"/>
      <text x="20" y="30" class="mono" fill="#5ba0a8" font-size="11" font-weight="700" letter-spacing="2">STEP 4</text>
      <text x="20" y="65" class="display" fill="#f5efe6" font-size="20" font-weight="700">HALT</text>
      <text x="20" y="92" class="mono" fill="#f8e6cf" font-size="14">j'aime l'IA</text>
      <text x="20" y="110" class="mono" fill="#5ba0a8" font-size="11">final output</text>
    </g>
  </g>
</g>

<!-- ENCODER/DECODER/BOTH -->
<g transform="translate(60, 1820)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">PICK ONE: ENCODER · DECODER · BOTH</text>
  <g transform="translate(0, 30)">
    <rect x="0" y="0" width="313" height="170" fill="rgba(42, 93, 98, 0.08)" stroke="#2a5d62" stroke-width="1"/>
    <text x="20" y="32" class="display ink" font-size="22" font-weight="700">Encoder-only</text>
    <text x="20" y="60" class="mono teal" font-size="13" font-weight="700">BERT · RoBERTa</text>
    <text x="20" y="92" class="ink-soft" font-size="14">Bidirectional self-attention.</text>
    <text x="20" y="112" class="ink-soft" font-size="14">Best for understanding:</text>
    <text x="20" y="132" class="ink" font-size="14">classification, NER,</text>
    <text x="20" y="152" class="ink" font-size="14">retrieval embeddings.</text>

    <rect x="333" y="0" width="313" height="170" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-width="1"/>
    <text x="353" y="32" class="display ink" font-size="22" font-weight="700">Decoder-only</text>
    <text x="353" y="60" class="mono terracotta" font-size="13" font-weight="700">GPT · LLaMA · Mistral</text>
    <text x="353" y="92" class="ink-soft" font-size="14">Masked self-attn only.</text>
    <text x="353" y="112" class="ink-soft" font-size="14"><tspan font-weight="700">No cross-attention.</tspan></text>
    <text x="353" y="132" class="ink" font-size="14">Best for generation:</text>
    <text x="353" y="152" class="ink" font-size="14">text, chat, code.</text>

    <rect x="666" y="0" width="314" height="170" fill="rgba(200, 155, 60, 0.10)" stroke="#c89b3c" stroke-width="1"/>
    <text x="686" y="32" class="display ink" font-size="22" font-weight="700">Encoder-Decoder</text>
    <text x="686" y="60" class="mono ochre" font-size="13" font-weight="700">Original Transformer · T5 · BART</text>
    <text x="686" y="92" class="ink-soft" font-size="14">Both halves. Cross-attn.</text>
    <text x="686" y="112" class="ink-soft" font-size="14">Best for seq2seq:</text>
    <text x="686" y="132" class="ink" font-size="14">translation,</text>
    <text x="686" y="152" class="ink" font-size="14">summarization.</text>
  </g>
</g>

<!-- CORRECTIONS STRIP -->
<g transform="translate(60, 2090)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">KEY CORRECTIONS FROM THE TRANSCRIPT</text>
  <g transform="translate(0, 30)">
    <rect x="0" y="0" width="980" height="40" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-dasharray="4,3"/>
    <text x="14" y="26" class="mono terracotta" font-size="12" font-weight="700">"Add &amp; Norm = concat"</text>
    <text x="220" y="26" class="ink" font-size="14">→ <tspan font-weight="700">residual addition + LayerNorm</tspan>; shape stays at d_model</text>

    <rect x="0" y="48" width="980" height="40" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-dasharray="4,3"/>
    <text x="14" y="74" class="mono terracotta" font-size="12" font-weight="700">"Linear = activation"</text>
    <text x="200" y="74" class="ink" font-size="14">→ linear is a <tspan font-weight="700">learned matrix mult</tspan> (W·x + b); softmax is the activation</text>

    <rect x="0" y="96" width="980" height="40" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-dasharray="4,3"/>
    <text x="14" y="122" class="mono terracotta" font-size="12" font-weight="700">"&lt;end&gt; is a French word"</text>
    <text x="240" y="122" class="ink" font-size="14">→ <tspan font-weight="700">special token</tspan> (&lt;/s&gt; / &lt;eos&gt;), not a real word</text>

    <rect x="0" y="144" width="980" height="40" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-dasharray="4,3"/>
    <text x="14" y="170" class="mono terracotta" font-size="12" font-weight="700">"All parallel"</text>
    <text x="140" y="170" class="ink" font-size="14">→ training/encoder: yes; <tspan font-weight="700">decoder inference: sequential</tspan> (one token / step)</text>

    <rect x="0" y="192" width="980" height="40" fill="rgba(184, 71, 46, 0.06)" stroke="#b8472e" stroke-dasharray="4,3"/>
    <text x="14" y="218" class="mono terracotta" font-size="12" font-weight="700">"GPT slightly different"</text>
    <text x="220" y="218" class="ink" font-size="14">→ specifically: <tspan font-weight="700">no encoder, no cross-attention</tspan>; masked self-attn + FFN only</text>
  </g>
</g>

<!-- FOOTER -->
<line x1="60" y1="2400" x2="1040" y2="2400" stroke="#1f1a14" stroke-width="2"/>
<text x="60" y="2435" class="mono ink-mute" font-size="11" letter-spacing="2">SESSION 10 · 2026-05-18</text>
<text x="1040" y="2435" text-anchor="end" class="mono ink-mute" font-size="11" letter-spacing="2">VASWANI ET AL. 2017 · ALAMMAR · HUGGING FACE</text>

</svg>
