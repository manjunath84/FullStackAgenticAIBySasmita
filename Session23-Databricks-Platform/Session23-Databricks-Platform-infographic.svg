<svg viewBox="0 0 1200 1500" xmlns="http://www.w3.org/2000/svg" font-family="'Spectral', serif">
  <!-- Embedded font import for standalone rendering -->
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,700&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1500" fill="#f5efe6"/>

  <!-- Eyebrow -->
  <text x="60" y="70" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="6" fill="#b8472e" font-weight="700">SESSION 23 · DATABRICKS FOR AI ENGINEERS</text>

  <!-- Title -->
  <text x="60" y="150" font-family="'Fraunces', serif" font-size="72" font-style="italic" font-weight="700" fill="#1f1a14">Databricks, in one</text>
  <text x="60" y="225" font-family="'Fraunces', serif" font-size="72" font-style="italic" font-weight="700" fill="#b8472e">page.</text>

  <!-- Subtitle -->
  <text x="60" y="280" font-family="'Spectral', serif" font-size="22" font-style="italic" fill="#4a4239">Storage + governance + analytics + agent runtime + model serving, one bill.</text>

  <!-- Divider -->
  <line x1="60" y1="320" x2="1140" y2="320" stroke="#1f1a14" stroke-width="2"/>

  <!-- Block 1: The 3-layer Unity Catalog path -->
  <text x="60" y="380" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3" fill="#b8472e" font-weight="700">01 · UNITY CATALOG · 3-LAYER PATH</text>
  <text x="60" y="425" font-family="'Fraunces', serif" font-size="32" font-style="italic" font-weight="700" fill="#1f1a14">catalog → schema → table | volume | view</text>

  <rect x="60" y="460" width="240" height="90" fill="#2a5d62"/>
  <text x="180" y="500" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="3" fill="#f5efe6" font-weight="700">CATALOG</text>
  <text x="180" y="525" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f5efe6" opacity="0.9">fraud_detection</text>

  <text x="320" y="513" text-anchor="middle" font-size="28" fill="#1f1a14">→</text>

  <rect x="340" y="460" width="240" height="90" fill="#c89b3c"/>
  <text x="460" y="500" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="3" fill="#1f1a14" font-weight="700">SCHEMA</text>
  <text x="460" y="525" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1f1a14" opacity="0.9">drg_shift</text>

  <text x="600" y="513" text-anchor="middle" font-size="28" fill="#1f1a14">→</text>

  <rect x="620" y="460" width="170" height="90" fill="#b8472e"/>
  <text x="705" y="500" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2" fill="#f5efe6" font-weight="700">TABLE</text>
  <text x="705" y="525" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f5efe6" opacity="0.9">rows + columns</text>

  <rect x="800" y="460" width="170" height="90" fill="#5ba0a8"/>
  <text x="885" y="500" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2" fill="#1f1a14" font-weight="700">VOLUME</text>
  <text x="885" y="525" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1f1a14" opacity="0.9">PDFs / files</text>

  <rect x="980" y="460" width="160" height="90" fill="#d96d4a"/>
  <text x="1060" y="500" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2" fill="#f5efe6" font-weight="700">VIEW</text>
  <text x="1060" y="525" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f5efe6" opacity="0.9">scoped subset</text>

  <text x="60" y="595" font-family="'Spectral', serif" font-style="italic" font-size="16" fill="#4a4239">Genie, MLflow, dashboards, Databricks Apps — all address data by the three-part name. Skip the catalog and the agent has nothing to point at.</text>

  <!-- Divider -->
  <line x1="60" y1="640" x2="1140" y2="640" stroke="#d4c9b5" stroke-width="1"/>

  <!-- Block 2: The Genie pipeline -->
  <text x="60" y="700" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3" fill="#b8472e" font-weight="700">02 · GENIE · TEXT-TO-SQL AS A TOOL</text>
  <text x="60" y="745" font-family="'Fraunces', serif" font-size="32" font-style="italic" font-weight="700" fill="#1f1a14">prompt → Planner → SQL → result → chart</text>

  <!-- Pipeline -->
  <g transform="translate(60, 780)">
    <rect x="0" y="0" width="195" height="70" fill="#1f1a14"/>
    <text x="97" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f5efe6" font-weight="700">PROMPT</text>
    <text x="97" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f5efe6" opacity="0.85">"trip distance distribution"</text>

    <text x="207" y="42" font-size="20" fill="#1f1a14">→</text>

    <rect x="225" y="0" width="195" height="70" fill="#2a5d62"/>
    <text x="322" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f5efe6" font-weight="700">PLANNER</text>
    <text x="322" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f5efe6" opacity="0.85">decompose subtasks</text>

    <text x="432" y="42" font-size="20" fill="#1f1a14">→</text>

    <rect x="450" y="0" width="195" height="70" fill="#c89b3c"/>
    <text x="547" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#1f1a14" font-weight="700">SQL GEN</text>
    <text x="547" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1f1a14" opacity="0.85">SELECT MIN/MAX/AVG…</text>

    <text x="657" y="42" font-size="20" fill="#1f1a14">→</text>

    <rect x="675" y="0" width="195" height="70" fill="#b8472e"/>
    <text x="772" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f5efe6" font-weight="700">EXECUTE</text>
    <text x="772" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f5efe6" opacity="0.85">on Spark cluster</text>

    <text x="882" y="42" font-size="20" fill="#1f1a14">→</text>

    <rect x="900" y="0" width="180" height="70" fill="#5ba0a8"/>
    <text x="990" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#1f1a14" font-weight="700">RESULT + CHART</text>
    <text x="990" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1f1a14" opacity="0.85">+ SQL + explanation</text>
  </g>

  <!-- Genie Space anatomy -->
  <text x="60" y="900" font-family="'Fraunces', serif" font-size="22" font-style="italic" font-weight="700" fill="#1f1a14">A Genie Space holds six slots</text>

  <g transform="translate(60, 920)">
    <rect x="0" y="0" width="350" height="50" fill="#ede5d6" stroke="#d4c9b5"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8472e">SELECTED TABLES</text>
    <text x="14" y="40" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4a4239">scope · which catalog.schema.tables in play</text>

    <rect x="365" y="0" width="350" height="50" fill="#ede5d6" stroke="#d4c9b5"/>
    <text x="379" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8472e">DISPLAY NAME + DESCRIPTION</text>
    <text x="379" y="40" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4a4239">per column · mandatory · disambiguates</text>

    <rect x="730" y="0" width="350" height="50" fill="#ede5d6" stroke="#d4c9b5"/>
    <text x="744" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8472e">HIDDEN COLUMNS</text>
    <text x="744" y="40" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4a4239">cut noise on 400-column tables</text>

    <rect x="0" y="60" width="350" height="50" fill="#ede5d6" stroke="#d4c9b5"/>
    <text x="14" y="82" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8472e">GENERAL INSTRUCTIONS</text>
    <text x="14" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4a4239">system prompt · business rules</text>

    <rect x="365" y="60" width="350" height="50" fill="#ede5d6" stroke="#d4c9b5"/>
    <text x="379" y="82" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8472e">JOINS</text>
    <text x="379" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4a4239">declared ON clauses · Genie reuses</text>

    <rect x="730" y="60" width="350" height="50" fill="#ede5d6" stroke="#d4c9b5"/>
    <text x="744" y="82" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8472e">SQL EXPRESSIONS</text>
    <text x="744" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4a4239">saved queries · called as tools</text>
  </g>

  <!-- API call -->
  <rect x="60" y="1055" width="1080" height="80" fill="#1f1a14"/>
  <text x="80" y="1085" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#d96d4a" font-weight="700">EXTERNAL CALL · STREAMLIT / LANGGRAPH / SLACK</text>
  <text x="80" y="1112" font-family="'JetBrains Mono', monospace" font-size="15" fill="#f5efe6">POST /api/2.0/genie/spaces/{space_id}/start-conversation</text>

  <!-- Divider -->
  <line x1="60" y1="1175" x2="1140" y2="1175" stroke="#d4c9b5" stroke-width="1"/>

  <!-- Block 3: corrections strip -->
  <text x="60" y="1220" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3" fill="#b8472e" font-weight="700">03 · TRANSCRIPT CORRECTIONS</text>

  <g transform="translate(60, 1240)" font-family="'Spectral', serif">
    <rect x="0" y="0" width="350" height="100" fill="#f7e8e3" stroke="#b8472e" stroke-dasharray="3,3"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8472e">DL CANNOT BE DISTRIBUTED</text>
    <text x="14" y="48" font-size="12" fill="#1f1a14">False. FSDP, ZeRO, data/model</text>
    <text x="14" y="64" font-size="12" fill="#1f1a14">parallelism exist. True for Spark</text>
    <text x="14" y="80" font-size="12" fill="#1f1a14">MLlib specifically — Spark's</text>
    <text x="14" y="96" font-size="12" fill="#1f1a14">engine doesn't fit dense training.</text>

    <rect x="365" y="0" width="350" height="100" fill="#f7e8e3" stroke="#b8472e" stroke-dasharray="3,3"/>
    <text x="379" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8472e">AGENTBRICKS &lt; LANGGRAPH</text>
    <text x="379" y="48" font-size="12" fill="#1f1a14">Misframed. Agent Bricks is the</text>
    <text x="379" y="64" font-size="12" fill="#1f1a14">governance + deploy layer; it</text>
    <text x="379" y="80" font-size="12" fill="#1f1a14">supports LangGraph as authoring.</text>
    <text x="379" y="96" font-size="12" fill="#1f1a14">You use both, not "instead of".</text>

    <rect x="730" y="0" width="350" height="100" fill="#f7e8e3" stroke="#b8472e" stroke-dasharray="3,3"/>
    <text x="744" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#b8472e">"GPT-OS 120 BILLION"</text>
    <text x="744" y="48" font-size="12" fill="#1f1a14">Correct name: gpt-oss-120b.</text>
    <text x="744" y="64" font-size="12" fill="#1f1a14">OpenAI open-weight (Apache 2.0),</text>
    <text x="744" y="80" font-size="12" fill="#1f1a14">Aug 2025. Runs on one 80 GB GPU,</text>
    <text x="744" y="96" font-size="12" fill="#1f1a14">hosted in Foundation Model API.</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="1400" x2="1140" y2="1400" stroke="#1f1a14" stroke-width="2"/>
  <text x="60" y="1430" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#8b7d65">SASMITA COURSE · SESSION 23 · 2026-05-20 · REV V1</text>
  <text x="1140" y="1430" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#8b7d65">NEXT · S24 STREAMLIT + GENIE</text>
  <text x="60" y="1458" font-family="'Spectral', serif" font-style="italic" font-size="14" fill="#4a4239">Failure tell — silent wrong-column picks always trace to missing data dictionaries. Write the descriptions first; the rest is mechanical.</text>
</svg>
