<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2200" font-family="'Spectral', 'Iowan Old Style', Georgia, serif">
<defs>
<style>
.paper { fill: #f5efe6; }
.paper-2 { fill: #ede5d6; }
.highlight { fill: #f8e6cf; }
.ink { fill: #1f1a14; }
.ink-soft { fill: #4a4239; }
.ink-mute { fill: #8b7d65; }
.line-c { stroke: #d4c9b5; }
.terracotta { fill: #b8472e; }
.terracotta-stroke { stroke: #b8472e; }
.terracotta-light { fill: #d96d4a; }
.teal { fill: #2a5d62; }
.teal-stroke { stroke: #2a5d62; }
.teal-light { fill: #5ba0a8; }
.ochre { fill: #c89b3c; }
.ochre-stroke { stroke: #c89b3c; }
.green { fill: #6db33f; }
.mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
.display { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-style: italic; }
</style>
<pattern id="dots" patternUnits="userSpaceOnUse" width="100" height="100">
  <circle cx="20" cy="30" r="0.6" fill="#1f1a14" opacity="0.06"/>
  <circle cx="70" cy="80" r="0.5" fill="#1f1a14" opacity="0.04"/>
</pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f1a14"/>
</marker>
<marker id="arrow-terra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8472e"/>
</marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a5d62"/>
</marker>
</defs>

<rect width="1100" height="2200" class="paper"/>
<rect width="1100" height="2200" fill="url(#dots)"/>

<!-- HEADER -->
<text x="60" y="80" class="mono terracotta" font-size="13" font-weight="700" letter-spacing="6">SESSION 18 · AGENTS &amp; TOOLS</text>
<text x="60" y="170" class="display ink" font-size="80" font-weight="700" letter-spacing="-1">From LLM</text>
<text x="60" y="250" class="display terracotta" font-size="80" font-weight="700" letter-spacing="-1">to Agent.</text>
<line x1="60" y1="280" x2="1040" y2="280" stroke="#1f1a14" stroke-width="2"/>
<text x="60" y="320" class="ink-soft display" font-size="22">Wrap the model in a loop. Give it tools. Give it memory.</text>
<text x="60" y="365" class="mono ink-mute" font-size="11" letter-spacing="2">LANGCHAIN · @tool · create_react_agent (langgraph.prebuilt) · YAO ET AL. 2022</text>

<!-- THE DEFINITION -->
<g transform="translate(60, 420)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE DIFFERENCE</text>

  <!-- LLM box -->
  <g transform="translate(0, 30)">
    <rect width="470" height="180" class="paper-2" stroke="#d4c9b5"/>
    <text x="24" y="40" class="mono ink-mute" font-size="11" letter-spacing="2">LLM</text>
    <text x="24" y="80" class="display ink" font-size="28" font-weight="700">Thinks.</text>
    <text x="24" y="118" class="ink-soft" font-size="15">Reads text, samples next tokens.</text>
    <text x="24" y="142" class="ink-soft" font-size="15">Cannot click, call, write, fetch.</text>
    <text x="24" y="166" class="ink-soft" font-size="15">Stateless per call.</text>
  </g>

  <!-- AGENT box -->
  <g transform="translate(510, 30)">
    <rect width="470" height="180" fill="#f8e6cf" stroke="#b8472e" stroke-width="2"/>
    <text x="24" y="40" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">AGENT</text>
    <text x="24" y="80" class="display ink" font-size="28" font-weight="700">Thinks <tspan class="terracotta">+ acts + corrects.</tspan></text>
    <text x="24" y="118" class="ink-soft" font-size="15">LLM inside a loop that calls tools,</text>
    <text x="24" y="142" class="ink-soft" font-size="15">reads their results, decides next step.</text>
    <text x="24" y="166" class="ink-soft" font-size="15">Loop lives in your framework, not the model.</text>
  </g>
</g>

<!-- THE THREE LEGS -->
<g transform="translate(60, 670)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THREE LEGS OF AN AGENT</text>
  <text y="36" class="display ink" font-size="34" font-weight="700">Plan · Tools · Memory.</text>
  <text y="68" class="ink-soft" font-size="15">Miss any one and it isn't really an agent.</text>

  <g transform="translate(0, 100)">
    <rect width="305" height="160" class="paper-2" stroke="#d4c9b5"/>
    <text x="20" y="34" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">PLAN · ACT · CORRECT</text>
    <text x="20" y="68" class="display ink" font-size="20" font-weight="700">Reason, act, react.</text>
    <text x="20" y="98" class="ink-soft" font-size="14">Break task into steps.</text>
    <text x="20" y="120" class="ink-soft" font-size="14">Take an action.</text>
    <text x="20" y="142" class="ink-soft" font-size="14">Read result. Try again if wrong.</text>
  </g>

  <g transform="translate(338, 100)">
    <rect width="305" height="160" class="paper-2" stroke="#d4c9b5"/>
    <text x="20" y="34" class="mono teal" font-size="11" font-weight="700" letter-spacing="2">TOOLS</text>
    <text x="20" y="68" class="display ink" font-size="20" font-weight="700">Hands &amp; eyes.</text>
    <text x="20" y="98" class="ink-soft" font-size="14">Your Python functions.</text>
    <text x="20" y="120" class="ink-soft" font-size="14">Third-party APIs.</text>
    <text x="20" y="142" class="ink-soft" font-size="14">Databases, search, files.</text>
  </g>

  <g transform="translate(676, 100)">
    <rect width="305" height="160" class="paper-2" stroke="#d4c9b5"/>
    <text x="20" y="34" class="mono ochre" font-size="11" font-weight="700" letter-spacing="2">MEMORY</text>
    <text x="20" y="68" class="display ink" font-size="20" font-weight="700">Continuity.</text>
    <text x="20" y="98" class="ink-soft" font-size="14">Past turns this session.</text>
    <text x="20" y="120" class="ink-soft" font-size="14">User history across sessions.</text>
    <text x="20" y="142" class="ink-soft" font-size="14">Without it: amnesia every turn.</text>
  </g>
</g>

<!-- @tool DECORATOR -->
<g transform="translate(60, 980)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE @tool DECORATOR</text>
  <text y="36" class="display ink" font-size="34" font-weight="700">A Python function the LLM can pick.</text>

  <!-- Code block -->
  <g transform="translate(0, 80)">
    <rect width="600" height="240" fill="#1f1a14"/>
    <text x="24" y="38" class="mono" fill="#f5efe6" font-size="13"><tspan fill="#c89b3c">from</tspan> langchain_core.tools <tspan fill="#c89b3c">import</tspan> tool</text>
    <text x="24" y="80" class="mono" fill="#5ba0a8" font-size="13">@tool</text>
    <text x="24" y="104" class="mono" fill="#f5efe6" font-size="13"><tspan fill="#c89b3c">def</tspan> <tspan fill="#d96d4a">multiply</tspan>(a: <tspan fill="#5ba0a8">float</tspan>, b: <tspan fill="#5ba0a8">float</tspan>) -&gt; <tspan fill="#5ba0a8">float</tspan>:</text>
    <text x="50" y="136" class="mono" fill="#8b7d65" font-size="12">"""Multiply two numbers.</text>
    <text x="50" y="156" class="mono" fill="#8b7d65" font-size="12">Use when the user asks for multiplication."""</text>
    <text x="50" y="190" class="mono" fill="#f5efe6" font-size="13"><tspan fill="#c89b3c">return</tspan> a * b</text>
    <text x="24" y="222" class="mono" fill="#8b7d65" font-size="11">↑ name from fn  ↑ args schema from type hints  ↑ description from docstring</text>
  </g>

  <!-- The 3 things derived -->
  <g transform="translate(640, 80)">
    <rect width="340" height="240" class="paper-2" stroke="#d4c9b5"/>
    <text x="24" y="36" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">WHAT THE LLM SEES</text>
    <text x="24" y="70" class="display ink" font-size="18" font-weight="700">A menu printed into</text>
    <text x="24" y="94" class="display ink" font-size="18" font-weight="700">its system prompt.</text>
    <text x="24" y="128" class="ink-soft" font-size="14">name: <tspan class="mono">multiply</tspan></text>
    <text x="24" y="152" class="ink-soft" font-size="14">args: <tspan class="mono">{a: float, b: float}</tspan></text>
    <text x="24" y="176" class="ink-soft" font-size="14">desc: <tspan class="mono">"Multiply two..."</tspan></text>
    <text x="24" y="216" class="terracotta" font-size="13" font-style="italic">The docstring is what routes</text>
    <text x="24" y="232" class="terracotta" font-size="13" font-style="italic">the call. Be specific.</text>
  </g>
</g>

<!-- REACT LOOP -->
<g transform="translate(60, 1380)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE REACT LOOP</text>
  <text y="36" class="display ink" font-size="34" font-weight="700">create_react_agent(llm, tools, prompt)</text>
  <text y="68" class="ink-soft" font-size="14" font-style="italic">Reason ↔ Act. Yao et al. 2022 (arXiv:2210.03629).</text>

  <!-- Loop diagram -->
  <g transform="translate(0, 100)">
    <!-- User input -->
    <rect x="380" y="0" width="220" height="56" class="paper-2" stroke="#1f1a14"/>
    <text x="490" y="34" text-anchor="middle" class="mono ink" font-size="13">user message</text>

    <!-- arrow down to LLM -->
    <line x1="490" y1="56" x2="490" y2="96" stroke="#1f1a14" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- LLM -->
    <rect x="320" y="96" width="340" height="80" fill="#f8e6cf" stroke="#b8472e" stroke-width="2"/>
    <text x="490" y="130" text-anchor="middle" class="display ink" font-size="22" font-weight="700">LLM</text>
    <text x="490" y="156" text-anchor="middle" class="ink-soft" font-size="13">call a tool? or answer?</text>

    <!-- Arrow right to tool -->
    <path d="M 660 136 L 800 136" stroke="#2a5d62" stroke-width="1.5" fill="none" marker-end="url(#arrow-teal)"/>
    <text x="730" y="124" text-anchor="middle" class="mono teal" font-size="11">tool_calls</text>

    <!-- Tool runner -->
    <rect x="800" y="96" width="200" height="80" class="paper-2" stroke="#2a5d62" stroke-width="2"/>
    <text x="900" y="130" text-anchor="middle" class="display teal" font-size="20" font-weight="700">Tool runner</text>
    <text x="900" y="156" text-anchor="middle" class="ink-soft" font-size="13">runs your code</text>

    <!-- Loop arrow down + back to LLM -->
    <path d="M 900 176 L 900 230 L 490 230 L 490 176" stroke="#2a5d62" stroke-width="1.5" fill="none" marker-end="url(#arrow-teal)"/>
    <text x="700" y="252" text-anchor="middle" class="mono teal" font-size="11">ToolMessage → back into prompt</text>

    <!-- Final answer -->
    <path d="M 320 136 L 180 136" stroke="#1f1a14" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="250" y="124" text-anchor="middle" class="mono ink-mute" font-size="11">no tool calls</text>
    <rect x="0" y="96" width="180" height="80" fill="#1f1a14"/>
    <text x="90" y="130" text-anchor="middle" class="display" fill="#f5efe6" font-size="20" font-weight="700">answer</text>
    <text x="90" y="156" text-anchor="middle" class="mono" fill="#8b7d65" font-size="12">last AIMessage</text>
  </g>

  <!-- Footnote -->
  <g transform="translate(0, 400)">
    <rect width="980" height="64" fill="#f8e6cf" stroke="#b8472e" stroke-dasharray="4 3"/>
    <text x="20" y="28" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">NAMING NOTE</text>
    <text x="20" y="50" class="ink-soft" font-size="13">Modern agents emit a structured <tspan class="mono">tool_calls</tspan> JSON field — not the literal <tspan class="mono">Thought:/Action:/Observation:</tspan> text from the ReAct paper. Same control flow, cleaner wire format.</text>
  </g>
</g>

<!-- ECOSYSTEM -->
<g transform="translate(60, 1900)">
  <text class="mono terracotta" font-size="11" font-weight="700" letter-spacing="3">THE FOUR-PRODUCT STACK</text>

  <g transform="translate(0, 40)">
    <rect width="235" height="180" class="paper-2" stroke="#d4c9b5"/>
    <text x="20" y="34" class="mono terracotta" font-size="11" font-weight="700" letter-spacing="2">LANGCHAIN</text>
    <text x="20" y="66" class="display ink" font-size="18" font-weight="700">One agent.</text>
    <text x="20" y="98" class="ink-soft" font-size="13">Models, prompts,</text>
    <text x="20" y="118" class="ink-soft" font-size="13">tools, parsers,</text>
    <text x="20" y="138" class="ink-soft" font-size="13">short-term memory.</text>
    <text x="20" y="168" class="mono ink-mute" font-size="11">building blocks</text>
  </g>

  <g transform="translate(250, 40)">
    <rect width="235" height="180" class="paper-2" stroke="#d4c9b5"/>
    <text x="20" y="34" class="mono teal" font-size="11" font-weight="700" letter-spacing="2">LANGGRAPH</text>
    <text x="20" y="66" class="display ink" font-size="18" font-weight="700">Many agents.</text>
    <text x="20" y="98" class="ink-soft" font-size="13">State graphs,</text>
    <text x="20" y="118" class="ink-soft" font-size="13">conditional edges,</text>
    <text x="20" y="138" class="ink-soft" font-size="13">human-in-the-loop.</text>
    <text x="20" y="168" class="mono ink-mute" font-size="11">orchestration</text>
  </g>

  <g transform="translate(500, 40)">
    <rect width="235" height="180" class="paper-2" stroke="#d4c9b5"/>
    <text x="20" y="34" class="mono ochre" font-size="11" font-weight="700" letter-spacing="2">LANGSMITH</text>
    <text x="20" y="66" class="display ink" font-size="18" font-weight="700">Hosted traces.</text>
    <text x="20" y="98" class="ink-soft" font-size="13">SaaS, paid API.</text>
    <text x="20" y="118" class="ink-soft" font-size="13">Eval + observability.</text>
    <text x="20" y="138" class="ink-soft" font-size="13">By LangChain Inc.</text>
    <text x="20" y="168" class="mono ink-mute" font-size="11">observability (paid)</text>
  </g>

  <g transform="translate(750, 40)">
    <rect width="235" height="180" class="paper-2" stroke="#d4c9b5"/>
    <text x="20" y="34" class="mono green" font-size="11" font-weight="700" letter-spacing="2">LANGFUSE</text>
    <text x="20" y="66" class="display ink" font-size="18" font-weight="700">Self-hosted.</text>
    <text x="20" y="98" class="ink-soft" font-size="13">Apache-2.0, OSS.</text>
    <text x="20" y="118" class="ink-soft" font-size="13">Same surface as</text>
    <text x="20" y="138" class="ink-soft" font-size="13">LangSmith.</text>
    <text x="20" y="168" class="mono ink-mute" font-size="11">observability (free)</text>
  </g>
</g>

<!-- FOOTER -->
<line x1="60" y1="2160" x2="1040" y2="2160" class="line-c" stroke-width="1"/>
<text x="60" y="2185" class="mono ink-mute" font-size="10" letter-spacing="2">SASMITA COHORT · SESSION 18 · 2026-05-19  ·  next: short-term memory + a live agent demo</text>
</svg>
